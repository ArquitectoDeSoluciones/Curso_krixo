e a las organizaciones les importa mucho: el cumplimiento. Existen marcos internacionales, como la norma ISO 27001 o el marco de ciberseguridad del NIST, que describen cómo debe gestionarse la seguridad de la información. Todos tienen algo en común: no basta con decir que se hace, hay que poder demostrarlo. Lo mismo pasa con las leyes de protección de datos personales.", "Por eso, cuando una organización gestiona sus casos con evidencia y trazabilidad, no solo está más segura: también está lista para una auditoría sin tener que pasar semanas buscando correos."], "slug": "cumplimiento"}, {"heading": "Medir", "kind": "normal", "paras": ["Para cerrar el curso, dos ideas: lo que no se mide no se mejora, mientras que la mejor forma de enfrentar un incidente es haberlo ensayado antes.", "Para saber si la gestión funciona, hay que medirla. No hace falta un tablero complejo; con pocos indicadores se entiende mucho. Cuántos casos hay abiertos. Cuánto se tarda en promedio en responder, que en seguridad se conoce como tiempo medio de respuesta. Qué porcentaje de los casos se resuelve dentro del plazo. La tendencia: ¿estamos mejorando o empeorando?", "Muchas organizaciones también usan un indicador general de riesgo, un número que resume su exposición y que permite ver en un vistazo si algo cambió. Cuando ese número sube de un día a otro, la pregunta no es \"qué susto\", sino \"qué cambió\"; ahí se baja al detalle para gestionarlo."], "slug": "medir"}, {"heading": "El plan de respuesta a incidentes", "kind": "normal", "paras": ["Ahora, a pesar de todo, algún día puede pasar algo grande. Para eso existe el plan de respuesta a incidentes, que tiene cinco momentos. Prepararse: saber de antemano quién decide, quién comunica y a quién se llama. Contener: evitar que el problema se extienda. Erradicar: eliminar la causa. Recuperar: volver a operar con normalidad. Por último, aprender: revisar qué pasó para que no vuelva a ocurrir."], "slug": "el-plan-de-respuesta-a-incidentes"}, {"heading": "Ensayar", "kind": "normal", "paras": ["La clave está en el primer momento. Las organizaciones que mejor responden son las que ensayaron. Igual que un simulacro de evacuación, practican un incidente ficticio y descubren dónde se traban: no sabían a quién llamar, el respaldo tardaba más de lo esperado, nadie sabía quién autorizaba comunicar a los clientes. Todo eso es mucho mejor descubrirlo un martes cualquiera que en medio de una crisis real."], "slug": "ensayar"}, {"heading": "Mejora continua", "kind": "normal", "paras": ["Con eso se cierra el ciclo que empezamos en el primer módulo: prevenir, detectar, responder, recuperar y aprender. Medir te dice dónde estás. Ensayar te dice si estás listo. Aprender de cada caso hace que el siguiente sea más fácil."], "slug": "mejora-continua"}, {"heading": "Para quien ya lleva años en esto", "kind": "expert", "paras": ["Si eres técnico, sabes que la evidencia también tiene que custodiarse: acceso controlado, retención definida, un registro de actividad que no se pueda modificar. Además, la evidencia que se maneja en seguridad suele tener información sensible, como credenciales o datos personales, así que su propio almacenamiento tiene que cumplir las mismas reglas que exige proteger.", "Con los indicadores pasa algo similar: los que más valor tienen ante la dirección no son los de volumen, como cuántas alertas llegaron, sino los de resultado: cuánto riesgo se redujo, en cuánto tiempo, con qué cumplimiento. Esos son los que justifican la inversión, los que permiten tener una conversación de negocio, no solo técnica."], "slug": "para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["La evidencia demuestra qué se hizo; la trazabilidad permite reconstruir la historia. El hash junto con la fecha prueba que la evidencia no se alteró. Los marcos y las leyes exigen demostrar, no solo afirmar.", "Del lado de la mejora, lo que no se mide no se mejora. Un plan de respuesta que nunca se ensayó no sirve cuando llega el momento, mientras que cada caso cerrado deja algo para aprender."], "slug": "lo-que-debes-llevarte"}, {"heading": "Cierre del curso", "kind": "closing", "paras": ["Con esto terminamos el curso. Empezamos preguntándonos qué es la ciberseguridad; hoy terminas sabiendo que no es un antivirus ni algo que se compra: es entender qué tienes, qué está expuesto, quién lo podría aprovechar. Sobre todo, es gestionar cada hallazgo hasta que esté resuelto.", "La ciberseguridad no empieza cuando ocurre un ataque. Empieza mucho antes, entendiendo qué información está expuesta, qué amenazas existen y qué podemos hacer para anticiparnos a ellas.", "Responde el check de esta clase junto con el cuestionario final del módulo para obtener tu certificado. Gracias por acompañarnos."], "slug": "cierre-del-curso"}], "check": [{"q": "Seis meses después de cerrar un caso, un auditor pide reconstruir quién hizo qué, cuándo y por qué. ¿Qué concepto lo permite?", "options": ["La trazabilidad", "El indicador de riesgo", "El playbook de respuesta", "El SLA de atención"], "rationales": ["Permite reconstruir la historia completa, como la historia clínica de un paciente.", "Resume la exposición general, pero no reconstruye un caso.", "Indica qué hacer, no lo que efectivamente se hizo.", "Define el plazo esperado, no el historial del caso."], "answer": 0, "refClass": 10, "ref": "Trazabilidad"}, {"q": "¿Cómo se demuestra que un archivo de evidencia no fue alterado desde que se guardó?", "options": ["Enviándolo por correo al auditor de inmediato", "Guardándolo en formato PDF sin contraseña", "Con su hash y la fecha y hora de registro", "Con una captura de pantalla adicional del archivo"], "rationales": ["El envío no prueba que el archivo no se haya modificado antes.", "El formato no garantiza que el contenido no haya cambiado.", "Si cambia una sola letra del archivo, el hash cambia por completo.", "Una captura también puede alterarse y no prueba integridad."], "answer": 2, "refClass": 10, "ref": "Cómo saber que no la cambiaron"}, {"q": "¿Qué tienen en común ISO 27001, el NIST CSF y las leyes de protección de datos personales?", "options": ["Reemplazan la necesidad de gestionar incidentes", "Exigen usar las mismas herramientas de seguridad", "Solo aplican a entidades del sector financiero", "Exigen poder demostrar lo que se hace"], "rationales": ["Exigen gestionarlos y poder demostrarlo.", "Describen cómo gestionar la seguridad, no qué herramientas usar.", "Aplican a organizaciones de muchos sectores.", "No basta con decir que se hace: hay que poder demostrarlo."], "answer": 3, "refClass": 10, "ref": "Cumplimiento"}, {"q": "¿Qué mide el tiempo medio de respuesta?", "options": ["Cuánto se tarda en promedio en atender los casos", "Qué porcentaje de casos se cierra dentro del plazo", "Cuánto tarda un proveedor en retirar un sitio", "Cuántos casos permanecen abiertos al final del mes"], "rationales": ["Es uno de los indicadores básicos para saber si la gestión funciona.", "Ese es el indicador de cumplimiento del SLA.", "Es una métrica de takedowns, no el tiempo medio de respuesta.", "Ese es el indicador de casos abiertos."], "answer": 0, "refClass": 10, "ref": "Medir"}, {"q": "¿Cuál es el orden correcto de los cinco momentos del plan de respuesta a incidentes?", "options": ["Contener, prepararse, recuperar, erradicar y aprender", "Detectar, contener, recuperar, erradicar y cerrar", "Prepararse, erradicar, contener, aprender y recuperar", "Prepararse, contener, erradicar, recuperar y aprender"], "rationales": ["La preparación ocurre antes del incidente, no durante.", "Recuperar antes de erradicar deja la causa activa.", "Primero se contiene para evitar que el problema se extienda.", "Primero se prepara; ante el incidente se contiene, se elimina la causa, se vuelve a operar y se aprende."], "answer": 3, "refClass": 10, "ref": "El plan de respuesta a incidentes"}, {"q": "¿Qué tipo de indicador aporta más valor ante la dirección?", "options": ["De resultado: riesgo reducido, tiempos y cumplimiento", "De volumen: cantidad de alertas recibidas", "De inventario: número de herramientas instaladas", "De actividad: horas trabajadas por el equipo"], "rationales": ["Son los que justifican la inversión y permiten una conversación de negocio.", "El volumen no dice si el riesgo bajó.", "Tener herramientas no demuestra reducción del riesgo.", "Mide esfuerzo, no resultados."], "answer": 0, "refClass": 10, "ref": "Para quien ya lleva años en esto"}], "words": 875}], "quiz": [{"q": "Una alerta crítica ya se detectó, se validó y se priorizó, pero el caso no avanza. ¿Qué etapa sigue según el ciclo de gestión?", "options": ["Respuesta", "Cierre", "Evidencia", "Asignación"], "ref": "Las etapas", "refClass": 9}, {"q": "Una entidad financiera detecta una campaña de phishing dirigida a su sector. ¿Qué acción fortalece a las demás entidades?", "options": ["Publicar los datos de las víctimas como alerta", "Mantenerla en reserva para no generar alarma", "Compartirla con el equipo sectorial de respuesta", "Esperar a que las demás la detecten por su cuenta"], "ref": "Compartir", "refClass": 9}, {"q": "¿Qué ocurre con un SLA que se incumple de forma sistemática?", "options": ["Se vuelve más efectivo porque genera presión", "Debe reemplazarse por un playbook automático", "Deja de aplicar a los casos de severidad baja", "Pierde credibilidad y debe ajustarse con datos"], "ref": "Para quien ya lleva años en esto", "refClass": 9}, {"q": "El indicador general de riesgo sube de forma abrupta de un día a otro. ¿Cuál es la reacción adecuada?", "options": ["Reiniciar el indicador para validar el cálculo", "Escalar a la junta directiva de inmediato", "Esperar al reporte mensual para confirmarlo", "Preguntar qué cambió y bajar al detalle"], "ref": "Medir", "refClass": 10}, {"q": "Durante un simulacro, el equipo descubre que nadie sabe quién autoriza comunicar a los clientes. ¿Qué valor aporta este hallazgo?", "options": ["Demuestra que el /* ---- Configuración editable: se lee del bloque JSON "krixo-config" (al inicio del <body>) ---- */
const CONFIG = (() => { try { return JSON.parse(document.getElementById('krixo-config').textContent) || {}; } catch (e) { return {}; } })();
const WEBHOOK_URL = String(CONFIG.WEBHOOK_URL || '').trim();
const TURNSTILE_SITE_KEY = String(CONFIG.TURNSTILE_SITE_KEY || '').trim();
const PRIVACY_URL = /^https:\/\//.test(String(CONFIG.PRIVACY_URL || '')) ? String(CONFIG.PRIVACY_URL).trim() : '';

const STORAGE_KEY = 'krixoAcademy.fundamentos.v4'; // prefijo de localStorage
const PASS_PCT = 80;           // aprobación de la evaluación del módulo
const MAX_ATTEMPTS = 3;        // intentos por evaluación de módulo
const PRACTICE_SIZE = 20;      // preguntas por evaluación de práctica
const WPM = 170;               // velocidad de lectura para estimar minutos

/* ---------- Índices ---------- */
const MODULES = COURSE_DATA.modules;
const CLASSES = [];
MODULES.forEach(m => m.classes.forEach(c => { c.moduleId = m.id; CLASSES.push(c); }));
const TOTAL_UNITS = CLASSES.length + MODULES.length;
const modById = id => MODULES.find(m => m.id === id);
const clsById = id => CLASSES.find(c => c.id === id);
const PRACTICE_POOL = [];
CLASSES.forEach(c => c.check.forEach((q, i) => PRACTICE_POOL.push({ id: `${c.id}-${i}`, cid: c.id, mid: c.moduleId, q })));
const poolById = id => PRACTICE_POOL.find(p => p.id === id);
const TOTAL_QUESTIONS = PRACTICE_POOL.length + MODULES.reduce((a, m) => a + m.quiz.length, 0);
const readMin = c => Math.max(1, Math.round(c.words / WPM));
const modMin = m => m.classes.reduce((a, c) => a + readMin(c), 0) + 6;
const COURSE_MIN = MODULES.reduce((a, m) => a + modMin(m), 0);

/* =========================================================================
   Estado y persistencia
   ========================================================================= */
function defaultState() {
  return { units: {}, exams: {}, practice: { session: null, history: [] }, scroll: {}, name: '', certDate: null, hideCompleted: false, updatedAt: 0 };
}
/* Almacenamiento local con respaldo en memoria (algunos visores bloquean localStorage) */
const MEM = {};
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return MEM[k] ?? null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { MEM[k] = v; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { delete MEM[k]; } }
const USER_KEY = 'krixo_user';
let USER = null; // { nombre, correo, cargo, registrado }
const stateKey = () => `${STORAGE_KEY}.${USER ? USER.correo : 'anon'}`;
function parseState(raw) { try { return raw ? Object.assign(defaultState(), typeof raw === 'string' ? JSON.parse(raw) : raw) : null; } catch (e) { return null; } }
let state = defaultState();
let theme = document.documentElement.getAttribute('data-theme') || 'dark';
function save() { state.updatedAt = Date.now(); lsSet(stateKey(), JSON.stringify(state)); }

/* ---- Comunicación con el servidor del curso (Google Apps Script) ---- */
const OUTBOX_KEY = 'krixo_outbox';
const webhookReady = () => !!WEBHOOK_URL && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(WEBHOOK_URL);
const ERR = {
  red: 'No hay conexión con el servidor del curso. Revisa tu Internet e inténtalo de nuevo.',
  ocupado: 'El servidor está ocupado en este momento. Espera un minuto e inténtalo de nuevo.',
  captcha: 'No pudimos confirmar que no eres un robot. Completa la verificación e inténtalo de nuevo.',
  datos: 'Revisa los datos ingresados.',
  consentimiento: 'Debes autorizar el tratamiento de tus datos para continuar.',
  demasiados_codigos: 'Solicitaste demasiados códigos. Espera una hora antes de pedir otro.',
  codigo: 'El código no es correcto.',
  codigo_vencido: 'El código venció. Solicita uno nuevo.',
  codigo_bloqueado: 'Superaste los intentos permitidos. Solicita un código nuevo.',
  sin_servidor: 'Esta acción requiere conexión con el servidor del curso.',
  ya_aprobado: 'Ya aprobaste esta evaluación.',
  modulo_anterior: 'Primero debes aprobar la evaluación del módulo anterior.',
  faltan_unidades: 'El servidor aún no registra todas las comprobaciones de este módulo. Verifica tu conexión y vuelve a enviar las comprobaciones pendientes.',
  sin_intentos: 'Agotaste los intentos de este módulo.',
  no_permitido: 'Esta acción no está permitida en este momento.',
  token_invalido: 'Tu sesión venció o no es válida. Vuelve a ingresar.',
  servidor: 'Ocurrió un error en el servidor. Inténtalo de nuevo en unos minutos.',
  formato: 'La solicitud no es válida.'
};
const errMsg = r => ERR[r && r.error] || ERR.servidor;
async function api(accion, datos) {
  if (!webhookReady()) return { ok: false, error: 'sin_servidor' };
  const body = Object.assign({ accion, honeypot: '' }, (USER && USER.token) ? { token: USER.token } : {}, datos || {});
  let j;
  try {
    // Petición "simple" (text/plain): no requiere preflight CORS y Apps Script la lee en e.postData.contents
    const r = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), credentials: 'omit', cache: 'no-store', redirect: 'follow' });
    j = await r.json();
  } catch (e) { return { ok: false, error: 'red' }; }
  if (!j || typeof j !== 'object') return { ok: false, error: 'servidor' };
  if (j.error === 'token_invalido' && USER) { sessionExpired(); return j; }
  if (j.estado) applyServerState(j.estado);
  return j;
}
/* Eventos de avance (checks y práctica): si no hay conexión quedan en cola y se reenvían */
async function sendEvent(accion, datos) {
  if (!webhookReady() || !USER) return;
  const r = await api(accion, datos);
  if (!r.ok && (r.error === 'red' || r.error === 'ocupado')) {
    let q = []; try { q = JSON.parse(lsGet(OUTBOX_KEY) || '[]'); } catch (_) {}
    q.push({ correo: USER.correo, accion, datos }); lsSet(OUTBOX_KEY, JSON.stringify(q.slice(-50)));
  }
}
async function flushOutbox() {
  if (!webhookReady() || !USER) return;
  let q = []; try { q = JSON.parse(lsGet(OUTBOX_KEY) || '[]'); } catch (_) {}
  if (!q.length) return;
  const keep = [];
  for (const it of q) {
    if (it.correo !== USER.correo) { keep.push(it); continue; }
    const r = await api(it.accion, it.datos);
    if (!r.ok && (r.error === 'red' || r.error === 'ocupado')) keep.push(it);
  }
  lsSet(OUTBOX_KEY, JSON.stringify(keep));
}
window.addEventListener('online', flushOutbox);
/* El servidor es la fuente de verdad del avance evaluado (también entre dispositivos) */
function applyServerState(est) {
  if (!est || !USER) return;
  (est.unidades || []).forEach(cid => { if (clsById(cid)) uState(cid).status = 'completed'; });
  Object.keys(est.modulos || {}).forEach(k => {
    const v = est.modulos[k], e = eState(+k);
    e.attempts = v.intentos || 0; e.passed = !!v.aprobado;
    if (e.passed || e.attempts >= MAX_ATTEMPTS) e.session = null;
  });
  if (est.certificado) state.cert = est.certificado;
  save();
}

function uState(cid) { return state.units[cid] || (state.units[cid] = { status: 'new', answers: {}, submitted: false, seed: 0 }); }
function eState(mid) { return state.exams[mid] || (state.exams[mid] = { attempts: 0, passed: false, history: [], session: null, showResult: false, resets: 0 }); }

/* ---------- Estados derivados ---------- */
const unitStatus = cid => (state.units[cid] && state.units[cid].status) || 'new';
const examPassed = mid => !!(state.exams[mid] && state.exams[mid].passed);
const modClassesDone = mid => modById(mid).classes.every(c => unitStatus(c.id) === 'completed');
const examUnlocked = mid => modClassesDone(mid) && (mid === 1 || examPassed(mid - 1));
function examStatus(mid) {
  const e = state.exams[mid];
  if (e && e.passed) return 'completed';
  if (e && e.attempts >= MAX_ATTEMPTS) return 'blocked';
  if (!examUnlocked(mid)) return 'locked';
  if (e && (e.attempts > 0 || e.session)) return 'in_progress';
  return 'new';
}
function modStatus(mid) {
  if (examPassed(mid)) return 'completed';
  const m = modById(mid);
  const touched = m.classes.some(c => unitStatus(c.id) !== 'new') || (state.exams[mid] && state.exams[mid].attempts > 0);
  return touched ? 'in_progress' : 'new';
}
function modDone(mid) { const m = modById(mid); return m.classes.filter(c => unitStatus(c.id) === 'completed').length + (examPassed(mid) ? 1 : 0); }
const courseDone = () => MODULES.every(m => examPassed(m.id));
function progress() {
  const u = CLASSES.filter(c => unitStatus(c.id) === 'completed').length;
  const e = MODULES.filter(m => examPassed(m.id)).length;
  return { u, e, pct: Math.round((u + e) / TOTAL_UNITS * 100) };
}
function resumeHref() {
  for (const m of MODULES) {
    for (const c of m.classes) if (unitStatus(c.id) !== 'completed') return `#/m/${m.id}/u/${c.id}`;
    if (!examPassed(m.id)) return `#/m/${m.id}/evaluacion`;
  }
  return '#/certificado';
}

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const strip = s => String(s).replace(/<[^>]+>/g, '');

let memHash = null; // ruta en memoria si el navegador no permite cambiar la URL

function parseRoute() {
  const h = currentHash().replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const p = path.split('/').filter(Boolean);
  const params = new URLSearchParams(qs || '');
  if (p[0] === 'm' && modById(+p[1])) {
    const mid = +p[1];
    if (p[2] === 'u' && clsById(+p[3]) && clsById(+p[3]).moduleId === mid) return { name: 'unit', mid, cid: +p[3], s: params.get('s') };
    if (p[2] === 'evaluacion') return { name: 'exam', mid };
    return { name: 'module', mid };
  }
  if (p[0] === 'practica') return { name: 'practice' };
  if (p[0] === 'certificado') return { name: 'cert' };

}

  route = next;
  if (sameUnit && next.s) { scrollToSlug(next.s); return; }
  render();

  requestAnimationFrame(() => {

  return `<nav class="p-3" aria-label="Unidades del módulo">

      ${m.classes.map((c, i) => `<li><a href="#/m/${mid}/u/${c.id}" class="navitem flex items-start gap-2.5 px-3 py-2 rounded-md text-sm hover:bg-surface2" aria-current="${cur === c.id ? 'page' : 'false'}">
        <span class="shrink-0 mt-px">${I[unitStatus(c.id)]}</span><span><span class="text-fg2">${i + 1}.</span> ${c.title}</span></a></li>`).join('')}
      <li><a href="#/m/${mid}/evaluacion" class="navitem flex items-start gap-2.5 px-3 py-2 rounded-md text-sm hover:bg-surface2" aria-current="${examCur ? 'page' : 'false'}">

    </ol>
    <div class="mt-6 px-3 text-xs text-fg2 space-y-2 border-t border-line pt-4">
      <a class="lnk block" href="#/">Página del curso</a>
      <a class="lnk block" href="#/practica">Evaluación de práctica</a>
    </div>
  </nav>`;
}
function sectionHTML(s) {
  const body = s.paras.map(p => Array.isArray(p) ? `<ul>${p.map(li => `<li>${li}</li>`).join('')}</ul>` : `<p>${p}</p>`).join('');
  const id = `s-${s.slug}`;
  const alert = (cls, icon, label) => `<section id="${id}" class="mb-10 alert ${cls}" aria-labelledby="${id}-h"><div class="alert-title">${icon}<span>${label}</span></div><h2 id="${id}-h" class="sec-h text-xl mb-3">${s.heading}</h2><div class="prose-k">${body}</div></section>`;
  switch (s.kind) {
    case 'opening': return `<section id="${id}" class="mb-10"><h2 class="sr-only">${s.heading}</h2><div class="prose-k lead">${body}</div></section>`;
    case 'analogy': return alert('alert-info text-fg', `<span class="text-info">${I.bulb}</span>`, 'Analogía');
    case 'expert': return alert('alert-brand text-fg', `<span class="text-accent">${I.term}</span>`, 'Para perfiles técnicos');
    case 'summary': return alert('alert-ok text-fg', `<span class="text-ok">${I.info}</span>`, 'Resumen');
    case 'closing': return alert('alert-warn text-fg', `<span class="text-warn">${I.flag}</span>`, 'Cierre del curso');
    default: return `<section id="${id}" class="mb-9"><h2 class="sec-h text-[1.35rem] mb-3">${s.heading}</h2><div class="prose-k">${body}</div></section>`;
  }
}
function questionBlock(q, n, sel, opts) {
  // opts: {name, ord, locked, reveal, key}
  const answered = sel !== undefined;
  const items = opts.ord.map((oi, pos) => {
    let cls = '';
    if (opts.reveal && answered) { if (oi === q.answer) cls = 'is-right'; else if (oi === sel) cls = 'is-wrong'; }
    return `<button type="button" class="opt ${cls}" role="radio" aria-checked="${sel === oi}" ${opts.locked ? 'disabled' : ''} data-act="${opts.act}" data-k="${opts.key}" data-o="${oi}">
      <span class="dot"></span><span class="flex-1 leading-relaxed"><span class="sr-only">${LET[pos]}. </span>${q.options[oi]}</span>
      ${opts.reveal && answered && oi === q.answer ? I.right : opts.reveal && answered && oi === sel ? I.wrong : ''}</button>`;
  }).join('');
  return `<p class="font-semibold leading-relaxed mb-3"><span class="text-fg2 mr-1">${n}.</span> ${q.q}</p><div class="space-y-2" role="radiogroup" aria-label="Pregunta ${n}">${items}</div>`;
}
function feedbackBlock(q, sel, showCorrect = true) {
  const ok = sel === q.answer;
  return `<div class="mt-3 alert ${ok ? 'alert-ok' : 'alert-bad'}">
    <p class="font-bold mb-1 ${ok ? 'text-ok' : 'text-bad'}">${ok ? 'Correcto' : 'Incorrecto'}</p>
    <p class="text-sm leading-relaxed">${q.rationales[sel]}</p>
    ${!ok && showCorrect ? `<p class="text-sm leading-relaxed mt-2"><strong>Respuesta correcta:</strong> ${q.options[q.answer]}. ${q.rationales[q.answer]}</p>` : ''}
    <div class="mt-2">${refLink(q)}</div></div>`;
}
function renderUnit(mid, cid) {
  const m = modById(mid), c = clsById(cid), u = uState(cid);

  const total = m.classes.length + 1;
  const nAns = Object.keys(u.answers).length;

  const next = idx < m.classes.length - 1 ? { href: `#/m/${mid}/u/${m.classes[idx + 1].id}`, t: `Clase ${m.classes[idx + 1].id}: ${m.classes[idx + 1].title}` } : { href: `#/m/${mid}/evaluacion`, t: 'Evaluación del módulo' };

  const toc = c.sections.filter(s => s.kind !== 'opening');

    return `<li class="card p-4 sm:p-5">${questionBlock(q, i + 1, u.answers[i], { ord, locked: u.submitted, reveal: u.submitted, act: 'unitAns', key: `${cid}:${i}` })}${u.submitted ? feedbackBlock(q, u.answers[i]) : ''}</li>`;
  }).join('');
  return `<div class="max-w-[1400px] mx-auto px-4 sm:px-6 py-8 grid lg:grid-cols-[270px_minmax(0,1fr)] xl:grid-cols-[270px_minmax(0,1fr)_230px] gap-8">
    <aside class="hidden lg:block"><div class="sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto scroll-thin card">${moduleNav(mid, cid)}</div></aside>
    <article id="article" class="min-w-0 max-w-[780px] fade-in">
      ${crumbs([{ t: 'Fundamentos de Ciberseguridad', href: '#/' }, { t: `Módulo ${mid}`, href: `#/m/${mid}` }, { t: `Unidad ${idx + 1}` }])}
      <p class="eyebrow text-accent mb-2">Unidad ${idx + 1} de ${total}</p>
      <h1 class="font-display font-black text-[1.9rem] sm:text-[2.4rem] leading-[1.1] mb-4">Clase ${c.id}: ${c.title}</h1>
      <div class="mb-10">${metaRow([[I.clock, `${readMin(c)} min`], [I.book, `Comprobación de ${c.check.length} preguntas`], [I[unitStatus(cid)].replace(/18/g, '15'), STATUS_TXT[unitStatus(cid)]]])}</div>
      ${c.sections.map(sectionHTML).join('')}

      <section id="s-comprobacion" class="mt-14 pt-10 border-t border-line" aria-labelledby="chkh">

        <p class="text-sm text-fg2 mb-6">Elige la mejor respuesta para cada pregunta y luego selecciona <em>Comprobar las respuestas</em>.</p>
        ${u.submitted ? `<div class="alert ${correct === c.check.length ? 'alert-ok' : 'alert-info'} mb-6 flex flex-wrap items-center gap-4">
            <div class="flex-1"><p class="font-bold">Respondiste correctamente ${correct} de ${c.check.length} preguntas.</p><p class="text-sm text-fg2">La unidad quedó completada. Revisa la explicación de cada respuesta antes de continuar.</p></div>
            <button data-act="unitRetry" data-k="${cid}" class="btn btn-secondary">Volver a intentarlo</button></div>` : ''}
        <ol class="space-y-4">${checkQs}</ol>
        ${u.submitted ? '' : `<div class="mt-6 flex flex-wrap items-center gap-4"><button data-act="unitSubmit" data-k="${cid}" class="btn btn-primary" ${nAns === c.check.length ? '' : 'disabled'}>Comprobar las respuestas</button><span class="text-sm text-fg2">${nAns} de ${c.check.length} respondidas</span></div>`}
      </section>

      <div class="mt-12 card p-5 flex flex-col sm:flex-row sm:items-center gap-4">
        <div class="flex-1"><p class="text-sm text-fg2">Siguiente unidad</p><p class="font-semibold">${next.t}</p></div>
        <a href="${next.href}" class="btn btn-primary">Continuar ${I.arrowR}</a>
      </div>
      <div class="mt-4 text-sm"><a class="lnk" href="${prev.href}">← ${prev.t}</a></div>
    </article>
    <aside class="hidden xl:block"><nav class="toc sticky top-20 text-sm" aria-label="En esta unidad">
      <p class="font-semibold mb-3">En esta unidad</p>
      <ul class="space-y-0.5 border-l border-line">
        ${toc.map(s => `<li><a href="#/m/${mid}/u/${cid}?s=${s.slug}" data-spy="s-${s.slug}" class="block -ml-px border-l-2 border-transparent pl-3 py-1 text-fg2 hover:text-fg leading-snug">${s.heading}</a></li>`).join('')}
        <li><a href="#/m/${mid}/u/${cid}?s=comprobacion" data-spy="s-comprobacion" class="block -ml-px border-l-2 border-transparent pl-3 py-1 text-fg2 hover:text-fg">Comprobación de conocimientos</a></li>
      </ul></nav></aside>
  </div>`;
}

/* =========================================================================
   Evaluación del módulo (formato examen)
   ========================================================================= */
function renderExam(mid) {
  const m = modById(mid), e = eState(mid), st = examStatus(mid);
  const head = `${crumbs([{ t: 'Fundamentos de Ciberseguridad', href: '#/' }, { t: `Módulo ${mid}`, href: `#/m/${mid}` }, { t: 'Evaluación' }])}`;
  let body;
  if (st === 'locked') body = examLocked(mid);
  else if (e.session) body = examSession(mid);
  else if ((e.showResult || st === 'completed' || st === 'blocked') && e.history.some(h => h.detalle)) body = examResult(mid);
  else if (st === 'completed' || st === 'blocked') body = examSynced(mid);
  else body = examIntro(mid);
  return `<div class="max-w-[1400px] mx-auto px-4 sm:px-6 py-8 grid lg:grid-cols-[270px_minmax(0,1fr)] gap-8">
    <aside class="hidden lg:block"><div class="sticky top-20 card">${moduleNav(mid, null, true)}</div></aside>
    <div class="min-w-0 max-w-[860px] fade-in">${head}${body}</div></div>`;
}
function examHeader(mid, sub) {
  return `<p class="eyebrow text-accent mb-2">Unidad ${modById(mid).classes.length + 1} · Evaluación</p>
    <h1 class="font-display font-black text-[1.9rem] sm:text-[2.4rem] leading-[1.1] mb-3">Evaluación del módulo ${mid}</h1>
    <p class="text-fg2 mb-8">${sub}</p>`;
}
function examLocked(mid) {
  const m = modById(mid);
  return `${examHeader(mid, m.name)}<div class="alert alert-warn">
    <div class="alert-title text-warn">${I.locked}<span>Evaluación no disponible todavía</span></div>
    <p class="text-sm mb-3">Para habilitarla debes:</p>
    <ul class="space-y-2 text-sm">
      ${m.classes.map(c => `<li class="flex items-center gap-2">${I[unitStatus(c.id) === 'completed' ? 'completed' : 'new']}<a class="lnk" href="#/m/${mid}/u/${c.id}">Completar la clase ${c.id}: ${c.title}</a></li>`).join('')}
      ${mid > 1 ? `<li class="flex items-center gap-2">${I[examPassed(mid - 1) ? 'completed' : 'new']}<a class="lnk" href="#/m/${mid - 1}/evaluacion">Aprobar la evaluación del módulo ${mid - 1}</a></li>` : ''}
    </ul></div>`;
}
function examSynced(mid) { // estado traído del servidor sin el detalle local (p. ej. desde otro dispositivo)
  const m = modById(mid), e = eState(mid);
  return `${examHeader(mid, m.name)}<div class="alert ${e.passed ? 'alert-ok' : 'alert-bad'}">

    <div class="flex flex-wrap gap-3 mt-4">${e.passed ? (mid < MODULES.length ? `<a href="#/m/${mid + 1}" class="btn btn-primary">Continuar al módulo ${mid + 1}</a>` : `<a href="#/certificado" class="btn btn-primary">Ver mi certificado</a>`) : `<button data-act="examReset" data-k="${mid}" class="btn btn-primary">Reiniciar el módulo ${mid}</button>`}</div></div>`;
}
function examIntro(mid) {
  const e = eState(mid), m = modById(mid);
  return `${examHeader(mid, m.name)}
    <div class="card p-6 mb-6">
      <h2 class="font-display font-bold text-lg mb-4">Antes de empezar</h2>
      <dl class="grid sm:grid-cols-2 gap-x-8 gap-y-4 text-sm mb-6">
        <div><dt class="text-fg2">Preguntas</dt><dd class="font-semibold">6, de selección única</dd></div>
        <div><dt class="text-fg2">Puntuación para aprobar</dt><dd class="font-semibold">${PASS_PCT} % (5 de 6)</dd></div>
        <div><dt class="text-fg2">Intentos</dt><dd class="font-semibold">${e.attempts} de ${MAX_ATTEMPTS} usados</dd></div>
        <div><dt class="text-fg2">Tiempo</dt><dd class="font-semibold">Sin límite</dd></div>
      </dl>
      <ul class="text-sm text-fg2 space-y-1.5 mb-6 list-disc ml-5">
        <li>Puedes moverte entre preguntas y marcar las que quieras revisar.</li>
        <li>Las respuestas no se califican hasta que envíes la evaluación.</li>
        <li>El orden de las opciones cambia en cada intento.</li>
        <li>La calificación se realiza en el servidor del curso; necesitas conexión a Internet al enviarla.</li>
      </ul>
      ${webhookReady() ? `<button data-act="examStart" data-k="${mid}" class="btn btn-primary">${e.attempts ? `Iniciar el intento ${e.attempts + 1}` : 'Iniciar la evaluación'} ${I.arrowR}</button>`
        : `<div class="alert alert-warn text-sm">Las evaluaciones se califican en el servidor del curso, que aún no está configurado en esta página.</div>`}
    </div>`;
}
function examSession(mid) {

  const n = m.quiz.length;
  const nav = m.quiz.map((_, i) => {
    const ans = s.answers[i] !== undefined, fl = s.flags[i], cur = !s.review && s.idx === i;
    return `<button data-act="examGo" data-k="${mid}:${i}" class="relative w-10 h-10 rounded-md border text-sm font-bold ${cur ? 'border-brand ring-2 ring-brand/40' : 'border-line'} ${ans ? 'bg-brand/15' : 'bg-surface'}" aria-label="Pregunta ${i + 1}${ans ? ', respondida' : ''}${fl ? ', marcada para revisar' : ''}">
      ${i + 1}${fl ? '<span class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-warn border-2 border-bg"></span>' : ''}</button>`;
  }).join('');
  const answered = Object.keys(s.answers).length;
  const top = `<div class="card p-4 mb-5 flex flex-wrap items-center gap-4">
      <div class="flex-1 min-w-[200px]"><p class="font-display font-bold">Evaluación del módulo ${mid}</p><p class="text-xs text-fg2">Intento ${s.attempt} de ${MAX_ATTEMPTS} · ${answered} de ${n} respondidas</p></div>
      <div class="flex flex-wrap gap-2" aria-label="Navegación de preguntas">${nav}</div>
    </div>`;
  if (s.review) {
    return `${top}<div class="card p-6">
      <h1 class="font-display font-extrabold text-2xl mb-2">Revisa tus respuestas</h1>
      <p class="text-sm text-fg2 mb-5">Selecciona una pregunta para volver a ella. Cuando estés listo, envía la evaluación.</p>
      <ol class="divide-y divide-line border border-line rounded-lg mb-6">
        ${m.quiz.map((q, i) => `<li><button data-act="examGo" data-k="${mid}:${i}" class="w-full flex items-center gap-3 p-3 text-left hover:bg-surface2">
          <span class="font-mono text-sm text-fg2 w-6">${i + 1}</span><span class="flex-1 text-sm">${strip(q.q).slice(0, 110)}${strip(q.q).length > 110 ? '…' : ''}</span>
          ${s.flags[i] ? `<span class="pill text-warn border-warn/50">${I.flag} Revisar</span>` : ''}
          <span class="pill ${s.answers[i] !== undefined ? 'text-ok border-ok/50' : 'text-bad border-bad/50'}">${s.answers[i] !== undefined ? 'Respondida' : 'Sin responder'}</span></button></li>`).join('')}
      </ol>
      <div class="flex flex-wrap gap-3"><button data-act="examGo" data-k="${mid}:${n - 1}" class="btn btn-secondary">${I.arrowL} Volver</button><button data-act="examSubmit" data-k="${mid}" class="btn btn-primary">Enviar la evaluación</button></div>
    </div>`;
  }
  const i = s.idx, q = m.quiz[i];
  const ord = order(4, `ex-${mid}-${e.resets}-${s.attempt}-${i}`);
  return `${top}<div class="card p-5 sm:p-7">
      <div class="flex items-center justify-between mb-4"><p class="text-sm text-fg2">Pregunta ${i + 1} de ${n}</p>
        <button data-act="examFlag" data-k="${mid}" class="btn btn-ghost text-sm px-2 py-1 ${s.flags[i] ? 'text-warn' : ''}" aria-pressed="${!!s.flags[i]}">${I.flag} ${s.flags[i] ? 'Marcada para revisar' : 'Marcar para revisar'}</button></div>
      <h1 class="sr-only">Pregunta ${i + 1}</h1>
      ${questionBlock(q, i + 1, s.answers[i], { ord, locked: false, reveal: false, act: 'examAns', key: `${mid}:${i}` })}
      <div class="flex flex-wrap justify-between gap-3 mt-7 pt-5 border-t border-line">
        <button data-act="examGo" data-k="${mid}:${i - 1}" class="btn btn-secondary" ${i === 0 ? 'disabled' : ''}>${I.arrowL} Anterior</button>
        ${i < n - 1 ? `<button data-act="examGo" data-k="${mid}:${i + 1}" class="btn btn-primary">Siguiente ${I.arrowR}</button>` : `<button data-act="examReview" data-k="${mid}" class="btn btn-primary">Revisar respuestas ${I.arrowR}</button>`}
      </div></div>`;
}
function examResult(mid) {
  const m = modById(mid), e = eState(mid);
  const last = e.history[e.history.length - 1];
  if (!last || !last.detalle) return examIntro(mid);
  const pct = last.nota;
  const passed = !!last.aprobado;
  const remaining = MAX_ATTEMPTS - e.attempts;
  const reveal = last.detalle.some(d => d.correcta);
  const rows = m.quiz.map((q, i) => {
    const d = last.detalle[i] || {}, a = last.answers[i], ok = !!d.ok;
    const ci = d.correcta ? LET.indexOf(d.correcta) : -1;
    return `<li class="card p-4 sm:p-5"><div class="flex gap-3">${ok ? I.right : I.wrong}<div class="flex-1 min-w-0">
      <p class="font-semibold leading-relaxed mb-2">${i + 1}. ${q.q}</p>
      <p class="text-sm"><span class="text-fg2">Tu respuesta:</span> ${a === undefined || a === null ? '<em>Sin responder</em>' : q.options[a]}</p>
      ${d.retro ? `<p class="text-sm text-fg2 mt-1 leading-relaxed">${esc(d.retro)}</p>` : ''}
      ${!ok && ci >= 0 ? `<p class="text-sm mt-2"><span class="text-ok font-semibold">Respuesta correcta:</span> ${q.options[ci]}. <span class="text-fg2">${esc(d.retroCorrecta || '')}</span></p>` : ''}
      <div class="mt-2">${refLink(q)}</div></div></div></li>`;
  }).join('');
  let actions;
  if (passed) actions = mid < MODULES.length ? `<a href="#/m/${mid + 1}" class="btn btn-primary">Continuar al módulo ${mid + 1} ${I.arrowR}</a>` : `<a href="#/certificado" class="btn btn-primary">Ver mi certificado ${I.arrowR}</a>`;
  else if (remaining > 0) actions = `<button data-act="examRetry" data-k="${mid}" class="btn btn-primary">Intentar de nuevo</button><a href="#/m/${mid}" class="btn btn-secondary">Repasar el módulo</a><a href="#/practica" class="btn btn-ghost">Evaluación de práctica</a>`;
  else actions = `<button data-act="examReset" data-k="${mid}" class="btn btn-primary">Reiniciar el módulo ${mid}</button><a href="#/m/${mid}" class="btn btn-secondary">Repasar primero</a>`;
  return `${examHeader(mid, m.name)}
    <section class="card p-6 mb-6" aria-labelledby="resh">
      <div class="flex flex-col sm:flex-row gap-6 sm:items-center">
        <div class="shrink-0 w-28 h-28 rounded-full grid place-items-center" style="background:conic-gradient(rgb(var(--c-${passed ? 'ok' : 'bad'})) ${pct * 3.6}deg, rgb(var(--c-line)) 0)">
          <div class="w-[92px] h-[92px] rounded-full bg-surface grid place-items-center text-center"><div><div class="font-display font-black text-2xl">${pct} %</div><div class="text-xs text-fg2">${last.aciertos} de ${last.total}</div></div></div>
        </div>
        <div class="flex-1">
          <h2 id="resh" class="font-display font-extrabold text-2xl mb-1 ${passed ? 'text-ok' : 'text-bad'}">${passed ? 'Aprobaste la evaluación' : 'No alcanzaste la puntuación necesaria'}</h2>
          <p class="text-sm text-fg2 mb-4">Puntuación necesaria para aprobar: ${PASS_PCT} %. ${passed ? '' : remaining > 0 ? `Te ${remaining === 1 ? 'queda 1 intento' : `quedan ${remaining} intentos`}.` : 'Agotaste los intentos de este módulo.'}</p>
          <div class="relative h-3 rounded-full bg-line/60 mb-1.5"><div class="h-3 rounded-full ${passed ? 'bg-ok' : 'bg-bad'}" style="width:${pct}%"></div><div class="absolute -top-1 bottom-[-4px] w-0.5 bg-fg" style="left:${PASS_PCT}%" title="${PASS_PCT} %"></div></div>
          <div class="flex flex-wrap gap-2 mt-3">${e.history.filter(h => h.detalle).map((h, k) => `<span class="pill ${h.aprobado ? 'text-ok border-ok/50' : 'text-bad border-bad/50'}">Intento ${k + 1}: ${h.nota} %</span>`).join('')}</div>
        </div>
      </div>
      ${!passed && remaining <= 0 ? `<div class="alert alert-bad mt-6 text-sm">Al reiniciar el módulo, sus unidades vuelven a quedar pendientes y recuperas los ${MAX_ATTEMPTS} intentos. Repasa las clases y responde de nuevo sus comprobaciones antes de volver a presentar la evaluación.</div>` : ''}
      <div class="flex flex-wrap gap-3 mt-6">${actions}</div>
    </section>
    <h2 class="font-display font-bold text-xl mb-1">Desglose del intento ${e.history.length}</h2>
    <p class="text-sm text-fg2 mb-4">${reveal ? 'Se muestran las respuestas correctas y su justificación.' : 'Se indica qué preguntas fallaste y por qué tu respuesta no era la adecuada. La respuesta correcta se muestra al aprobar o al agotar los intentos.'}</p>
    <ol class="space-y-3">${rows}</ol>`;
}

function renderPractice() {
  const P = state.practice, s = P.session;
  const head = crumbs([{ t: 'Fundamentos de Ciberseguridad', href: '#/' }, { t: 'Evaluación de práctica' }]);
  let body;
  if (!s) body = practiceIntro();
  else if (s.done) body = practiceResult();
  else body = practiceQuestion();
  return `<div class="max-w-[900px] mx-auto px-4 sm:px-6 py-8 fade-in">${head}${body}</div>`;
}
function practiceIntro() {
  const hist = state.practice.history.slice(-5).reverse();
  return `<div class="flex items-start gap-5 mb-8"><div class="hidden sm:block shrink-0 text-accent">${badgeSVG(72, 'PR')}</div><div>
      <p class="eyebrow text-accent mb-2">Evaluación de práctica</p>
      <h1 class="font-display font-black text-3xl sm:text-4xl leading-tight mb-3">Pon a prueba tus conocimientos</h1>
      <p class="text-fg2 leading-relaxed">Conoce el estilo, la redacción y la dificultad de las preguntas, evalúa tu preparación y detecta los temas que debes reforzar. Esta práctica no afecta tu progreso ni tus intentos.</p></div></div>
    <div class="card p-6 mb-6">
      <dl class="grid sm:grid-cols-3 gap-4 text-sm mb-6">
        <div><dt class="text-fg2">Preguntas</dt><dd class="font-semibold">${PRACTICE_SIZE} aleatorias</dd></div>
        <div><dt class="text-fg2">Banco</dt><dd class="font-semibold">${PRACTICE_POOL.length} preguntas de las ${CLASSES.length} unidades</dd></div>
        <div><dt class="text-fg2">Resultados</dt><dd class="font-semibold">Por tema, al finalizar</dd></div>
      </dl>
      <p class="text-sm text-fg2 mb-6">En cada pregunta puedes usar <em>Comprobar la respuesta</em> para ver si acertaste y por qué, o seguir sin comprobar y revisar todo al final.</p>
      <button data-act="pracStart" class="btn btn-primary">Iniciar la evaluación de práctica ${I.arrowR}</button>
    </div>
    ${hist.length ? `<div class="card p-6"><h2 class="font-display font-bold mb-3">Intentos recientes</h2><ul class="divide-y divide-line text-sm">${hist.map(h => `<li class="flex justify-between py-2"><span>${new Date(h.at).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' })}</span><span class="font-mono font-bold">${Math.round(h.score / h.total * 100)} %</span></li>`).join('')}</ul></div>` : ''}`;
}
function practiceQuestion() {
  const s = state.practice.session, n = s.ids.length, i = s.idx;
  const item = poolById(s.ids[i]), q = item.q;
  const sel = s.answers[i], checked = !!s.checked[i];
  const ord = order(4, `pr-${s.started}-${item.id}`);
  const answered = Object.keys(s.answers).length;
  return `<div class="flex flex-wrap items-center justify-between gap-3 mb-3"><p class="text-sm text-fg2">Pregunta ${i + 1} de ${n} · ${answered} respondidas</p>
      <button data-act="pracQuit" class="btn btn-ghost text-sm px-2 py-1">Salir de la práctica</button></div>
    <div class="bar mb-6"><div style="width:${Math.round((i + 1) / n * 100)}%"></div></div>
    <div class="card p-5 sm:p-7">
      <p class="eyebrow text-fg2 mb-3">Módulo ${item.mid} · ${modById(item.mid).name}</p>
      <h1 class="sr-only">Pregunta ${i + 1}</h1>
      ${questionBlock(q, i + 1, sel, { ord, locked: checked, reveal: checked, act: 'pracAns', key: String(i) })}
      ${checked ? feedbackBlock(q, sel) : ''}
      <div class="flex flex-wrap items-center gap-3 mt-7 pt-5 border-t border-line">
        <button data-act="pracGo" data-k="${i - 1}" class="btn btn-secondary" ${i === 0 ? 'disabled' : ''}>${I.arrowL} Anterior</button>
        ${checked ? '' : `<button data-act="pracCheck" class="btn btn-secondary" ${sel === undefined ? 'disabled' : ''}>Comprobar la respuesta</button>`}
        <span class="flex-1"></span>
        ${i < n - 1 ? `<button data-act="pracGo" data-k="${i + 1}" class="btn btn-primary">Siguiente ${I.arrowR}</button>` : `<button data-act="pracFinish" class="btn btn-primary">Ver resultados ${I.arrowR}</button>`}
      </div></div>`;
}
function practiceResult() {
  const s = state.practice.session;
  const items = s.ids.map((id, i) => ({ item: poolById(id), sel: s.answers[i] }));
  const score = items.filter(x => x.sel === x.item.q.answer).length;
  const pct = Math.round(score / items.length * 100);
  const byMod = MODULES.map(m => { const its = items.filter(x => x.item.mid === m.id); const ok = its.filter(x => x.sel === x.item.q.answer).length; return { m, n: its.length, ok }; }).filter(x => x.n);
  return `<p class="eyebrow text-accent mb-2">Resultados de la práctica</p>
    <h1 class="font-display font-black text-3xl sm:text-4xl leading-tight mb-6">Obtuviste ${pct} %</h1>
    <div class="card p-6 mb-6">
      <p class="text-sm text-fg2 mb-5">Respondiste correctamente ${score} de ${items.length} preguntas. Como referencia, las evaluaciones de módulo exigen ${PASS_PCT} %.</p>
      <h2 class="font-display font-bold mb-4">Resultados por tema</h2>
      <ul class="space-y-4">
        ${byMod.map(x => { const p = Math.round(x.ok / x.n * 100); return `<li><div class="flex flex-wrap justify-between gap-2 text-sm mb-1.5"><a class="font-semibold hover:underline" href="#/m/${x.m.id}">${x.m.name}</a><span class="text-fg2">${x.ok} de ${x.n} · <span class="${p >= PASS_PCT ? 'text-ok' : 'text-bad'} font-semibold">${p >= PASS_PCT ? 'Buen dominio' : 'Necesita refuerzo'}</span></span></div><div class="bar"><div style="width:${p}%"></div></div></li>`; }).join('')}
      </ul>
      <div class="flex flex-wrap gap-3 mt-6"><button data-act="pracStart" class="btn btn-primary">Volver a empezar</button><a href="#/" class="btn btn-secondary">Volver al curso</a></div>
    </div>
    <h2 class="font-display font-bold text-xl mb-4">Revisión de las preguntas</h2>
    <ol class="space-y-3">${items.map((x, i) => { const q = x.item.q, ok = x.sel === q.answer; return `<li class="card p-4 sm:p-5"><div class="flex gap-3">${ok ? I.right : I.wrong}<div class="flex-1 min-w-0">
      <p class="font-semibold leading-relaxed mb-2">${i + 1}. ${q.q}</p>
      <p class="text-sm"><span class="text-fg2">Tu respuesta:</span> ${x.sel === undefined ? '<em>Sin responder</em>' : q.options[x.sel]}</p>
      ${!ok ? `<p class="text-sm mt-1"><span class="text-ok font-semibold">Respuesta correcta:</span> ${q.options[q.answer]}</p>` : ''}
      <p class="text-sm text-fg2 mt-1 leading-relaxed">${q.rationales[q.answer]}</p>
      <div class="mt-2">${refLink(q)}</div></div></div></li>`; }).join('')}</ol>`;
}

/* ---------- Verificación pública de certificados ---------- */
let verifyRes = null, verifyBusy = false;
function renderVerify() {
  const pre = new URLSearchParams((currentHash().split('?')[1]) || '').get('c') || '';
  const r = verifyRes;
  return `<div class="max-w-[720px] mx-auto px-4 sm:px-6 py-10 fade-in">
    <p class="eyebrow text-accent mb-2">Krixo Academy</p>
    <h1 class="font-display font-black text-3xl sm:text-4xl leading-tight mb-3">Verificar un certificado</h1>
    <p class="text-fg2 mb-6">Escribe el código que aparece en el certificado (formato KXA-XXXX-XXXX-XXXX).</p>
    <form id="verifyForm" class="card p-5 flex flex-col sm:flex-row gap-3 mb-6">
      <label for="vcode" class="sr-only">Código del certificado</label>
      <input id="vcode" name="vcode" required maxlength="24" value="${esc(pre)}" placeholder="KXA-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false" class="flex-1 font-mono uppercase rounded-lg bg-bg border border-line focus:border-brand px-4 py-2.5 outline-none">
      <button class="btn btn-primary" ${verifyBusy ? 'disabled' : ''}>${verifyBusy ? 'Verificando…' : 'Verificar'}</button>
    </form>
    ${r ? (r.ok && r.valido ? `<div class="alert alert-ok"><p class="font-bold text-ok mb-1">Certificado válido</p>
          <p class="text-sm">Emitido a <strong>${esc(r.nombre)}</strong> por completar <strong>${esc(r.curso)}</strong> el ${new Date(r.fecha).toLocaleDateString('es-CO', { day: 'numeric', month: 'long', year: 'numeric' })}.</p></div>`
      : r.ok ? `<div class="alert alert-bad"><p class="font-bold text-bad mb-1">Código no encontrado</p><p class="text-sm">No existe un certificado emitido con ese código.</p></div>`
      : `<div class="alert alert-warn text-sm">${errMsg(r)}</div>`) : ''}
    ${!USER ? '' : '<p class="text-sm mt-6"><a class="lnk" href="#/">Volver al curso</a></p>'}
  </div>`;
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'verifyForm') return;
  e.preventDefault();
  const codigo = e.target.elements.vcode.value.trim().toUpperCase();
  verifyBusy = true; verifyRes = null; rerender();
  verifyRes = await api('verificar_certificado', { codigo });
  verifyBusy = false; rerender();
});

/* =========================================================================
   Acciones
   ========================================================================= */
const ACTIONS = {
  unitAns(k, o) { const [cid, qi] = k.split(':').map(Number); const u = uState(cid); if (u.submitted) return; u.answers[qi] = o; save(); rerender(); },
  unitSubmit(k) {
    const cid = +k, c = clsById(cid), u = uState(cid);
    if (Object.keys(u.answers).length < c.check.length) return;
    u.submitted = true; const wasDone = u.status === 'completed'; u.status = 'completed'; save(); rerender();
    sendEvent('check', { clase: cid, respuestas: c.check.map((_, i) => u.answers[i] === undefined ? '' : LET[u.answers[i]]) });
    if (!wasDone) toast('Unidad completada', `Clase ${cid}: ${c.title}`);
  },
  unitRetry(k) { const u = uState(+k); u.answers = {}; u.submitted = false; u.seed++; save(); rerender(); },
  examStart(k) { const mid = +k, e = eState(mid); if (!webhookReady() || !examUnlocked(mid) || e.passed || e.attempts >= MAX_ATTEMPTS) return; e.session = { attempt: e.attempts + 1, answers: {}, flags: {}, idx: 0, review: false }; e.showResult = false; save(); render(); window.scrollTo(0, 0); },
  examAns(k, o) { const [mid, i] = k.split(':').map(Number); const s = eState(mid).session; if (!s) return; s.answers[i] = o; save(); rerender(); },
  examGo(k) { const [mid, i] = k.split(':').map(Number); const s = eState(mid).session; if (!s || i < 0 || i >= modById(mid).quiz.length) return; s.idx = i; s.review = false; save(); render(); },
  examReview(k) { const s = eState(+k).session; s.review = true; save(); render(); },
  examFlag(k) { const s = eState(+k).session; s.flags[s.idx] = !s.flags[s.idx]; save(); rerender(); },
  examSubmit(k) {
    const mid = +k, m = modById(mid), e = eState(mid), s = e.session;
    const missing = m.quiz.length - Object.keys(s.answers).length;
    const doSubmit = async () => {
      const answers = m.quiz.map((_, i) => s.answers[i]);
      busy(true, 'Calificando tu evaluación…');
      await flushOutbox(); // asegura que el servidor tenga todas las comprobaciones antes de calificar
      const r = await api('cuestionario', { modulo: mid, respuestas: answers.map(a => a === undefined ? '' : LET[a]) });
      busy(false);
      if (!r.ok) {
        if (r.error === 'ya_aprobado' || r.error === 'sin_intentos') { e.session = null; save(); render(); }
        notify('No se pudo enviar la evaluación', errMsg(r), 'bad');
        return;
      }
      e.history.push({ aciertos: r.aciertos, total: r.total, nota: r.nota, aprobado: r.aprobado, answers, detalle: r.detalle, at: new Date().toISOString() });
      e.attempts = r.intento; e.passed = !!r.aprobado;
      if (r.certificado) state.cert = r.certificado;
      e.session = null; e.showResult = true; save(); render(); window.scrollTo(0, 0);
      if (e.passed) toast('Módulo aprobado', `Módulo ${mid}: ${m.name}`);
    };
    if (missing) confirmModal('Hay preguntas sin responder', `Tienes ${plural(missing, 'pregunta', 'preguntas')} sin responder, que contarán como incorrectas. ¿Quieres enviar la evaluación de todos modos?`, 'Enviar', doSubmit);
    else confirmModal('Enviar la evaluación', 'Después de enviarla no podrás cambiar tus respuestas. Este envío cuenta como un intento.', 'Enviar', doSubmit);
  },
  examRetry(k) { const e = eState(+k); e.showResult = false; save(); render(); window.scrollTo(0, 0); },
  examReset(k) {

      busy(true, 'Reiniciando el módulo…');
      const res = await api('reinicio', { modulo: mid });
      busy(false);
      if (!res.ok) { notify('No se pudo reiniciar el módulo', errMsg(res), 'bad'); return; }
      const m = modById(mid);
      m.classes.forEach(c => { const u = uState(c.id); u.status = 'new'; u.answers = {}; u.submitted = false; u.seed++; delete state.scroll[c.id]; });
      const r = (eState(mid).resets || 0) + 1;

function confirmModal(title, body, okLabel, onOk) {
  const md = $('#modal'), prev = document.activeElement;
  $('#modalTitle').textContent = title; $('#modalBody').textContent = body; $('#modalOk').textContent = okLabel;
  md.classList.remove('hidden'); md.classList.add('flex');
  const close = () => { md.classList.add('hidden'); md.classList.remove('flex'); document.removeEventListener('keydown', onKey); if (prev && prev.focus) prev.focus(); };
  const onKey = ev => { if (ev.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('#modalCancel').onclick = close; md.onclick = ev => { if (ev.target === md) close(); };
  $('#modalOk').onclick = () => { close(); onOk(); };
  $('#modalOk').focus();
}

let spy;
function setupScrollSpy() {
  if (spy) spy.disconnect();
  const links = [...document.querySelectorAll('[data-spy]')]; if (!links.length) return;
  const targets = links.map(l => document.getElementById(l.dataset.spy)).filter(Boolean);
  spy = new IntersectionObserver(entries => {
    const vis = entries.filter(en => en.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
    if (!vis) return;
    links.forEach(l => l.setAttribute('aria-current', String(l.dataset.spy === vis.target.id)));
  }, { rootMargin: '-80px 0px -65% 0px' });
  targets.forEach(t => spy.observe(t));
}

function mountTurnstile() {
  const render = () => { try { tsToken = ''; tsWidget = window.turnstile.render('#tsBox', { sitekey: TURNSTILE_SITE_KEY, theme: theme === 'light' ? 'light' : 'dark', language: 'es', callback: t => { tsToken = t; }, 'expired-callback': () => { tsToken = ''; }, 'error-callback': () => { tsToken = ''; } }); } catch (e) {} };
  if (window.turnstile) return render();
  if (!document.getElementById('tsScript')) {
    const sc = document.createElement('script');
    sc.id = 'tsScript'; sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit'; sc.async = true; sc.defer = true;
    sc.onload = () => { if ($('#tsBox')) render(); };
    document.head.appendChild(sc);
  }
}
function hideGate() { const g = $('#gate'); if (g) g.remove(); setInert(false); document.body.style.overflow = ''; gateStep = 'datos'; gatePending = null; gateMsg = null; }
let resendTimer = null;
function tickResend() { clearInterval(resendTimer); resendTimer = setInterval(() => { if (gateStep !== 'codigo' || !$('#gate')) return clearInterval(resendTimer); const b = document.querySelector('[data-gate="reenviar"]'); if (!b) return; const w = Math.max(0, Math.ceil((resendAt - Date.now()) / 1000)); b.disabled = !!w; b.textContent = w ? `Reenviar en ${w} s` : 'Reenviar código'; if (!w) clearInterval(resendTimer); }, 1000); }
async function requestCode(datos) {
  gateBusy = true; showGate();
  const r = await api('registro', Object.assign({ consentimiento: true, turnstile: tsToken }, datos));
  gateBusy = false;
  if (window.turnstile && tsWidget !== null) { try { window.turnstile.reset(tsWidget); } catch (e) {} }
  if (!r.ok) { gateMsg = { ok: false, text: errMsg(r) }; showGate(); return; }
  if (r.token) { finishLogin(r); return; } // servidor con verificación de correo desactivada
  gatePending = datos; gateStep = 'codigo'; gateMsg = null; resendAt = Date.now() + 60000; showGate(); tickResend();
}
function finishLogin(r) {
  USER = Object.assign({}, r.perfil, { token: r.token, registrado: new Date().toISOString() });
  lsSet(USER_KEY, JSON.stringify(USER));
  state = parseState(lsGet(stateKey())) || defaultState();
  state.name = USER.nombre;
  if (r.estado) applyServerState(r.estado);
  save(); hideGate(); route = null; navigate(); flushOutbox();
  toast('Bienvenido', `Hola, ${firstName()}. Tu avance queda registrado en tu cuenta.`);
}
document.addEventListener('submit', async e => {
  if (e.target.id === 'gateForm') {
    e.preventDefault();
    const f = e.target;
    if (f.elements.empresa_verif.value) return; // honeypot con valor: abortar sin enviar nada
    const nombre = f.elements.g_nombre.value.trim().replace(/\s+/g, ' ');
    const correo = f.elements.g_correo.value.trim().toLowerCase();
    const cargo = f.elements.g_cargo.value.trim().replace(/\s+/g, ' ');
    const err = nombre.length < 3 ? 'Escribe tu nombre completo.'
      : !/^[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$/.test(correo) ? 'Escribe un correo electrónico válido.'
      : cargo.length < 2 ? 'Escribe tu cargo o área.'
      : !f.elements.g_consent.checked ? 'Debes autorizar el tratamiento de tus datos para continuar.'
      : (TURNSTILE_SITE_KEY && webhookReady() && !tsToken) ? 'Completa la verificación de seguridad.' : '';
    if (err) { gateMsg = { ok: false, text: err }; showGate(); return; }
    if (!webhookReady()) { // modo local (sin servidor): solo para vista previa
      USER = { nombre, correo, cargo, registrado: new Date().toISOString() };
      lsSet(USER_KEY, JSON.stringify(USER));
      state = parseState(lsGet(stateKey())) || defaultState(); state.name = nombre; save();
      hideGate(); route = null; navigate(); return;
    }
    requestCode({ nombre, correo, cargo });
  }
  if (e.target.id === 'codeForm') {
    e.preventDefault();
    const codigo = e.target.elements.g_codigo.value.replace(/\D/g, '');
    if (codigo.length !== 6) { gateMsg = { ok: false, text: 'El código tiene 6 dígitos.' }; showGate(); return; }
    gateBusy = true; showGate();
    const r = await api('verificar', { correo: gatePending.correo, codigo });
    gateBusy = false;
    if (!r.ok) {
      if (r.error === 'codigo_vencido' || r.error === 'codigo_bloqueado') { gateStep = 'datos'; }
      gateMsg = { ok: false, text: errMsg(r) + (r.restantes ? ` Te quedan ${r.restantes} intentos.` : '') }; showGate(); return;
    }
    finishLogin(r);
  }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-gate]'); if (!b) return;
  e.preventDefault();
  if (b.dataset.gate === 'otro') { gateStep = 'datos'; gateMsg = null; showGate(); }
  if (b.dataset.gate === 'reenviar' && Date.now() >= resendAt && gatePending) { gateStep = 'datos'; requestCode(gatePending); }
});
function sessionExpired() {
  lsDel(USER_KEY); USER = null; state = defaultState();
  gateStep = 'datos'; showGate(ERR.token_invalido);
}
function startSession() {
  state = parseState(lsGet(stateKey())) || defaultState();
  if (!state.name) { state.name = USER.nombre; save(); }
  hideGate(); route = null; navigate();
}
function switchUser() {
  confirmModal('Cerrar sesión', 'Saldrás de tu cuenta en este navegador. Tu avance evaluado queda guardado en el servidor y se recupera al volver a ingresar con tu correo.', 'Cerrar sesión', () => {
    lsDel(USER_KEY); USER = null; state = defaultState();
    try { history.replaceState(null, '', location.pathname + location.search + '#/'); } catch (e) { memHash = '#/'; }
    route = null; navigate(); gateStep = 'datos'; showGate(null);
  });
}

  const w = $('#userWrap');
  if (!USER) { w.innerHTML = ''; return; }
  const ini = USER.nombre.split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
  w.innerHTML = `<button id="userBtn" class="flex items-center gap-2.5 rounded-full hover:bg-white/10 pl-1 pr-1 sm:pr-3 py-1" aria-haspopup="menu" aria-expanded="false" aria-label="Menú de usuario">
      <span class="w-8 h-8 rounded-full bg-[#801BB5] text-white font-bold text-xs grid place-items-center">${esc(ini)}</span>
      <span class="hidden sm:block text-sm font-semibold max-w-[160px] truncate">${esc(USER.nombre)}</span></button>
    <div id="userMenu" role="menu" class="hidden absolute right-0 mt-2 w-64 rounded-lg border border-line bg-surface text-fg shadow-2xl p-2 text-sm">
      <div class="px-3 py-2 border-b border-line mb-1"><p class="font-semibold truncate">${esc(USER.nombre)}</p><p class="text-xs text-fg2 truncate">${esc(USER.correo)}</p><p class="text-xs text-fg2 truncate">${esc(USER.cargo)}</p></div>
      <a href="#/" class="block px-3 py-2 rounded-md hover:bg-surface2">Mi progreso</a>
      <a href="#/certificado" class="block px-3 py-2 rounded-md hover:bg-surface2">Certificado</a>
      <button data-user="switch" class="w-full text-left px-3 py-2 rounded-md hover:bg-surface2">Cerrar sesión</button>
    </div>`;
}
document.addEventListener('click', e => {
  const btn = e.target.closest('#userBtn'), menu = $('#userMenu');
  if (btn) { menu.classList.toggle('hidden'); btn.setAttribute('aria-expanded', String(!menu.classList.contains('hidden'))); return; }
  if (e.target.closest('[data-user="switch"]')) { e.preventDefault(); menu.classList.add('hidden'); switchUser(); return; }
  if (menu && !e.target.closest('#userMenu')) menu.classList.add('hidden');
});

/* ---------- Ocupado y avisos ---------- */
function busy(on, txt) {
  let b = $('#busy');
  if (!on) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('div'); b.id = 'busy'; document.body.appendChild(b); }
  b.className = 'fixed inset-0 z-[90] bg-black/60 grid place-items-center';
  b.innerHTML = `<div class="card px-6 py-5 flex items-center gap-3 shadow-2xl" role="status"><span class="w-5 h-5 rounded-full border-2 border-brand border-t-transparent animate-spin"></span><span class="font-semibold">${esc(txt || 'Procesando…')}</span></div>`;
}
function notify(title, msg, kind) {
  const t = $('#toast');
  t.innerHTML = `<div class="card shadow-2xl p-4 pr-6 flex items-start gap-3 fade-in max-w-sm ${kind === 'bad' ? 'border-bad/60' : 'border-ok/50'}">${kind === 'bad' ? I.wrong : I.completed}<div><p class="font-bold text-sm">${esc(title)}</p><p class="text-xs text-fg2 leading-relaxed">${esc(msg)}</p></div></div>`;
  t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 7000);
}

/* ---------- Arranque ---------- */
(function boot() {
  document.documentElement.setAttribute('data-theme', theme);
  renderThemeControls();
  booted = true;
  USER = loadUser();
  if (USER && webhookReady() && !USER.token) { lsDel(USER_KEY); USER = null; } // registros locales antiguos deben verificarse
  if (USER) {
    startSession();
    if (webhookReady()) api('estado').then(r => { if (r && r.ok) { rerender(); flushOutbox(); } });
  } else navigate();
})();
</script>
</body>
</html>
