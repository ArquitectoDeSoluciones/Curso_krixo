/* ---------- Temas ---------- */
:root,[data-theme="dark"]{--c-bg:15 1 32;--c-surface:22 4 43;--c-surface2:32 9 58;--c-line:66 44 98;--c-fg:244 238 251;--c-fg2:188 172 210;--c-accent:212 170 252;--c-brand:180 74 242;--c-onbrand:15 1 32;--c-ok:52 211 153;--c-bad:248 113 113;--c-info:110 172 250;--c-warn:251 191 36;color-scheme:dark}
[data-theme="light"]{--c-bg:247 244 251;--c-surface:255 255 255;--c-surface2:243 236 250;--c-line:222 211 237;--c-fg:27 11 46;--c-fg2:82 68 102;--c-accent:106 17 160;--c-brand:128 27 181;--c-onbrand:255 255 255;--c-ok:4 120 87;--c-bad:185 28 28;--c-info:29 78 216;--c-warn:161 72 8;color-scheme:light}
[data-theme="contrast"]{--c-bg:0 0 0;--c-surface:0 0 0;--c-surface2:16 16 16;--c-line:255 255 255;--c-fg:255 255 255;--c-fg2:255 255 255;--c-accent:255 255 0;--c-brand:255 255 0;--c-onbrand:0 0 0;--c-ok:63 242 63;--c-bad:255 128 128;--c-info:138 216 255;--c-warn:255 255 0;color-scheme:dark}
html{scroll-padding-top:88px}
body{background:rgb(var(--c-bg));color:rgb(var(--c-fg));font-family:'Manrope',Arial,sans-serif;-webkit-font-smoothing:antialiased}
[data-theme="dark"] body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(900px 480px at 88% -8%,rgba(128,27,181,.20),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(56,13,83,.45),transparent 60%)}
::selection{background:rgba(180,74,242,.4)}
:focus-visible{outline:2px solid rgb(var(--c-accent));outline-offset:2px;border-radius:4px}
[tabindex="-1"]:focus{outline:none}
.flash{outline:2px solid rgb(var(--c-brand)/.7);outline-offset:10px;border-radius:6px;transition:outline-color .6s}
[data-theme="contrast"] *{border-color:#fff}
a{color:inherit}
.lnk{color:rgb(var(--c-accent));text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.lnk:hover{text-decoration-thickness:2px}
.hdr{background:#0F0120}
[data-theme="contrast"] .hdr{background:#000;border-bottom:1px solid #fff}
.brandband{background:linear-gradient(120deg,#0F0120 0%,#2A0848 55%,#4B1270 100%)}
[data-theme="contrast"] .brandband{background:#000;border-bottom:1px solid #fff}
.scroll-thin{scrollbar-width:thin;scrollbar-color:rgb(var(--c-line)) transparent}
/* Contenido de lectura */
.prose-k p{font-size:1.0625rem;line-height:1.8;margin:0 0 1.05rem;color:rgb(var(--c-fg))}
.prose-k p:last-child{margin-bottom:0}
.prose-k strong{font-weight:700}
.prose-k ul{margin:0 0 1rem 1.25rem;list-style:disc}.prose-k li{margin:.35rem 0;line-height:1.7}
.prose-k li::marker{color:rgb(var(--c-accent))}
.sec-h{font-family:'Montserrat',Arial,sans-serif;font-weight:800;letter-spacing:-.01em}
.lead p:first-child{font-size:1.18rem;line-height:1.75}
.eyebrow{font-family:'JetBrains Mono',Consolas,monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
/* Alertas estilo documentación */
.alert{border:1px solid;border-left-width:4px;border-radius:10px;padding:1.1rem 1.25rem}
.alert-info{border-color:rgb(var(--c-info)/.45);border-left-color:rgb(var(--c-info));background:rgb(var(--c-info)/.07)}
.alert-brand{border-color:rgb(var(--c-brand)/.45);border-left-color:rgb(var(--c-brand));background:rgb(var(--c-brand)/.08)}
.alert-ok{border-color:rgb(var(--c-ok)/.45);border-left-color:rgb(var(--c-ok));background:rgb(var(--c-ok)/.07)}
.alert-warn{border-color:rgb(var(--c-warn)/.5);border-left-color:rgb(var(--c-warn));background:rgb(var(--c-warn)/.07)}
.alert-bad{border-color:rgb(var(--c-bad)/.5);border-left-color:rgb(var(--c-bad));background:rgb(var(--c-bad)/.07)}
.alert-title{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.9rem;margin-bottom:.5rem}
/* Opciones de respuesta */
.opt{display:flex;align-items:flex-start;gap:.8rem;width:100%;text-align:left;border:1px solid rgb(var(--c-line));background:rgb(var(--c-surface));border-radius:10px;padding:.8rem 1rem;transition:border-color .12s,background .12s}
.opt:not(:disabled){cursor:pointer}
.opt:not(:disabled):hover{border-color:rgb(var(--c-brand))}
.opt .dot{flex:none;width:20px;height:20px;margin-top:2px;border-radius:999px;border:2px solid rgb(var(--c-fg2));display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:rgb(var(--c-brand));background:rgb(var(--c-brand)/.09)}
.opt[aria-checked="true"] .dot{border-color:rgb(var(--c-brand))}
.opt[aria-checked="true"] .dot::after{content:"";width:10px;height:10px;border-radius:999px;background:rgb(var(--c-brand))}
.opt.is-right{border-color:rgb(var(--c-ok));background:rgb(var(--c-ok)/.08)}
.opt.is-right .dot{border-color:rgb(var(--c-ok))}.opt.is-right .dot::after{background:rgb(var(--c-ok))}
.opt.is-wrong{border-color:rgb(var(--c-bad));background:rgb(var(--c-bad)/.08)}
.opt.is-wrong .dot{border-color:rgb(var(--c-bad))}.opt.is-wrong .dot::after{background:rgb(var(--c-bad))}
.opt:disabled{cursor:default}
/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:700;border-radius:8px;padding:.65rem 1.1rem;font-size:.95rem;transition:filter .12s,background .12s,border-color .12s}
.btn-primary{background:rgb(var(--c-brand));color:rgb(var(--c-onbrand))}
.btn-primary:hover{filter:brightness(1.08)}
.btn-secondary{border:1px solid rgb(var(--c-line));color:rgb(var(--c-fg));background:rgb(var(--c-surface))}
.btn-secondary:hover{border-color:rgb(var(--c-brand))}
.btn-ghost{color:rgb(var(--c-accent))}
.btn-ghost:hover{background:rgb(var(--c-brand)/.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.card{background:rgb(var(--c-surface));border:1px solid rgb(var(--c-line));border-radius:12px}
.pill{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.2rem .65rem;font-size:.78rem;font-weight:600;border:1px solid rgb(var(--c-line));color:rgb(var(--c-fg2))}
.bar{height:8px;border-radius:999px;background:rgb(var(--c-line)/.6);overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,#801BB5,#B44AF2)}
[data-theme="contrast"] .bar>div{background:#ff0}
.toc a[aria-current="true"]{color:rgb(var(--c-fg));border-left-color:rgb(var(--c-brand));font-weight:700}
.navitem[aria-current="page"]{background:rgb(var(--c-brand)/.12);color:rgb(var(--c-fg));font-weight:700;box-shadow:inset 3px 0 0 rgb(var(--c-brand))}
.fade-in{animation:fi .25s ease both}@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#drawer{transition:transform .22s ease}
#drawer:not(.open){transform:translateX(-100%)}
.cert-frame{background:linear-gradient(135deg,#1B0533 0%,#0F0120 55%,#240845 100%);border:1px solid rgba(180,74,242,.45);color:#F4EEFB}
.cert-frame::before{content:"";position:absolute;inset:14px;border:1px solid rgba(227,209,255,.18);border-radius:14px;pointer-events:none}
details>summary{list-style:none}details>summary::-webkit-details-marker{display:none}
details[open] .chev{transform:rotate(90deg)}
@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{background:#0F0120!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::before,header,footer,.no-print,#drawer,#drawerOverlay,#toast{display:none!important}
  main{padding:0!important}
  .cert-frame{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

const COURSE_DATA = {"intro": ["Son 7 módulos con 10 clases; cada clase termina con una comprobación de conocimientos. Cada módulo cierra con una evaluación: se necesita 80 % (5 de 6) para avanzar, con hasta 3 intentos.", "Todas las clases siguen la misma lógica: una apertura que engancha, una analogía cotidiana antes de cualquier término técnico, ejemplos reales, un apartado \"para quien ya lleva años en esto\" que le da valor al perfil técnico, un cierre con lo que hay que llevarse."], "modules": [{"id": 1, "name": "Qué es la ciberseguridad", "objective": "Que la persona entienda qué protege la ciberseguridad, domine el vocabulario base (activo, amenaza, vulnerabilidad, riesgo) y reconozca que proteger es un proceso continuo y no un producto.", "welcome": ["Bienvenido a Krixo Academy. Este es un curso para cualquier persona: si nunca has oído hablar de ciberseguridad, aquí vas a entender todo desde cero; y si ya trabajas en esto, vas a encontrar una forma ordenada de explicarlo y algunos matices que vale la pena repasar. En este primer módulo vamos a construir el idioma que usaremos el resto del curso: qué protege la ciberseguridad, cuáles son las piezas de un riesgo, quién ataca y por qué, cómo se protege una organización por capas."], "classes": [{"id": 1, "title": "Qué protege la ciberseguridad", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["Vamos a empezar con una pregunta que parece sencilla: ¿qué es la ciberseguridad? No me respondas lo que diría el diccionario, respóndeme como se lo explicarías a tu mamá, o a un amigo que no tiene ni idea de computadores.", "Casi siempre la respuesta es algo como \"que no me hackeen\" o \"tener un antivirus\". No está mal, pero se queda cortísimo. Es como decir que cuidar una casa es ponerle candado a la puerta. Sí, ayuda, pero ¿qué pasa con las ventanas? ¿Con la copia de la llave que tiene el primo del vecino? ¿Con lo que hay adentro y cuánto vale?"], "slug": "apertura"}, {"heading": "La analogía de la casa", "kind": "analogy", "paras": ["Quedémonos un momento con la casa, porque nos va a servir todo el curso. Cuidar una casa no es una sola cosa. Es la puerta, claro, pero también son las ventanas, a quién le diste llave, si alguien se da cuenta cuando entra un desconocido, qué haces si pasa algo y cómo recuperas lo que se llevaron. Y, sobre todo, es saber qué es lo que más te importa de lo que hay adentro. Porque no es lo mismo que se pierda el televisor a que se pierdan los documentos de toda la familia.", "Con la ciberseguridad pasa igual. Nadie la hace con una sola herramienta; es un conjunto de cosas que hacemos, en distintos frentes, para que nada de lo valioso se dañe."], "slug": "la-analogia-de-la-casa"}, {"heading": "La definición, sin enredos", "kind": "normal", "paras": ["Entonces, dicho de una forma muy simple: ciberseguridad es todo lo que hacemos para proteger la información, los sistemas que la manejan y las personas que los usan, de manera que nadie entre sin permiso, nadie cambie lo que no debe y todo funcione cuando lo necesitamos.", "Fíjate que en esa frase hay tres ideas pegadas: que nadie entre sin permiso, que nadie cambie lo que no debe, que todo funcione cuando lo necesitamos. Esas tres ideas tienen nombre; es lo primero que hay que dominar. Se llaman la tríada CID."], "slug": "la-definicion-sin-enredos"}, {"heading": "La tríada CID: los tres pilares", "kind": "normal", "paras": ["CID son las iniciales de Confidencialidad, Integridad y Disponibilidad. Vamos uno por uno, con ejemplos de la vida real.", "Empecemos por la confidencialidad. Quiere decir que la información solo la ve quien tiene que verla. Piensa en tu historia clínica. Tu médico la puede ver, tú la puedes ver, pero tu jefe no, ni mucho menos el vecino. Cuando alguien que no debía termina leyendo esa información, se rompió la confidencialidad. Eso es lo que llamamos una filtración o fuga de datos, lo que más sale en las noticias.", "Segundo pilar: la integridad. Aquí la idea es que la información sea la correcta y que nadie la haya cambiado sin permiso. Imagínate que vas a transferir cien mil pesos y, en el camino, alguien cambia el número de cuenta de destino. Nadie leyó nada, nadie apagó nada; aun así el daño es enorme, porque el dato dejó de ser confiable. Eso es una falla de integridad. Lo más peligroso es que a veces ni se nota.", "El tercero: la disponibilidad. Que los sistemas y los datos estén ahí cuando los necesitas. Es el cajero que no responde justo el día de pago, o la página del hospital que se cae cuando más gente la está usando. Aquí nadie robó ni cambió nada; simplemente no puedes usar lo tuyo. Para una empresa, eso cuesta plata cada minuto."], "slug": "la-triada-cid-los-tres-pilares"}, {"heading": "Cómo se ven los tres juntos", "kind": "normal", "paras": ["Ahora viene lo interesante: casi ningún incidente toca un solo pilar. Piensa en un ransomware, que es cuando bloquean tus archivos y te piden plata para devolverlos. A simple vista parece solo un problema de disponibilidad, porque no puedes abrir nada. Pero muchas veces, antes de bloquear, los atacantes se copian la información. Entonces también se rompió la confidencialidad. Si además alteraron datos, también la integridad. Un solo evento, tres pilares.", "Por eso esta tríada es tan útil: es como un lente. Cuando te cuentan que hubo un incidente, la primera pregunta que te debería salir no es \"¿qué tan grave fue?\", sino \"¿cuál pilar se rompió?\". Porque de eso depende todo lo que viene después. Si fue confidencialidad, hay que ver qué datos salieron y a quién hay que avisar. Si fue disponibilidad, lo urgente es restaurar. Si fue integridad, hay que descubrir qué cambió y volver a un estado confiable."], "slug": "como-se-ven-los-tres-juntos"}, {"heading": "La casa, otra vez", "kind": "normal", "paras": ["Ahora vamos a ponerle nombre a cada pieza de la historia de la casa, porque esos nombres los vas a escuchar en cualquier conversación de seguridad, desde una reunión con el área de TI hasta un comité de junta directiva.", "Son cinco palabras: activo, amenaza, vulnerabilidad, riesgo e impacto. Parecen sinónimos, pero no lo son; confundirlas es la causa de muchas malas decisiones.", "Imagínate tu casa. Adentro tienes cosas que te importan: la plata guardada, los documentos, el computador con las fotos de la familia. Eso es lo que vale la pena proteger. En seguridad, a eso le decimos activo.", "Ahora imagínate que vives en un barrio donde han robado varias casas este mes. Esos ladrones son la amenaza: lo que te puede hacer daño.", "Ahora, resulta que tu puerta tiene la cerradura dañada y no cierra bien. Esa es la vulnerabilidad: la debilidad que el ladrón podría aprovechar."], "slug": "la-casa-otra-vez"}, {"heading": "Riesgo e impacto", "kind": "normal", "paras": ["¿Cuál es el riesgo, entonces? Es la posibilidad de que el ladrón, que existe, aproveche la cerradura dañada, que también existe, para llevarse lo que tienes adentro. Por eso en seguridad se dice que el riesgo es la probabilidad por el impacto: qué tan probable es que pase, por cuánto daño haría si pasa.", "El impacto depende de lo que haya adentro. Si la casa está vacía, el impacto es pequeño. Si está la caja fuerte abierta, es enorme. Fíjate en algo: la misma cerradura dañada genera riesgos muy distintos según lo que proteja."], "slug": "riesgo-e-impacto"}, {"heading": "Llevado a una empresa", "kind": "normal", "paras": ["En una organización el activo puede ser la base de datos de clientes, el sistema de pagos o la reputación de la marca. La amenaza puede ser un grupo criminal, un programa malicioso o incluso un empleado que se equivoca. La vulnerabilidad puede ser un programa sin actualizar, una contraseña débil o una persona que no sabe reconocer un engaño.", "Aquí viene una idea que va a atravesar todo el curso: no todos los problemas pesan igual. Una falla en un servidor de pruebas que nadie usa no tiene el mismo riesgo que esa misma falla en el sistema que mueve la plata. Por eso las organizaciones no pueden decir simplemente \"tenemos cien problemas\"; tienen que preguntarse cuáles de esos cien pueden doler de verdad."], "slug": "llevado-a-una-empresa"}, {"heading": "Cómo se baja el riesgo", "kind": "normal", "paras": ["Hay dos caminos. El primero es bajar la probabilidad: arreglar la cerradura, o sea, corregir la vulnerabilidad. El segundo es bajar el impacto: no guardar todo en la casa, tener copias de los documentos, asegurar lo valioso. En una empresa eso se traduce en respaldos, en separar los sistemas importantes y en tener un plan para responder rápido.", "Lo que casi nunca se puede hacer es eliminar la amenaza. Los ladrones van a seguir existiendo. Lo que sí controlas es tu casa."], "slug": "como-se-baja-el-riesgo"}, {"heading": "Un matiz para quien ya lleva años en esto", "kind": "expert", "paras": ["Si tú ya trabajas en seguridad y estás pensando \"esto lo sé de memoria\", quédate un momento, porque hay unos matices que vale la pena recordar. Primero, la tríada es un modelo, no una ley. Otros marcos agregan conceptos como la autenticidad o el no repudio, todos válidos. Aun así, la tríada sigue siendo el idioma base porque con solo tres palabras describe casi cualquier incidente, lo que la hace perfecta para explicársela a alguien que no es técnico, como un gerente o un comité.", "Segundo, los pilares se pelean entre sí. Si quieres máxima confidencialidad, puedes encerrar todo en una caja fuerte tan segura que nadie la pueda abrir, pero acabas de matar la disponibilidad. Si quieres que todo esté disponible para todos, sacrificas la confidencialidad. Hacer buena seguridad es encontrar el equilibrio correcto para cada activo, un equilibrio que no es igual para un hospital que para una tienda en línea. Esa conversación, la de cuánto de cada pilar necesita cada cosa, es la que separa la seguridad que funciona de la que estorba.", "Tercero, todo el vocabulario de activo, amenaza y riesgo se formaliza en matrices de riesgo, con riesgo inherente, que es el que existe antes de aplicar controles, y riesgo residual, que es el que queda después. El residual nunca es cero; alguien con autoridad en la organización tiene que aceptarlo de forma explícita. Esa aceptación es una decisión de negocio, no técnica, por eso este vocabulario es el puente entre el equipo de seguridad y la gerencia."], "slug": "un-matiz-para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["Resumamos. La ciberseguridad no es un antivirus ni algo que se compra una vez: es proteger información, sistemas y personas, por capas, todo el tiempo. La tríada CID nos da el lenguaje para hablar de eso: confidencialidad es que solo lo vea quien debe; integridad, que nadie lo cambie sin permiso; disponibilidad, que esté cuando lo necesitas. Un mismo incidente puede romper uno, dos o los tres.", "Después le pusimos nombre a las piezas. Activo es lo que vale, amenaza es lo que puede hacer daño, vulnerabilidad es la debilidad. El riesgo es la posibilidad de que la amenaza aproveche esa debilidad; se mide como probabilidad por impacto. Por eso el mismo problema pesa distinto según lo que esté en juego.", "En la siguiente clase vamos a mirar al otro lado, quién ataca y por qué, para después ver cómo se protege una organización por capas. Antes, unas preguntas rápidas para comprobar que todo quedó claro."], "slug": "lo-que-debes-llevarte"}], "check": [{"q": "Un colaborador del área comercial accede sin autorización a los correos de un directivo. No modifica ni elimina nada. ¿Qué pilar de la tríada CID se vio comprometido?", "options": ["Autenticidad", "Integridad", "Confidencialidad", "Disponibilidad"], "rationales": ["La autenticidad aparece en otros marcos, pero el hecho central aquí es un acceso indebido a la información.", "La integridad se rompe cuando la información se altera sin permiso. En este caso no se modificó nada.", "La información fue vista por alguien que no debía verla. Eso rompe la confidencialidad, aunque nada haya cambiado.", "Los correos siguieron accesibles para su dueño, así que la disponibilidad no se afectó."], "answer": 2, "refClass": 1, "ref": "La tríada CID: los tres pilares"}, {"q": "Un ransomware bloquea los servidores de una empresa. Antes del cifrado, los atacantes copiaron la base de datos de clientes. ¿Qué pilares se vieron afectados?", "options": ["Solo la disponibilidad del servicio", "Solo la confidencialidad de los clientes", "Disponibilidad y confidencialidad", "Integridad y disponibilidad de los datos"], "rationales": ["El bloqueo es lo visible, pero la copia previa de los datos también rompe la confidencialidad.", "La copia es grave, pero el bloqueo de los servidores también afecta la disponibilidad.", "El bloqueo impide operar (disponibilidad) y la copia previa expone información a terceros (confidencialidad).", "No hay indicios de que los datos se alteraran; lo que ocurrió fue un bloqueo y una copia."], "answer": 2, "refClass": 1, "ref": "Cómo se ven los tres juntos"}, {"q": "La base de datos de clientes de una sucursal funciona con un software sin actualizar, mientras un grupo criminal ataca empresas del sector. ¿Cuál de estos elementos es la vulnerabilidad?", "options": ["La base de datos de clientes", "El grupo criminal del sector", "La posible fuga de los datos", "El software sin actualizar"], "rationales": ["Es el activo: lo que tiene valor para la organización y se debe proteger.", "Es la amenaza: quien puede causar el daño, no la debilidad que lo permite.", "Es el impacto o la consecuencia, no la debilidad que la hace posible.", "Es la debilidad que alguien podría aprovechar para causar daño."], "answer": 3, "refClass": 1, "ref": "La casa, otra vez"}, {"q": "El mismo error de configuración aparece en un servidor de pruebas sin datos reales y en el sistema que procesa los pagos. ¿Por qué el riesgo no es igual en ambos casos?", "options": ["Porque el impacto cambia según el activo afectado", "Porque la amenaza solo ataca sistemas de producción", "Porque la vulnerabilidad es distinta en cada servidor", "Porque el servidor de pruebas no tiene vulnerabilidades"], "rationales": ["El riesgo combina probabilidad e impacto. El sistema de pagos tiene mucho más en juego que un servidor de pruebas.", "Los ataques son oportunistas: un ambiente de pruebas expuesto también puede ser aprovechado.", "La debilidad es exactamente la misma; lo que cambia es el valor de lo que protege.", "El enunciado indica que el mismo error existe en ambos servidores."], "answer": 0, "refClass": 1, "ref": "Riesgo e impacto"}, {"q": "Una empresa no puede corregir todavía una falla en su sistema de facturación. ¿Qué medida reduce el impacto de un posible incidente, sin eliminar la vulnerabilidad?", "options": ["Esperar a que la amenaza deje de existir", "Aplicar el parche que corrige la falla", "Mantener respaldos probados y aislados", "Cambiar la contraseña del administrador"], "rationales": ["Las amenazas casi nunca se pueden eliminar. Lo que sí se controla es la propia organización.", "Parchar elimina la vulnerabilidad y reduce la probabilidad; la pregunta pide reducir el impacto sin corregirla.", "Los respaldos no cierran la falla, pero permiten recuperarse rápido si alguien la aprovecha.", "Puede ser útil en otros escenarios, pero no reduce el daño si se aprovecha esta falla."], "answer": 2, "refClass": 1, "ref": "Cómo se baja el riesgo"}, {"q": "Tras aplicar controles en el sistema de nómina, el análisis muestra que todavía queda un nivel de riesgo. ¿Qué debe pasar con ese riesgo?", "options": ["La gerencia debe aceptarlo de forma explícita", "El equipo técnico debe seguir hasta llevarlo a cero", "Debe ignorarse porque los controles ya se aplicaron", "Debe clasificarse como riesgo inherente del sistema"], "rationales": ["El riesgo residual nunca es cero. Aceptarlo es una decisión de negocio que toma alguien con autoridad.", "El riesgo residual nunca llega a cero; perseguirlo indefinidamente no es viable ni proporcional.", "Ignorarlo deja una exposición sin dueño. Debe aceptarse de forma explícita y documentada.", "El riesgo inherente es el que existe antes de los controles; el que queda después es el residual."], "answer": 0, "refClass": 1, "ref": "Un matiz para quien ya lleva años en esto"}], "words": 1555}, {"id": 2, "title": "Quién está del otro lado y cómo nos defendemos", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["Cuando la gente piensa en un atacante, casi siempre se imagina lo mismo: un muchacho encapuchado en un cuarto oscuro, con letras verdes cayendo en la pantalla. Esa imagen viene de las películas y, la verdad, nos hace un flaco favor, porque nos hace pensar que los ataques son raros, sofisticados y dirigidos a otros. Hoy vamos a cambiar esa imagen."], "slug": "apertura"}, {"heading": "Por qué atacan", "kind": "normal", "paras": ["La pregunta más útil no es quién, sino por qué. La respuesta más común, por mucho, es plata. La mayoría de los incidentes que afectan a empresas y personas tienen detrás una motivación económica: vender datos, cobrar un rescate, desviar un pago o usar cuentas ajenas.", "Hay otras motivaciones, claro. Está el espionaje, cuando alguien quiere información de una empresa o de un país. Está el activismo, cuando un grupo quiere mandar un mensaje político o social. Está la venganza, por ejemplo un exempleado molesto. Está también el puro oportunismo: alguien que encontró una puerta abierta y entró porque pudo."], "slug": "por-que-atacan"}, {"heading": "Quiénes son, a grandes rasgos", "kind": "normal", "paras": ["Sin entrar en detalles, podemos hablar de cuatro tipos. Los grupos criminales, que funcionan casi como empresas, con roles, metas y hasta servicio al cliente. Las personas internas, que ya están dentro de la organización y pueden causar daño con intención o por descuido. Los grupos con motivación ideológica. Por último, los actores patrocinados por estados, que tienen muchos recursos y objetivos muy específicos.", "Para la mayoría de las organizaciones, el día a día es el primer grupo: el criminal que busca plata."], "slug": "quienes-son-a-grandes-rasgos"}, {"heading": "La idea clave: el oportunismo", "kind": "normal", "paras": ["Ahora, esto es lo más importante de la clase. La mayoría de los ataques no es personal. No es que alguien se levante y diga \"hoy voy por esta empresa en particular\". Lo que pasa es que se busca, de forma masiva, lo que sea más fácil de aprovechar: la contraseña más débil, el sistema más desactualizado, la persona que hace clic sin mirar.", "Es como el ladrón que recorre una calle probando las puertas. No le importa de quién es la casa; le importa cuál está abierta.", "Por eso la frase \"a nosotros no nos va a pasar, somos muy pequeños\" es de las más peligrosas que hay. Una empresa pequeña no es menos interesante; muchas veces es más fácil, lo que la hace más atractiva."], "slug": "la-idea-clave-el-oportunismo"}, {"heading": "Dos palabras que vas a escuchar", "kind": "normal", "paras": ["Un incidente de seguridad es cualquier evento que afecta, o puede afectar, la confidencialidad, la integridad o la disponibilidad. Sí, la tríada de la primera clase.", "Una brecha de datos es un tipo específico de incidente: cuando información queda expuesta o es obtenida por alguien que no debía. Todas las brechas son incidentes, pero no todos los incidentes son brechas."], "slug": "dos-palabras-que-vas-a-escuchar"}, {"heading": "El castillo", "kind": "analogy", "paras": ["Ya sabemos qué protegemos, con qué palabras hablar de eso, quién está del otro lado. Ahora la pregunta es cómo se defiende uno. La respuesta corta: por capas.", "Piensa en un castillo medieval. No tenía solo una puerta fuerte. Tenía un foso con agua, una muralla, una puerta con rastrillo, guardias en las torres y, adentro, una torre final donde se guardaba lo más valioso. Si el enemigo cruzaba el foso, se encontraba la muralla. Si pasaba la muralla, estaban los guardias.", "Esa idea tiene nombre en seguridad: defensa en profundidad. Ninguna protección es perfecta, entonces se ponen varias, para que si una falla, la siguiente contenga el daño."], "slug": "el-castillo"}, {"heading": "Las capas en una organización", "kind": "normal", "paras": ["Las capas típicas son siete; te las cuento de afuera hacia adentro. Las personas, que tienen que saber reconocer un engaño. La identidad, o sea quién eres y cómo lo demuestras: contraseñas y verificación en dos pasos. La red, que controla qué tráfico entra y sale. Los equipos, que necesitan protección y estar actualizados. Las aplicaciones, que deben estar bien construidas. Los datos, que deben tener copias y protección. Por último, el monitoreo, que es tener a alguien mirando, tanto adentro como afuera, para darse cuenta cuando algo pasa."], "slug": "las-capas-en-una-organizacion"}, {"heading": "Los hábitos que dependen de ti", "kind": "normal", "paras": ["Mucha gente cree que la seguridad es un tema del área de TI, pero varias de esas capas dependen de cada uno de nosotros. Hay cuatro hábitos que, por sí solos, evitan una cantidad enorme de problemas. Actualizar el celular y el computador cuando te lo piden. Usar contraseñas distintas para cada servicio. Activar la verificación en dos pasos en el correo y en el banco. También, desconfiar de cualquier mensaje que te apure o te asuste.", "No necesitas saber de tecnología para hacer ninguna de esas cuatro cosas."], "slug": "los-habitos-que-dependen-de-ti"}, {"heading": "La seguridad es un ciclo", "kind": "normal", "paras": ["Otra idea importante: la seguridad no se instala, se practica. Funciona como un ciclo que se repite: prevenir lo que se pueda, detectar lo que pase, responder rápido y recuperarse. Después, vuelta a empezar, aprendiendo de lo que pasó."], "slug": "la-seguridad-es-un-ciclo"}, {"heading": "Detectar no es lo mismo que gestionar", "kind": "normal", "paras": ["Aquí te dejo una idea que vamos a desarrollar a fondo en el último módulo. Imagínate que tu castillo tiene un guardia que ve al enemigo acercarse, toma nota en un cuaderno y se va a dormir. Detectó, sí, pero no sirvió de nada. En las organizaciones pasa mucho más de lo que crees: llegan alertas, reportes, avisos que nadie atiende. Detectar es solo el primer paso. Lo que reduce el riesgo es gestionar: que alguien sea responsable, que actúe en un plazo y que quede registro de lo que hizo."], "slug": "detectar-no-es-lo-mismo-que-gestionar"}, {"heading": "Para quien ya lleva años en esto", "kind": "expert", "paras": ["Si vienes del mundo técnico, sabes que el ecosistema criminal se ha especializado muchísimo: hay quienes solo consiguen accesos, otros que solo los venden, otros que solo los usan. Esa división del trabajo explica por qué un dato expuesto hoy puede convertirse en un incidente semanas después, en manos de alguien completamente distinto. Por eso mirar hacia afuera, no solo dentro de la red, se volvió tan importante.", "Del lado de la defensa, seguro conoces el NIST CSF, que organiza el ciclo de seguridad en seis funciones: gobernar, identificar, proteger, detectar, responder y recuperar. Lo interesante de la versión más reciente es que agregó gobernar como función propia, reconociendo que sin dirección, roles claros ni rendición de cuentas, las demás funciones se quedan cojas."], "slug": "para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["La motivación más común es económica. Casi todos los ataques son oportunistas: buscan lo fácil, no a alguien en particular, así que ninguna organización es demasiado pequeña para ser un objetivo. Un incidente es cualquier evento que afecte la tríada; una brecha, cuando la información sale de donde debía estar.", "Del lado de la defensa, ninguna protección es perfecta, por eso se protege por capas, varias de las cuales dependen más de las personas que de la tecnología. La seguridad es un ciclo que no termina. Detectar sin gestionar es como tener un guardia que avisa sin que nadie le haga caso.", "Con esto cerramos el primer módulo. Antes de pasar al siguiente, vas a responder un cuestionario corto para comprobar que todo quedó claro."], "slug": "lo-que-debes-llevarte"}], "check": [{"q": "Una empresa de 15 empleados considera que es demasiado pequeña para interesarle a un atacante. ¿Qué idea de la clase contradice mejor esa creencia?", "options": ["Las empresas pequeñas suelen ser blanco de actores estatales", "Los atacantes prefieren empresas pequeñas por su información", "Todos los ataques se planean contra una empresa en particular", "La mayoría de los ataques son oportunistas y buscan lo más fácil"], "rationales": ["Los actores estatales tienen objetivos muy específicos; no son el día a día de la mayoría de organizaciones.", "El criterio principal no es el tipo de información, sino qué tan fácil resulta entrar.", "Es lo contrario: la mayoría de los ataques no es personal.", "Se busca de forma masiva lo más fácil de aprovechar, sin importar el tamaño. Una empresa pequeña suele ser más fácil."], "answer": 3, "refClass": 2, "ref": "La idea clave: el oportunismo"}, {"q": "El servidor de correo de una empresa deja de responder durante dos horas por un ataque, pero ningún dato fue copiado ni expuesto. ¿Cómo se clasifica el evento?", "options": ["Es una brecha de datos, porque afectó un servidor", "No es un incidente, porque no se perdió información", "Es una brecha y un incidente al mismo tiempo", "Es un incidente, pero no una brecha de datos"], "rationales": ["Una brecha exige que la información quede expuesta u obtenida por alguien que no debía.", "Un incidente es cualquier evento que afecta la tríada, incluida la disponibilidad.", "Todas las brechas son incidentes, pero aquí no hubo exposición de datos.", "Afecta la disponibilidad, así que es un incidente. No hubo exposición de información, así que no es una brecha."], "answer": 3, "refClass": 2, "ref": "Dos palabras que vas a escuchar"}, {"q": "Un atacante obtiene la contraseña de un empleado, pero no logra entrar porque la cuenta exige verificación en dos pasos. ¿Qué principio de defensa se evidencia?", "options": ["Defensa en profundidad", "Segmentación de la red", "Gestión de amenazas", "Mínimo privilegio"], "rationales": ["Una capa falló (la contraseña) y la siguiente (la verificación) contuvo el daño.", "Segmentar controla el tráfico entre redes. El control que actuó fue de identidad.", "La gestión se refiere a atender hallazgos con responsable y plazo; aquí actuó un control preventivo.", "El mínimo privilegio limita lo que puede hacer una cuenta; no es lo que impidió el acceso."], "answer": 0, "refClass": 2, "ref": "El castillo"}, {"q": "¿Cuál de estos hábitos individuales protege directamente la capa de identidad?", "options": ["Activar la verificación en dos pasos", "Revisar el tráfico que entra y sale de la red", "Desconfiar de mensajes que generan urgencia", "Actualizar el celular cuando lo solicita"], "rationales": ["La capa de identidad trata de cómo demuestras quién eres: contraseñas y verificación en dos pasos.", "Corresponde a la capa de red y no es un hábito individual.", "Protege la capa de personas frente a la ingeniería social.", "Protege la capa de equipos, porque corrige fallas conocidas del sistema."], "answer": 0, "refClass": 2, "ref": "Las capas en una organización"}, {"q": "El monitoreo de una empresa generó una alerta crítica que quedó registrada, pero nadie la atendió durante tres semanas. ¿Qué faltó?", "options": ["Un antivirus con firmas más actualizadas", "Más herramientas de detección en la red", "Una capa adicional de protección en los equipos", "Un responsable con plazo para actuar"], "rationales": ["La detección funcionó; lo que faltó fue gestionarla.", "La alerta sí se detectó. El problema fue que nadie actuó sobre ella.", "El fallo no fue de protección, sino de atención a lo que ya se había detectado.", "Detectar es solo el primer paso. Sin responsable, plazo y registro de la acción, el riesgo no baja."], "answer": 3, "refClass": 2, "ref": "Detectar no es lo mismo que gestionar"}, {"q": "La versión más reciente del NIST CSF agregó una función propia. ¿Cuál es y qué reconoce?", "options": ["Gobernar: sin dirección, roles ni rendición de cuentas, el resto falla", "Identificar: sin inventario de activos, no es posible proteger nada", "Detectar: sin monitoreo continuo, los incidentes pasan inadvertidos", "Recuperar: sin respaldos probados, ninguna respuesta es efectiva"], "rationales": ["Gobernar se incorporó como función propia porque las demás dependen de dirección y roles claros.", "Identificar ya existía en versiones anteriores del marco.", "Detectar ya existía; la novedad fue la función de gobernar.", "Recuperar ya existía; la novedad fue la función de gobernar."], "answer": 0, "refClass": 2, "ref": "Para quien ya lleva años en esto"}], "words": 1097}], "quiz": [{"q": "El sistema de citas de un hospital se cae el día de mayor demanda. No hubo acceso indebido ni cambios en los datos. ¿Qué debe priorizar el equipo según el pilar afectado?", "options": ["Descubrir qué cambió y volver a un estado confiable", "Identificar qué datos salieron y a quién avisar", "Notificar una brecha de datos al regulador", "Restaurar el servicio cuanto antes"], "ref": "Cómo se ven los tres juntos", "refClass": 1}, {"q": "Un analista propone: \"Tenemos ciento veinte hallazgos; corrijámoslos en el orden del reporte\". ¿Qué error conceptual comete?", "options": ["Asume que los hallazgos son incidentes de seguridad", "Ignora que el riesgo depende del impacto en cada activo", "Confunde amenaza con vulnerabilidad en el reporte", "Debería corregir primero los hallazgos más antiguos"], "ref": "Llevado a una empresa", "refClass": 1}, {"q": "Para proteger los datos de pacientes, un hospital propone cifrarlo todo y restringir el acceso a solo dos personas. ¿Qué riesgo advierte la clase sobre este enfoque?", "options": ["Convierte el riesgo inherente en riesgo aceptado", "Elimina por completo el riesgo de sufrir una brecha de datos", "Puede afectar la integridad de los registros clínicos", "Puede sacrificar la disponibilidad que el servicio necesita"], "ref": "Un matiz para quien ya lleva años en esto", "refClass": 1}, {"q": "Un exempleado que conserva su acceso borra archivos del área financiera por resentimiento. ¿Qué tipo de actor y qué motivación describe el caso?", "options": ["Grupo ideológico, motivado por activismo", "Persona interna, motivada por venganza", "Grupo criminal, motivado por dinero", "Actor estatal, motivado por espionaje"], "ref": "Quiénes son, a grandes rasgos", "refClass": 2}, {"q": "Una organización tiene antivirus en todos sus equipos y considera que eso es suficiente. ¿Qué concepto explica por qué no lo es?", "options": ["Ninguna protección es perfecta por sí sola", "Los antivirus no detectan el malware moderno", "El antivirus solo protege la capa de identidad", "Solo el monitoreo externo protege a la organización"], "ref": "El castillo", "refClass": 2}, {"q": "¿Cuál es la diferencia entre riesgo inherente y riesgo residual?", "options": ["El inherente existe antes de los controles; el residual, después", "El inherente es técnico; el residual es una decisión de negocio", "El inherente afecta activos; el residual afecta solo a personas", "El inherente se elimina con controles; el residual no se elimina"], "ref": "Un matiz para quien ya lleva años en esto", "refClass": 1}]}, {"id": 2, "name": "Cómo funciona Internet y qué queda expuesto", "objective": "Que la persona entienda, con analogías, cómo se localiza un sitio en Internet y quién interviene, distinga Surface, Deep y Dark Web, además de comprender qué información de una organización o de una persona puede quedar visible.", "welcome": ["En este módulo vamos a entender cómo funciona Internet por dentro, sin una sola fórmula. Vamos a ver cómo tu computador encuentra una página, quién es dueño de cada pieza de un sitio web, qué son la Deep Web y la Dark Web, qué tanto de una persona o de una empresa se puede ver desde afuera. Esto es la base para entender casi todo lo que viene después."], "classes": [{"id": 3, "title": "Internet por dentro, qué se ve desde afuera", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["Cada vez que escribes el nombre de una página en el navegador y le das Enter, pasa algo que casi nadie se detiene a pensar. En menos de un segundo, tu computador tiene que averiguar dónde queda esa página en el mundo y llegar hasta ella. Hoy vamos a ver cómo lo hace, porque entender eso te va a ayudar a entender muchos engaños."], "slug": "apertura"}, {"heading": "Dirección y nombre", "kind": "normal", "paras": ["Piensa en una casa. Tiene una dirección exacta: calle tal, número tal. Pero tú no te aprendes las direcciones de tus amigos; te aprendes sus nombres. Si quieres visitar a Laura, piensas \"voy donde Laura\", no \"voy a la calle 45 número 12-30\".", "En Internet es igual. Cada servidor, que es el computador donde vive una página, tiene una dirección numérica que se llama dirección IP. Algo así como cuatro grupos de números separados por puntos. Pero nadie se aprende eso. Por eso existen los dominios: el nombre fácil de recordar, como el nombre de una empresa seguido de punto com o punto co."], "slug": "direccion-y-nombre"}, {"heading": "El directorio: DNS", "kind": "normal", "paras": ["Entonces, ¿cómo pasa tu computador del nombre a la dirección? Usando una especie de agenda de contactos gigante que se llama DNS. Tú le preguntas al DNS \"¿dónde queda tal dominio?\" y el DNS te responde \"queda en esta dirección IP\". Tu computador va a esa dirección y te muestra la página.", "Esa agenda no solo guarda dónde está la página. También guarda, por ejemplo, a dónde deben llegar los correos de ese dominio, o si un nombre es un alias de otro. Son diferentes tipos de anotaciones en la misma agenda."], "slug": "el-directorio-dns"}, {"heading": "Por qué esto importa en seguridad", "kind": "normal", "paras": ["Aquí está lo interesante. Si alguien logra engañarte para que escribas o hagas clic en un nombre que se parece mucho al real, la agenda lo va a llevar sin problema a donde ese nombre apunte, que puede ser un lugar controlado por otra persona. El sistema funciona perfecto; el problema es que el nombre no era el que creías. Esto lo vamos a retomar cuando hablemos de phishing."], "slug": "por-que-esto-importa-en-seguridad"}, {"heading": "Tres piezas, tres dueños", "kind": "normal", "paras": ["Ya sabes cómo se encuentra una página. Ahora vamos a ver de quién es cada pedazo de esa página, porque aunque parezca un solo sitio, detrás hay varias empresas distintas, cada una con su responsabilidad.", "Volvamos a la casa. Una cosa es el nombre que aparece en el directorio, otra es el terreno donde está construida y otra es quien vive adentro y decide cómo se ve.", "Con un sitio web pasa lo mismo. El nombre, o sea el dominio, se compra y se renueva a través de una empresa que se llama registrador. El lugar donde vive el sitio, el servidor, lo presta un proveedor de hosting, que es como el dueño del terreno. El contenido, por su parte, lo administra quien montó la página.", "Muchas veces son tres empresas distintas, en tres países distintos."], "slug": "tres-piezas-tres-duenos"}, {"heading": "WHOIS: la consulta pública", "kind": "normal", "paras": ["Existe una consulta pública que se llama WHOIS, que te permite ver algunos datos del registro de un dominio: cuándo se creó, con qué registrador y, a veces, datos de contacto. Hoy en día muchos datos personales vienen ocultos por privacidad, pero la fecha de creación y el registrador casi siempre se ven.", "La fecha de creación es un dato valiosísimo. Un dominio que se parece al de tu banco y que se creó hace dos días es, como mínimo, sospechoso."], "slug": "whois-la-consulta-publica"}, {"heading": "Por qué importa saber quién es quién", "kind": "normal", "paras": ["Imagínate que encuentras una página falsa que se hace pasar por tu empresa. ¿A quién le reclamas? Si le escribes a quien no corresponde, pierdes días mientras la página sigue engañando gente. Saber quién registró el nombre y quién presta el servidor te dice exactamente a quién dirigirte. Esto lo vamos a usar en el módulo de phishing, cuando hablemos de cómo se retira una página fraudulenta."], "slug": "por-que-importa-saber-quien-es-quien"}, {"heading": "El edificio", "kind": "analogy", "paras": ["Seguro has escuchado hablar de la Deep Web y la Dark Web, casi siempre en tono de misterio, como si fueran lo mismo y como si todo lo que pasa ahí fuera ilegal. Vamos a aclarar eso, porque es uno de los temas con más mitos en la ciberseguridad.", "Imagínate un edificio grande. La fachada y el lobby los ve cualquiera que pase por la calle. Eso es la Surface Web: todo lo que encuentras buscando en Google, como noticias, páginas de empresas o blogs.", "Adentro del edificio hay muchísimas oficinas con llave: contabilidad, recursos humanos, archivo. No están ocultas por algo malo; simplemente no son para todo el mundo. Eso es la Deep Web: tu correo, tu banca en línea, la intranet de tu empresa, tu historia clínica. Todo eso existe en Internet, pero no aparece en un buscador porque necesitas usuario y contraseña. Ojo: la Deep Web es muchísimo más grande que la Surface Web; la usas todos los días.", "Y, por último, imagínate un sótano al que solo se llega por una puerta escondida y con una herramienta especial que oculta quién eres. Eso es la Dark Web."], "slug": "el-edificio"}, {"heading": "Qué es realmente la Dark Web", "kind": "normal", "paras": ["La Dark Web es una parte pequeña de la Deep Web a la que se accede con programas especiales que protegen el anonimato, tanto del que visita como del que publica. Ese anonimato tiene usos legítimos, como proteger a periodistas o a personas en países con censura. Pero también hace que allí se compren y vendan cosas ilegales, entre ellas datos robados.", "Hoy, además del sótano, mucho de ese intercambio también ocurre en canales de aplicaciones de mensajería."], "slug": "que-es-realmente-la-dark-web"}, {"heading": "Por qué le importa a una organización", "kind": "normal", "paras": ["Cuando los datos de una empresa son robados, muchas veces terminan publicados u ofrecidos en esos espacios antes de que la propia empresa se entere. Si una organización sabe a tiempo que su información está circulando, puede reaccionar: cambiar accesos, avisar a quienes corresponda y prepararse. Si no lo sabe, se entera cuando ya es tarde.", "Ahora, algo importante: esa vigilancia no se hace entrando uno mismo a curiosear. La hacen equipos y servicios especializados, con las precauciones necesarias."], "slug": "por-que-le-importa-a-una-organizacion"}, {"heading": "Huella digital", "kind": "normal", "paras": ["Haz un ejercicio rápido: busca tu nombre completo en Internet. Lo que aparezca, fotos, perfiles, menciones, un documento viejo, es tu huella digital. Ahora imagina ese ejercicio para una empresa entera. Eso es lo que vamos a ver ahora.", "La huella digital es todo lo que se puede encontrar de ti en Internet: lo que publicaste, lo que otros publicaron de ti y lo que quedó expuesto sin que te dieras cuenta. No es necesariamente malo; es simplemente lo que se ve desde afuera."], "slug": "huella-digital"}, {"heading": "Superficie de ataque", "kind": "normal", "paras": ["En una organización, esa idea se vuelve más seria y se llama superficie de ataque: el conjunto de todos los puntos visibles desde afuera por los que alguien podría intentar entrar o causar daño.", "¿Qué entra ahí? Los dominios y subdominios de la empresa. Los servicios que están publicados en Internet. Los correos de los empleados. Los perfiles en redes sociales. Las aplicaciones móviles. Los proveedores que tienen acceso. Hasta documentos que alguien publicó por error."], "slug": "superficie-de-ataque"}, {"heading": "El caso más común", "kind": "normal", "paras": ["Un equipo monta un sitio de pruebas para un proyecto. El proyecto se cancela, todo el mundo sigue con su vida y el sitio queda ahí, encendido, sin actualizar, sin dueño. Años después, alguien lo encuentra en una búsqueda automática y lo usa como puerta de entrada.", "Nadie hizo nada malo a propósito. Simplemente, nadie se acordó de que existía."], "slug": "el-caso-mas-comun"}, {"heading": "Lo que no se conoce no se protege", "kind": "normal", "paras": ["Por eso la primera tarea de cualquier organización es saber qué tiene expuesto. Suena obvio, pero la mayoría de las empresas, cuando hacen el ejercicio, descubre cosas que no sabía que estaban publicadas. Esa diferencia, entre lo que creen que tienen y lo que realmente tienen, es exactamente donde está el riesgo.", "El atacante hace este mismo ejercicio antes de cualquier cosa. La idea es que la organización lo haga primero y de forma continua."], "slug": "lo-que-no-se-conoce-no-se-protege"}, {"heading": "Para quien ya lleva años en esto", "kind": "expert", "paras": ["Si eres técnico, sabes que detrás del DNS hay registros A, MX, NS y CNAME. Revisar la configuración DNS de un dominio dice muchísimo de una organización: qué proveedores usa, qué servicios tiene publicados, a veces hasta qué dejó olvidado. Por eso es de las primeras cosas que mira cualquiera que quiera entender la exposición de una empresa, sea para defenderla o para atacarla.", "Del lado del hosting, la dirección IP te lleva al proveedor y a su ASN, que es el número que identifica a la red de ese proveedor. Cada uno publica un contacto de abuso para recibir reportes; conocer esos contactos, junto con la forma en que responde cada proveedor, es parte del oficio de cualquier equipo que gestiona suplantaciones.", "Con la Dark Web, el valor no está en entrar a esos espacios sino en recolectar de forma continua lo que aparece, normalizarlo, cruzarlo contra los dominios, marcas y personas de la organización. Lo difícil es filtrar el ruido, porque muchas publicaciones son reciclaje de filtraciones viejas o directamente falsas. La validación es lo que separa la inteligencia del chisme.", "Todo esto, en el área técnica, se conoce como gestión de la superficie de ataque externa. Lo que más se subestima es que esa superficie cambia todos los días: cada campaña, cada proveedor nuevo, cada servicio en la nube la modifica. Un inventario hecho una vez al año envejece casi de inmediato; tiene que ser continuo."], "slug": "para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["Lo primero: la dirección IP es la dirección exacta del servidor, el dominio es el nombre fácil de recordar, el DNS es la agenda que traduce uno en otro. Si te engañan con el nombre, el sistema te lleva sin dudarlo al lugar equivocado.", "Detrás de un sitio hay varias piezas con dueños distintos: el registrador del nombre, el hosting que presta el servidor, quien administra el contenido. WHOIS muestra los datos públicos del registro, donde la fecha de creación dice mucho. Saber quién es quién te dice a quién acudir cuando hay un problema.", "Sobre las capas de la web: la Surface Web es lo que aparece en buscadores; la Deep Web es todo lo que pide acceso, sin tener nada de ilegal; la Dark Web es una parte oculta y anónima donde también circulan datos robados. Enterarse a tiempo de que tu información está ahí es lo que permite actuar antes del daño.", "Por último, la huella digital es lo que se ve de ti desde afuera; la superficie de ataque, lo que se ve de una organización que podría aprovecharse. Los activos olvidados están entre los riesgos más comunes, porque lo que no se conoce no se puede proteger.", "Con esto cerramos el módulo 2. Antes de seguir, responde el cuestionario final."], "slug": "lo-que-debes-llevarte"}], "check": [{"q": "Al escribir el nombre de un sitio en el navegador, ¿qué componente traduce ese nombre a la dirección IP del servidor?", "options": ["El proveedor de hosting", "El DNS", "La consulta WHOIS", "El registrador"], "rationales": ["Presta el servidor donde vive el sitio, pero no resuelve nombres.", "Funciona como una agenda: recibe el nombre del dominio y responde con la dirección IP.", "Muestra datos públicos del registro del dominio, no traduce nombres a direcciones.", "Vende y renueva el dominio, pero no traduce el nombre en cada consulta."], "answer": 1, "refClass": 3, "ref": "El directorio: DNS"}, {"q": "Un cliente reporta una página idéntica al portal de la empresa, alojada en \"tuempresa-pagos.co\". ¿Por qué el navegador la carga sin problema?", "options": ["El DNS de la empresa fue modificado por un atacante", "El DNS resuelve cualquier nombre registrado", "El navegador no valida dominios con terminación .co", "La página falsa comparte la dirección IP del sitio real"], "rationales": ["No hace falta alterar nada: basta con registrar un nombre parecido.", "El sistema funciona como debe; el problema es que el nombre no es el legítimo.", "La terminación del dominio no tiene relación con el problema.", "Normalmente está en otro servidor, controlado por otra persona."], "answer": 1, "refClass": 3, "ref": "Por qué esto importa en seguridad"}, {"q": "Debes solicitar que se retire un sitio fraudulento. ¿Quién controla el servidor donde está alojado?", "options": ["El proveedor de hosting", "El administrador del contenido", "La autoridad DNS del país", "El registrador del dominio"], "rationales": ["Es quien presta el servidor, como el dueño del terreno donde está construida la casa.", "Es quien montó la página; en un fraude, es el propio atacante.", "No es una de las piezas descritas: el servidor lo presta el hosting.", "Controla el nombre del sitio, no el servidor donde se aloja."], "answer": 0, "refClass": 3, "ref": "Tres piezas, tres dueños"}, {"q": "En una consulta WHOIS de un dominio parecido al de tu banco, ¿qué dato suele ser más útil para evaluar si es sospechoso?", "options": ["La fecha de creación", "El número de visitas", "El idioma del contenido", "El nombre del titular"], "rationales": ["Un dominio parecido al de tu banco creado hace pocos días es, como mínimo, sospechoso.", "WHOIS no muestra visitas ni tráfico del sitio.", "WHOIS muestra datos del registro, no el contenido de la página.", "Hoy suele estar oculto por privacidad, así que rara vez está disponible."], "answer": 0, "refClass": 3, "ref": "WHOIS: la consulta pública"}, {"q": "¿Cuál de estos ejemplos pertenece a la Deep Web?", "options": ["La página de noticias de un periódico nacional", "Un foro anónimo de venta de credenciales robadas", "La banca en línea de un cliente autenticado", "El blog corporativo indexado por los buscadores"], "rationales": ["Está indexada en buscadores, así que es Surface Web.", "Ese tipo de espacio corresponde a la Dark Web.", "Requiere usuario y contraseña, no aparece en buscadores y no tiene nada de ilegal.", "Cualquiera lo encuentra en un buscador: es Surface Web."], "answer": 2, "refClass": 3, "ref": "El edificio"}, {"q": "Hace tres años, un equipo creó un subdominio de pruebas para un proyecto que se canceló. Sigue encendido y sin actualizar. ¿Cómo se clasifica?", "options": ["Un activo olvidado que amplía la superficie de ataque", "Un falso positivo que no requiere acción", "Parte de la Deep Web, por no estar en uso", "Un riesgo aceptado, porque el proyecto fue cancelado"], "rationales": ["Nadie se acordó de que existía, pero sigue visible desde afuera y puede usarse como puerta de entrada.", "Es un riesgo real y de los más comunes.", "Sigue publicado y visible desde Internet; el desuso no lo oculta.", "Nadie lo aceptó de forma explícita; simplemente quedó olvidado."], "answer": 0, "refClass": 3, "ref": "El caso más común"}, {"q": "¿Por qué un inventario de la superficie de ataque externa hecho una vez al año resulta insuficiente?", "options": ["Porque los registros DNS se borran automáticamente cada año", "Porque la superficie cambia todos los días", "Porque WHOIS solo conserva los datos durante doce meses", "Porque las normas exigen revisarlo cada trimestre"], "rationales": ["Los registros DNS no se borran por sí solos; el problema es que la exposición cambia.", "Cada campaña, proveedor o servicio en la nube la modifica; el inventario debe ser continuo.", "No es una limitación de WHOIS; la superficie de ataque cambia constantemente.", "La clase no lo atribuye a una norma, sino a que la superficie cambia continuamente."], "answer": 1, "refClass": 3, "ref": "Para quien ya lleva años en esto"}], "words": 1710}], "quiz": [{"q": "Un atacante registra \"bancoexample-seguro.com\" y envía enlaces a los clientes del banco. Técnicamente, ¿qué aprovecha?", "options": ["Una falla en los servidores DNS del banco", "Que el DNS resuelve cualquier nombre registrado", "Que WHOIS no publica la fecha de creación", "Que el hosting del banco es compartido con el atacante"], "ref": "Por qué esto importa en seguridad", "refClass": 3}, {"q": "Un sitio fraudulento usa un dominio comprado en un registrador y está alojado en otro proveedor. ¿Para qué sirve identificar a cada uno?", "options": ["Para bloquear el dominio directamente desde el DNS propio", "Para identificar con certeza al autor de la estafa", "Para no tener que guardar evidencia del sitio", "Para dirigir el reclamo al responsable correcto sin perder días"], "ref": "Por qué importa saber quién es quién", "refClass": 3}, {"q": "¿Cuál de estas afirmaciones sobre la Dark Web es correcta?", "options": ["Tiene usos legítimos, aunque también circulan datos robados", "Una empresa debe vigilarla entrando a curiosear", "Todo su contenido es ilegal y debe bloquearse", "Es más grande que la Surface Web y la Deep Web juntas"], "ref": "Qué es realmente la Dark Web", "refClass": 3}, {"q": "¿Cuál de estos elementos NO forma parte de la superficie de ataque externa de una organización?", "options": ["Los correos publicados de los empleados", "Los perfiles corporativos en redes sociales", "Un servidor interno sin conexión a Internet", "Un documento publicado por error en la web"], "ref": "Superficie de ataque", "refClass": 3}, {"q": "Al revisar la configuración DNS de una empresa, ¿qué puede deducir un analista?", "options": ["Las contraseñas de los servicios que tiene publicados", "El contenido de los correos que recibe la empresa", "Qué proveedores usa y qué servicios tiene publicados", "Qué empleados tienen acceso administrativo a cada servidor"], "ref": "Para quien ya lleva años en esto", "refClass": 3}, {"q": "Al monitorear fuentes de la Dark Web aparece una supuesta filtración de tu empresa. ¿Cuál es el siguiente paso adecuado?", "options": ["Publicar un comunicado para los clientes de inmediato", "Ingresar al foro para negociar con el vendedor", "Ignorarla, porque casi todo lo publicado es falso", "Validar si es real antes de actuar"], "ref": "Para quien ya lleva años en esto", "refClass": 3}]}, {"id": 3, "name": "Ingeniería social y phishing", "objective": "Que la persona entienda por qué el engaño funciona, reconozca las señales de un mensaje o sitio sospechoso, sepa qué hacer ante una situación dudosa y comprenda a nivel conceptual cómo se retira un sitio que suplanta a una marca.", "welcome": ["Este módulo es probablemente el más útil para tu vida diaria. Vamos a hablar de cómo se engaña a las personas en Internet, por qué funciona incluso con gente muy preparada, cómo reconocer un mensaje o una página sospechosa, qué hacer si caíste y cómo se retira una página que suplanta a una empresa."], "classes": [{"id": 4, "title": "Por qué funciona el engaño", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["Te voy a contar algo que quizá te sorprenda: en muchos incidentes de seguridad, nadie rompe ninguna tecnología. No hay un genio burlando sistemas. Hay alguien convenciendo a una persona de que haga algo. A eso se le llama ingeniería social, el tema de hoy."], "slug": "apertura"}, {"heading": "Engañar a la persona, no a la máquina", "kind": "normal", "paras": ["La ingeniería social es manipular a alguien para que entregue información, dé un acceso o haga una acción que lo perjudica. Funciona porque no ataca la tecnología, ataca algo mucho más difícil de actualizar: cómo funcionamos los seres humanos."], "slug": "enganar-a-la-persona-no-a-la-maquina"}, {"heading": "Los botones que se presionan", "kind": "normal", "paras": ["Hay unas emociones que se usan una y otra vez. La urgencia: \"tienes una hora para responder o se bloquea tu cuenta\". El miedo: \"detectamos un movimiento sospechoso en tu tarjeta\". La autoridad: \"soy el gerente y necesito esto ya\". La curiosidad: \"mira las fotos de la fiesta\". El beneficio: \"ganaste un premio, solo confirma tus datos\".", "Fíjate que todas buscan lo mismo: que actúes rápido, sin pensar. Porque si te detienes diez segundos a pensar, el engaño casi siempre se cae."], "slug": "los-botones-que-se-presionan"}, {"heading": "Le puede pasar a cualquiera", "kind": "normal", "paras": ["Esto es importante: caer en un engaño no es cuestión de inteligencia ni de estudios. Le pasa a ingenieros, a gerentes y a gente que trabaja en seguridad. Todos tenemos días cansados, momentos de afán y situaciones en las que el mensaje llega justo cuando estábamos esperando algo parecido. Por eso no se trata de sentirse más listo que el atacante, sino de tener un hábito."], "slug": "le-puede-pasar-a-cualquiera"}, {"heading": "La regla de oro", "kind": "normal", "paras": ["El hábito es este: frena, verifica por otro canal y después actúa. Si te escribe \"tu jefe\" pidiendo algo raro, lo llamas a su número de siempre. Si te escribe \"tu banco\", entras a la aplicación oficial, no al enlace. Si te llama \"soporte técnico\", cuelgas y llamas tú al número oficial.", "Verificar por otro canal, uno que tú ya conoces, desarma la gran mayoría de estos engaños."], "slug": "la-regla-de-oro"}, {"heading": "Qué es el phishing", "kind": "normal", "paras": ["Ahora que entiendes la ingeniería social, vamos a ver su forma más común en Internet: el phishing. La palabra viene de \"fishing\", pescar en inglés; la idea es exactamente esa: lanzar un anzuelo y esperar a que alguien pique.", "El phishing es un mensaje que se hace pasar por alguien de confianza, tu banco, una tienda, una entidad del gobierno o tu propia empresa, para que entregues datos o hagas clic en algo. El objetivo casi siempre es entrar a tus cuentas o a tu plata."], "slug": "que-es-el-phishing"}, {"heading": "Los canales", "kind": "normal", "paras": ["Empezó por correo, pero hoy llega por todos lados, cada canal con tiene su nombre. Por correo, phishing a secas. Por mensaje de texto se le dice smishing. Por llamada telefónica se le dice vishing. También llega por redes sociales y aplicaciones de mensajería.", "Un ejemplo de smishing que seguro has visto: \"Tu paquete está retenido, paga el envío en este enlace\". Un ejemplo de vishing: alguien llama diciendo que es del banco, te habla con mucha propiedad y al final te pide \"confirmar\" un código que te acaba de llegar por mensaje."], "slug": "los-canales"}, {"heading": "Qué te piden", "kind": "normal", "paras": ["Fíjate en lo que piden, porque es una gran pista. Contraseñas, códigos de verificación, números de tarjeta, datos personales o que instales algo. Aquí va una regla que te puede salvar: ninguna entidad seria te va a pedir por teléfono o por mensaje un código que te llegó para verificar tu identidad. Ese código es tuyo y de nadie más."], "slug": "que-te-piden"}, {"heading": "Masivo o dirigido", "kind": "normal", "paras": ["Hay phishing masivo, el mismo mensaje enviado a miles de personas esperando que alguna caiga. También hay phishing dirigido, preparado para una persona o un área específica, usando datos reales: su nombre, su cargo, un proyecto en el que trabaja. Este segundo es más difícil de detectar, porque se siente personal. Cuando apunta a directivos, a veces se le llama whaling, como pescar ballenas en lugar de peces."], "slug": "masivo-o-dirigido"}, {"heading": "Para quien ya lleva años en esto", "kind": "expert", "paras": ["Si eres técnico, sabes que los controles técnicos reducen mucho la exposición, pero nunca la llevan a cero, porque la ingeniería social se adapta más rápido que cualquier filtro. Por eso los programas de concientización que funcionan no son una charla al año: son continuos, se pueden medir, pero sobre todo crean una cultura donde reportar algo sospechoso es fácil y nunca se castiga, aunque la persona haya caído.", "En el caso del correo, seguro conoces SPF, DKIM y DMARC, los controles de autenticación que ayudan a evitar que alguien envíe correos haciéndose pasar por tu dominio exacto. Son fundamentales, pero no cubren los dominios parecidos ni los otros canales. Por eso la defensa contra el phishing siempre combina controles técnicos, vigilancia externa y personas entrenadas."], "slug": "para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["La ingeniería social engaña a la persona, no a la máquina. Juega con la urgencia, el miedo, la autoridad, la curiosidad o la promesa de un beneficio, así que le puede pasar a cualquiera. La mejor defensa es un hábito: frenar, verificar por otro canal, solo entonces actuar.", "El phishing es su forma más común: un mensaje que se hace pasar por alguien de confianza para quitarte datos o acceso. Llega por correo, SMS, llamadas o redes, casi siempre buscando contraseñas, códigos o datos personales. Ojo con esto: nadie legítimo te va a pedir el código de verificación que te llegó.", "En la siguiente clase vamos a lo práctico: cómo reconocer un mensaje o un sitio sospechoso, qué hacer si ya caíste, hasta cómo se retira una página que suplanta a una marca. Antes, unas preguntas rápidas para comprobar que quedó claro."], "slug": "lo-que-debes-llevarte"}], "check": [{"q": "Recibes un mensaje: \"Su cuenta será bloqueada en 60 minutos si no confirma sus datos\". ¿Qué palanca psicológica usa principalmente?", "options": ["Curiosidad", "Autoridad", "Beneficio", "Urgencia"], "rationales": ["La curiosidad usaría algo llamativo, como \"mira las fotos de la fiesta\".", "La autoridad se apoya en un cargo, como \"soy el gerente\"; aquí no hay nadie que la invoque.", "El beneficio ofrece una ganancia, como un premio; aquí se amenaza con una pérdida.", "Fija un plazo corto para que actúes rápido y sin pensar."], "answer": 3, "refClass": 4, "ref": "Los botones que se presionan"}, {"q": "Un correo que aparenta venir del presidente de la compañía pide a tesorería una transferencia urgente y confidencial. ¿Qué debe hacer quien lo recibe?", "options": ["Hacer la transferencia y reportarla después a seguridad", "Confirmar la solicitud llamando al número que ya conoce", "Responder el correo pidiendo una confirmación por escrito", "Reenviar el correo a un compañero para pedir su opinión"], "rationales": ["Primero se frena y se verifica; actuar antes es justo lo que busca el engaño.", "Verificar por otro canal conocido desarma la mayoría de estos engaños.", "Responder por el mismo canal no verifica nada: quien conteste será el atacante.", "Una segunda opinión no verifica la autenticidad del mensaje."], "answer": 1, "refClass": 4, "ref": "La regla de oro"}, {"q": "Alguien llama, dice ser de soporte técnico y pide el código que te acaba de llegar por SMS para \"terminar una actualización\". ¿Cómo se llama esta modalidad y qué haces?", "options": ["Whaling; entregas el código porque viene de soporte", "Smishing; dictas el código solo si suena convincente", "Vishing; cuelgas y llamas tú a la línea oficial", "Phishing; pides que te envíe la solicitud por correo"], "rationales": ["El whaling apunta a directivos. Además, el código es tuyo y de nadie más.", "El smishing llega por mensaje de texto, y el código no se entrega nunca.", "Es un engaño por llamada. Ninguna entidad seria te pide un código de verificación.", "Llegó por llamada, y cambiar de canal a uno que controla el atacante no verifica nada."], "answer": 2, "refClass": 4, "ref": "Los canales"}, {"q": "¿Qué diferencia al phishing dirigido del phishing masivo?", "options": ["Solo busca instalar malware, no robar credenciales", "Siempre llega por mensaje de texto y no por correo", "Se prepara con datos reales de la víctima", "Se envía a miles de personas con el mismo texto"], "rationales": ["Ambos pueden buscar credenciales, datos o la instalación de algo.", "El canal no define si es masivo o dirigido.", "Usa su nombre, cargo o proyectos, así que se siente personal y es más difícil de detectar.", "Esa es justamente la característica del phishing masivo."], "answer": 2, "refClass": 4, "ref": "Masivo o dirigido"}, {"q": "¿Por qué caer en un engaño de ingeniería social no depende del nivel de conocimiento técnico?", "options": ["Porque los filtros de correo detienen los engaños simples", "Porque solo afecta a quienes no reciben capacitación", "Porque ataca a la persona, no a la tecnología", "Porque los atacantes siempre usan herramientas avanzadas"], "rationales": ["Los filtros ayudan, pero no explican por qué personas técnicas también caen.", "Le pasa a cualquiera, incluso a quienes trabajan en seguridad.", "Se aprovecha de cómo funcionamos los humanos: el cansancio, el afán o un mensaje que llega en el momento justo.", "Muchos de estos engaños no requieren ninguna herramienta sofisticada."], "answer": 2, "refClass": 4, "ref": "Le puede pasar a cualquiera"}, {"q": "Una empresa configuró correctamente SPF, DKIM y DMARC. ¿Qué riesgo de phishing sigue sin cubrir?", "options": ["La entrega de correos legítimos a los clientes", "La autenticación de los usuarios al iniciar sesión", "Los dominios parecidos y otros canales", "Los correos que suplantan su dominio exacto"], "rationales": ["No es un riesgo de phishing, sino de entregabilidad del correo.", "Eso corresponde a contraseñas y verificación en dos pasos, no a estos controles.", "Estos controles evitan suplantar el dominio exacto, pero no cubren dominios parecidos, SMS, llamadas ni redes.", "Ese es justamente el riesgo que cubren SPF, DKIM y DMARC."], "answer": 2, "refClass": 4, "ref": "Para quien ya lleva años en esto"}], "words": 875}, {"id": 5, "title": "Del mensaje sospechoso al sitio retirado", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["Ya sabes qué es el phishing. Hoy vamos a lo práctico: cómo lo reconoces y qué haces, incluso si ya caíste. Esta es probablemente la clase que más vas a usar fuera del curso."], "slug": "apertura"}, {"heading": "Las señales", "kind": "normal", "paras": ["Hay cinco señales clásicas. Primera, la urgencia: todo es para ya. Segunda, el remitente: el nombre dice una cosa, pero la dirección real dice otra. Tercera, el enlace: si pones el cursor encima sin hacer clic, ves a dónde lleva realmente; muchas veces no es a donde dice. Cuarta, los errores: faltas de ortografía, logos raros o un tono que no es el habitual. Quinta, lo inesperado: un adjunto que no pediste o un premio de un concurso en el que no participaste.", "No tienen que estar las cinco. Con una que veas, ya vale la pena frenar."], "slug": "las-senales"}, {"heading": "El truco del nombre parecido", "kind": "normal", "paras": ["Ahora, uno de los engaños más efectivos es el del nombre parecido. ¿Te acuerdas del DNS? Si alguien registra un dominio casi igual al de tu banco, con una letra cambiada o con otra terminación, la página va a cargar perfecto y se va a ver idéntica. A esto se le dice suplantación por dominio parecido; en el mundo técnico tiene nombres como typosquatting.", "¿Cómo lo detectas? Leyendo el nombre con calma, letra por letra, sobre todo antes de escribir una contraseña. Mejor aún: entrando siempre desde la aplicación oficial o escribiendo tú mismo la dirección, no desde un enlace que te mandaron."], "slug": "el-truco-del-nombre-parecido"}, {"heading": "Qué hacer si te llega algo raro", "kind": "normal", "paras": ["Tres cosas. No hagas clic ni respondas. Verifica por un canal oficial que tú conozcas. Después, repórtalo: a tu área de seguridad si es del trabajo, o a la entidad que están suplantando si es personal. Reportar ayuda a que otros no caigan."], "slug": "que-hacer-si-te-llega-algo-raro"}, {"heading": "Qué hacer si ya caíste", "kind": "normal", "paras": ["Esto es igual de importante: si ya hiciste clic o ya entregaste datos, no te quedes callado por vergüenza. Lo primero es avisar, de inmediato. Después, cambia la contraseña de esa cuenta y de cualquier otra donde uses la misma. Activa la verificación en dos pasos. Si entregaste datos bancarios, llama al banco por su línea oficial.", "La velocidad lo es todo. Un aviso a los diez minutos se puede contener; uno a las dos semanas, casi nunca."], "slug": "que-hacer-si-ya-caiste"}, {"heading": "Suplantación de marca", "kind": "normal", "paras": ["Hasta ahora hablamos del phishing desde el lado de la persona que recibe el mensaje. Ahora lo vamos a ver desde el lado de la empresa cuyo nombre están usando. Porque cuando alguien monta una página falsa de tu banco, la víctima no es solo el cliente; también es el banco.", "Suplantar una marca es usar el nombre, el logo o la imagen de una organización para engañar a sus clientes, sus empleados o sus proveedores. Puede ser una página web casi idéntica, un perfil falso en redes que \"atiende\" quejas, una aplicación falsa en una tienda o mensajes enviados a nombre de la empresa.", "Aunque la empresa no hizo nada malo, el daño le cae encima: clientes estafados, quejas, pérdida de confianza y, a veces, problemas con los reguladores."], "slug": "suplantacion-de-marca"}, {"heading": "Qué es un takedown", "kind": "normal", "paras": ["Cuando una organización encuentra una de estas páginas o perfiles, lo que busca es que la retiren. A esa solicitud formal se le dice takedown, que en inglés significa algo así como \"bajar\" o \"tumbar\".", "¿Y a quién se le pide? Aquí vuelve lo que vimos sobre los dueños de cada pieza. Si es una página web, se le pide al registrador, que controla el nombre, y al proveedor de hosting, que presta el servidor. Si es un perfil o una aplicación, se le pide a la red social o a la tienda, cada una por su propio canal de reporte."], "slug": "que-es-un-takedown"}, {"heading": "Primero la evidencia", "kind": "normal", "paras": ["Antes de pedir el retiro hay un paso que no se puede saltar: guardar la evidencia. Una captura de cómo se ve la página, su dirección exacta, la fecha, los datos de registro. ¿Por qué? Porque estas páginas cambian o desaparecen rápido; si no tienes cómo demostrar lo que viste, el proveedor no tiene cómo verificar tu reclamo. Además, esa evidencia te sirve si después hay que ir ante una autoridad."], "slug": "primero-la-evidencia"}, {"heading": "Lo que no depende de ti", "kind": "normal", "paras": ["Una aclaración honesta: quien reporta controla qué tan rápido y qué tan bien reporta, pero la decisión final y el tiempo en que se ejecuta el retiro dependen del proveedor o de la plataforma. Algunos responden en horas; otros tardan más. Por eso, mientras tanto, también se avisa a los clientes por los canales oficiales para que no caigan."], "slug": "lo-que-no-depende-de-ti"}, {"heading": "Para quien ya lleva años en esto", "kind": "expert", "paras": ["Si eres técnico, sabes que el tiempo entre que alguien cae y el momento en que el equipo de seguridad se entera es una de las métricas que más reduce el impacto. Las organizaciones que mejor responden no son las que tienen menos clics, sino las que tienen más reportes, más rápidos. Por eso conviene medir y premiar el reporte, no solo castigar el error.", "Con los takedowns pasa algo parecido: el trabajo no termina con la baja. Hay que seguir vigilando, porque es común que la misma campaña reaparezca con otro dominio parecido. Lo que marca la diferencia es tener un proceso: detección continua, evidencia estandarizada, plantillas por tipo de proveedor, seguimiento de estados, registro de cuánto tarda cada uno en responder."], "slug": "para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["Las señales de alerta son la urgencia, un remitente raro, un enlace que no coincide, errores, cualquier cosa inesperada. El nombre parecido es de los engaños más efectivos; se detecta leyendo con calma. Si te llega algo raro: no hagas clic, verifica, reporta. Si ya caíste, avisa de inmediato, porque la rapidez es lo que más reduce el daño.", "Desde el lado de la empresa, suplantar una marca es usar su identidad para engañar; el daño le cae a la organización aunque no haya hecho nada. El takedown es la solicitud para retirar ese contenido, dirigida a quien controla cada pieza. La evidencia se guarda antes de reportar. Como el plazo final depende del proveedor, también hay que avisarles a los clientes.", "Con esto cerramos el módulo 3. Vamos al cuestionario final."], "slug": "lo-que-debes-llevarte"}], "check": [{"q": "Pasas el cursor sobre el enlace \"portal.tubanco.com\" de un correo y el navegador muestra \"tubanco-verifica.net/login\". ¿Qué señal de alerta identificas?", "options": ["El mensaje tiene errores de ortografía", "El correo incluye un adjunto inesperado", "El enlace no lleva a donde dice", "El remitente usa un nombre falso"], "rationales": ["No se menciona ningún error; la señal está en el destino del enlace.", "No hay adjunto en el escenario; la señal es el enlace.", "El texto visible y el destino real no coinciden: es una de las cinco señales clásicas.", "El enunciado no muestra el remitente; la discrepancia está en el enlace."], "answer": 2, "refClass": 5, "ref": "Las señales"}, {"q": "¿Cuántas de las cinco señales de alerta deben estar presentes para frenar antes de actuar?", "options": ["Todas, para evitar falsas alarmas", "Dos, siempre que una sea la urgencia", "Basta con una sola señal", "Al menos tres de las cinco"], "rationales": ["Un engaño bien hecho rara vez muestra todas las señales.", "No hay una combinación mínima: cualquier señal justifica frenar.", "No tienen que estar las cinco: con una que veas, ya vale la pena frenar.", "Esperar varias señales aumenta el riesgo; una sola es suficiente."], "answer": 2, "refClass": 5, "ref": "Las señales"}, {"q": "Un colaborador ingresó su contraseña en una página falsa hace diez minutos y siente vergüenza de contarlo. ¿Qué es lo primero que debe hacer?", "options": ["Borrar el correo para eliminar el riesgo", "Avisar de inmediato al área de seguridad", "Esperar a ver si aparece actividad extraña", "Cambiar solo la contraseña de esa cuenta"], "rationales": ["Borrar el mensaje no deshace la entrega de la contraseña.", "La velocidad lo es todo: un aviso a los diez minutos se puede contener.", "Esperar reduce la posibilidad de contener el daño.", "Es necesario, pero primero se avisa, y también se cambian las cuentas que comparten la clave."], "answer": 1, "refClass": 5, "ref": "Qué hacer si ya caíste"}, {"q": "Detectas el dominio \"micorreo-empresa.co\", que imita tu dominio corporativo cambiando un detalle. ¿Cómo se denomina esta técnica?", "options": ["Doble extorsión", "Vishing", "Typosquatting", "Whaling"], "rationales": ["Es una táctica de ransomware: cifrar y amenazar con publicar.", "Es el engaño por llamada telefónica.", "Es la suplantación mediante un dominio casi igual al legítimo.", "Es el phishing dirigido a directivos, no el registro de dominios parecidos."], "answer": 2, "refClass": 5, "ref": "El truco del nombre parecido"}, {"q": "Tu equipo encontró una página que suplanta la marca de la empresa. ¿Qué debe hacerse antes de solicitar el takedown?", "options": ["Avisar al atacante que se iniciará una acción legal", "Preservar la evidencia del sitio", "Bloquear el dominio en el firewall y cerrar el caso", "Esperar unos días para confirmar que sigue activa"], "rationales": ["Alertarlo solo facilita que mueva el sitio o borre rastros.", "Captura, dirección exacta, fecha y datos de registro: estas páginas cambian o desaparecen rápido.", "Protege a los usuarios internos, pero no retira el sitio para los clientes.",
