"Esperar extiende el daño y la página puede desaparecer sin dejar evidencia."], "answer": 1, "refClass": 5, "ref": "Primero la evidencia"}, {"q": "Se solicitó el retiro de una página falsa y el proveedor aún no responde. ¿Qué acción complementaria recomienda la clase?", "options": ["Registrar dominios similares para bloquear al atacante", "Avisar a los clientes por los canales oficiales", "Enviar el mismo reporte a todos los proveedores posibles", "Dar el caso por cerrado una vez enviado el reporte"], "rationales": ["No afecta el sitio que ya está activo engañando clientes.", "El tiempo de retiro depende del proveedor; mientras tanto, se previene a los clientes.", "Reportar a quien no corresponde hace perder tiempo; el reclamo se dirige a quien controla cada pieza.", "El caso sigue abierto hasta que el contenido se retire y se verifique."], "answer": 1, "refClass": 5, "ref": "Lo que no depende de ti"}], "words": 972}], "quiz": [{"q": "Un empleado recibe por WhatsApp: \"Soy el gerente, estoy en una reunión, compra cinco tarjetas de regalo y envíame los códigos\". ¿Qué combinación de palancas usa?", "options": ["Miedo y curiosidad", "Autoridad y urgencia", "Curiosidad y beneficio", "Beneficio y autoridad"], "ref": "Los botones que se presionan", "refClass": 4}, {"q": "Un cliente recibe un SMS: \"Tu paquete está retenido; paga el envío en este enlace\". ¿Qué tipo de ataque es?", "options": ["Vishing", "Whaling", "Smishing", "Typosquatting"], "ref": "Los canales", "refClass": 4}, {"q": "Una empresa quiere reducir el tiempo entre que alguien cae en un phishing y que seguridad se entera. ¿Qué práctica es más efectiva?", "options": ["Sancionar a quienes hagan clic en enlaces maliciosos", "Bloquear todos los correos que contengan enlaces externos", "Facilitar y reconocer el reporte, sin castigar el error", "Reducir la capacitación a una charla anual obligatoria"], "ref": "Para quien ya lleva años en esto", "refClass": 5}, {"q": "Para retirar un perfil falso que suplanta a la empresa en una red social, ¿a quién se dirige la solicitud?", "options": ["Al proveedor de hosting de la empresa", "A la entidad que emitió el certificado del sitio", "Al registrador del dominio de la empresa", "A la plataforma, por su canal de reporte"], "ref": "Qué es un takedown", "refClass": 5}, {"q": "Tras un takedown exitoso, ¿por qué el trabajo no termina?", "options": ["El proveedor puede revertir el retiro sin aviso", "El dominio retirado pasa a ser propiedad de la empresa", "La misma campaña suele reaparecer con otro dominio", "La evidencia debe borrarse después del retiro"], "ref": "Para quien ya lleva años en esto", "refClass": 5}, {"q": "Una página que imita tu marca estafó a varios clientes, aunque tu empresa no fue vulnerada. ¿Qué afirmación es correcta?", "options": ["El problema es solo de los clientes que cayeron", "La empresa también sufre el daño reputacional", "La empresa no tiene ningún impacto ni responsabilidad", "Es una brecha de datos de la empresa y debe notificarse"], "ref": "Suplantación de marca", "refClass": 5}]}, {"id": 4, "name": "Malware: ransomware e infostealers", "objective": "Que la persona entienda qué es el malware, qué efecto tienen el ransomware y los infostealers sobre una organización y qué hace que una organización se recupere o no.", "welcome": ["En este módulo vamos a hablar de malware, que es la palabra técnica para los programas maliciosos. No vamos a ver cómo se construyen; vamos a ver qué hacen, por qué le importan a una organización y, sobre todo, cómo se protege uno y cómo se recupera si algo pasa. Nos vamos a enfocar en dos tipos que hoy son protagonistas: el ransomware y los infostealers."], "classes": [{"id": 6, "title": "Malware, del contagio a la recuperación", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["Malware es una palabra que se escucha mucho; la mayoría de la gente la usa como sinónimo de \"virus\". Pero el virus es solo un tipo. Hoy vamos a entender qué es el malware en general y cómo suele llegar a un equipo."], "slug": "apertura"}, {"heading": "Qué es el malware", "kind": "normal", "paras": ["Malware viene de \"malicious software\", software malicioso. Es cualquier programa hecho para causar daño o para obtener acceso o información sin permiso. Igual que en medicina hay muchas enfermedades distintas, en el malware hay muchas familias, cada una con un propósito diferente.", "Algunas de las más conocidas: el ransomware, que bloquea tus archivos para pedirte plata. El infostealer, que se roba en silencio lo que tienes guardado. El troyano, que se disfraza de un programa normal para que tú mismo lo instales. Está también el spyware, que espía lo que haces. No necesitas memorizarlas todas; lo importante es entender que no todo malware hace lo mismo."], "slug": "que-es-el-malware"}, {"heading": "Cómo llega", "kind": "normal", "paras": ["Aquí está lo más importante de la clase: en la mayoría de los casos, el malware no entra solo. Alguien le abre la puerta sin darse cuenta. Las vías más comunes son tres.", "La primera, un engaño: el correo o mensaje del módulo anterior, con un archivo o un enlace. La segunda, una descarga de una fuente no oficial: el programa \"gratis\" que normalmente cuesta, la extensión rara del navegador o la aplicación que no viene de la tienda oficial. La tercera, software desactualizado, que tiene fallas conocidas que ya fueron corregidas pero que tú no has instalado."], "slug": "como-llega"}, {"heading": "Un equipo, toda una empresa", "kind": "normal", "paras": ["¿Por qué esto le importa tanto a una empresa? Porque un solo equipo infectado puede ser la puerta para todo lo demás. Desde ese equipo se puede llegar a otros, a las cuentas del usuario o a la información compartida. Esto se complica cuando la gente usa el mismo computador para cosas personales y de trabajo, porque lo que entra por un lado afecta al otro."], "slug": "un-equipo-toda-una-empresa"}, {"heading": "Qué es el ransomware", "kind": "normal", "paras": ["Imagínate que llegas a tu oficina un lunes y alguien cambió la cerradura. En la puerta hay una nota: \"Si quieres la llave nueva, deposita tal cantidad en esta cuenta. Y si no pagas, vamos a publicar lo que hay adentro\". Eso, en el mundo digital, es el ransomware.", "El ransomware es un tipo de malware que bloquea o cifra los archivos y sistemas de una organización y exige un pago, un rescate, para devolver el acceso. Cifrar quiere decir convertir la información en algo ilegible sin la llave correcta. Los archivos siguen ahí, pero no los puedes abrir.", "En los últimos años se volvió común una segunda amenaza: antes de bloquear, se copian la información y amenazan con publicarla si no pagas. A eso se le dice doble extorsión."], "slug": "que-es-el-ransomware"}, {"heading": "Qué pilares rompe", "kind": "normal", "paras": ["Vuelve a la tríada. Al bloquear todo, rompe la disponibilidad: la empresa no puede operar. Si se llevaron copia de la información, rompe también la confidencialidad. Por eso el ransomware es tan dañino: golpea dos pilares a la vez."], "slug": "que-pilares-rompe"}, {"heading": "El impacto real", "kind": "normal", "paras": ["El impacto no es solo técnico. Es un hospital que tiene que volver al papel. Es una empresa que no puede facturar durante días. Son clientes cuyos datos quedan expuestos, costos de recuperación, posibles sanciones y una reputación que tarda años en recuperarse."], "slug": "el-impacto-real"}, {"heading": "Lo que hace la diferencia", "kind": "normal", "paras": ["Aquí va la idea más importante: lo que más cambia el resultado de un ataque de ransomware no es lo que haces el día que pasa, sino lo que hiciste antes. Una organización con copias de seguridad aisladas, que no se pueden tocar desde la red principal, que además ha probado que esas copias sí se pueden restaurar, puede recuperarse sin depender de la voluntad de quien la atacó. Una que no las tiene queda en una posición muy difícil.", "Pagar, además, no garantiza nada: no garantiza que te devuelvan todo ni que no publiquen la información, pero sí alimenta el negocio."], "slug": "lo-que-hace-la-diferencia"}, {"heading": "Qué es un infostealer", "kind": "normal", "paras": ["El ransomware hace ruido: te bloquea todo y te deja una nota. Ahora vamos a hablar de su primo silencioso, que muchas veces llega antes y del que casi nadie se entera: el infostealer.", "Infostealer significa ladrón de información. Es un malware que, una vez está en un equipo, recopila lo que encuentra guardado: los usuarios y contraseñas que el navegador recuerda, las sesiones abiertas, datos de autocompletado y otra información útil para entrar a cuentas ajenas.", "Todo en silencio. No bloquea nada, no muestra mensajes, no pone el equipo lento de forma evidente. La persona sigue trabajando normal, sin saber que sus accesos ya salieron."], "slug": "que-es-un-infostealer"}, {"heading": "Los stealer logs", "kind": "normal", "paras": ["Todo lo que el infostealer recopila se empaqueta en un registro; a ese registro se le dice stealer log. Esos registros después circulan, se venden o se publican en los espacios de los que hablamos en el módulo 2.", "Un solo stealer log puede tener las credenciales de la cuenta personal de alguien, pero también las de su correo de trabajo, la plataforma interna de la empresa o el panel administrativo de un sistema, porque muchas personas usan el mismo navegador para todo."], "slug": "los-stealer-logs"}, {"heading": "Por qué la sesión importa tanto", "kind": "normal", "paras": ["Aquí hay un detalle importante. Cuando entras a una página y no te vuelve a pedir la contraseña cada vez, es porque tu navegador guarda una sesión. Si alguien se roba esa sesión, en algunos casos puede entrar como si fueras tú, sin necesitar la contraseña. Por eso un stealer log reciente es tan delicado: no solo expone claves, puede exponer accesos que ya estaban abiertos."], "slug": "por-que-la-sesion-importa-tanto"}, {"heading": "Qué hace una organización cuando detecta uno", "kind": "normal", "paras": ["Si una organización se entera de que una credencial suya aparece en un stealer log, la respuesta es clara: cambiar esa contraseña, cerrar las sesiones activas de esa cuenta, revisar si hubo accesos raros y revisar o limpiar el equipo desde el que se robó, porque si no, el problema se repite. Y, por supuesto, dejar registro de lo que se hizo."], "slug": "que-hace-una-organizacion-cuando-detecta-uno"}, {"heading": "Prevenir", "kind": "normal", "paras": ["Hasta aquí hemos hablado de lo que puede salir mal. Ahora hablemos de lo que sí puedes hacer. La buena noticia es que la mayoría de las medidas no son complicadas.", "Lo primero es cerrar las puertas más comunes. Actualizar el sistema y los programas cuando te lo piden, porque esas actualizaciones muchas veces corrigen fallas que ya se conocen. Instalar software solo de fuentes oficiales. También, desconfiar de los archivos y enlaces inesperados, que es lo que vimos en el módulo de phishing.", "En una empresa, a eso se suma tener protección en los equipos que detecte comportamientos raros, además de controlar qué se puede instalar."], "slug": "prevenir"}, {"heading": "Detectar", "kind": "normal", "paras": ["A veces, a pesar de todo, algo entra. Por eso hay que estar atentos a señales: un equipo que se comporta raro, programas que no instalaste, alertas del antivirus que alguien ignoró o inicios de sesión desde lugares extraños."], "slug": "detectar"}, {"heading": "Contener", "kind": "normal", "paras": ["Si sospechas que un equipo está infectado, lo correcto es aislarlo: desconectarlo de la red, sin apagarlo necesariamente, para luego avisar de inmediato al área responsable. La idea es que el problema no se pase a otros equipos. Lo que no se debe hacer es seguir trabajando como si nada o intentar arreglarlo por tu cuenta."], "slug": "contener"}, {"heading": "Recuperar", "kind": "normal", "paras": ["Por último, recuperarse. Aquí vuelven las copias de seguridad, pero con dos condiciones: que estén aisladas, para que lo que afecte a la red principal no las alcance; la otra, que estén probadas. Una copia que nunca has intentado restaurar es una apuesta, no una garantía."], "slug": "recuperar"}, {"heading": "El ensayo", "kind": "normal", "paras": ["Las organizaciones mejor preparadas hacen algo muy simple: ensayan. Igual que un simulacro de evacuación, practican qué pasaría si mañana sus sistemas quedaran bloqueados: quién decide, quién restaura, cuánto tardan. Así, cuando pasa de verdad, no improvisan; ejecutan algo que ya conocen y saben cuánto tiempo les va a tomar volver a operar."], "slug": "el-ensayo"}, {"heading": "Para quien ya lleva años en esto", "kind": "expert", "paras": ["Si eres técnico, sabes que hoy mucho malware se ofrece como servicio: alguien lo desarrolla, otros lo alquilan, lo que baja muchísimo la barrera de entrada. Eso explica que el volumen crezca tanto. También explica por qué las defensas basadas solo en firmas conocidas se quedan cortas, así que se complementan con protección que analiza comportamiento en los equipos, además de control sobre qué software se puede instalar.", "El ransomware, por su parte, suele ser el último paso de una cadena: antes hubo un acceso inicial, muchas veces con credenciales robadas, después un tiempo moviéndose dentro de la red. Por eso las defensas con más impacto están antes del cifrado: proteger las credenciales, segmentar la red, limitar privilegios, detectar ese movimiento a tiempo.", "Los stealer logs se volvieron una de las fuentes más importantes de acceso inicial. Muchas veces el equipo infectado es personal o de un contratista, fuera del alcance de los controles corporativos, así que vigilar la aparición de credenciales corporativas en esos registros es de las pocas formas de enterarse de un compromiso que pasó completamente fuera de tu red.", "Por último, de los ensayos salen dos métricas que realmente definen la estrategia de respaldo: cuánto tiempo puede estar caído un sistema y cuánta información se puede perder. Ojo, la recuperación también tiene que incluir la identidad: restaurar los sistemas sin limpiar las credenciales comprometidas es invitar a que vuelva a pasar."], "slug": "para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["El malware es cualquier software hecho para dañar o robar, con muchas familias de propósitos distintos. Casi siempre entra porque alguien le abre la puerta: un engaño, una descarga no oficial, un programa sin actualizar. Basta un solo equipo para comprometer a toda una organización.", "El ransomware bloquea tus datos para pedir un rescate, muchas veces con la amenaza de publicarlos, así que rompe la disponibilidad junto con la confidencialidad. Su impacto es operativo, económico, reputacional. Lo que más cambia el resultado es la preparación: copias aisladas y probadas, más un plan.", "El infostealer, en cambio, se roba en silencio lo que el equipo tiene guardado. El resultado es un stealer log que circula y se vende, donde una sesión robada puede valer tanto como una contraseña. Si aparece una credencial de tu organización, se cambia, se cierran sesiones, se revisan accesos, se limpia el equipo.", "Para protegerse: prevenir actualizando, instalando solo lo oficial, desconfiando de lo inesperado; detectar estando atento a lo raro; contener aislando el equipo para avisar de inmediato; recuperar con copias aisladas y probadas. Todo eso se ensaya antes, para no improvisar después.", "Con esto cerramos el módulo 4. Vamos al cuestionario final."], "slug": "lo-que-debes-llevarte"}], "check": [{"q": "¿Cuál de estas descripciones corresponde a un troyano?", "options": ["Recopila en silencio las credenciales del navegador", "Se hace pasar por un programa normal", "Cifra los archivos y exige un pago para liberarlos", "Registra lo que hace el usuario para espiarlo"], "rationales": ["Esa descripción corresponde al infostealer.", "Se disfraza de software legítimo para que el propio usuario lo instale.", "Esa descripción corresponde al ransomware.", "Esa descripción corresponde al spyware."], "answer": 1, "refClass": 6, "ref": "Qué es el malware"}, {"q": "Según la clase, ¿cómo suele entrar el malware a un equipo?", "options": ["Los servidores se infectan solos con el tiempo", "Rompe el firewall mediante fuerza bruta", "El antivirus lo deja pasar por una falla propia", "Alguien le abre la puerta sin darse cuenta"], "rationales": ["El malware no aparece por desgaste; necesita una vía de entrada.", "No es la vía más común; casi siempre alguien le facilita la entrada.", "Puede ocurrir, pero no es la vía más común que describe la clase.", "En la mayoría de los casos entra por un engaño, una descarga no oficial o software desactualizado."], "answer": 3, "refClass": 6, "ref": "Cómo llega"}, {"q": "Antes de cifrar los sistemas, los atacantes copian los datos y amenazan con publicarlos si no se paga. ¿Cómo se llama esta táctica?", "options": ["Phishing dirigido", "Malware como servicio", "Doble extorsión", "Infostealer"], "rationales": ["Es un engaño preparado para una persona, no una táctica de extorsión.", "Es un modelo de negocio criminal, no una forma de extorsión.", "Combina el bloqueo de los sistemas con la amenaza de publicar la información copiada.", "Es otro tipo de malware, que roba información en silencio sin pedir rescate."], "answer": 2, "refClass": 6, "ref": "Qué es el ransomware"}, {"q": "¿Qué característica de las copias de seguridad permite recuperarse de un ransomware sin depender del atacante?", "options": ["Que se hagan una vez al año con cifrado fuerte", "Que las administre el mismo equipo de soporte", "Que se guarden en la misma red para restaurar rápido", "Que estén aisladas y se haya probado restaurarlas"], "rationales": ["Una copia anual implica perder casi un año de información.", "Quién las administra no garantiza que estén aisladas ni probadas.", "Si están en la misma red, el ransomware también puede cifrarlas.", "Aisladas para que el ataque no las alcance; probadas para saber que sí funcionan."], "answer": 3, "refClass": 6, "ref": "Lo que hace la diferencia"}, {"q": "Un analista descubre que un equipo tiene un infostealer desde hace un mes. ¿Por qué el usuario no lo notó?", "options": ["Porque borra los archivos y después los restaura", "Porque actúa en silencio, sin bloquear ni alertar", "Porque desactiva el equipo durante la noche", "Porque solo se activa cuando el equipo está apagado"], "rationales": ["Ese comportamiento sería evidente; el infostealer copia, no borra.", "No muestra mensajes ni bloquea nada; la persona sigue trabajando normal.", "No es su forma de operar; su objetivo es pasar inadvertido.", "Un programa no puede ejecutarse con el equipo apagado."], "answer": 1, "refClass": 6, "ref": "Qué es un infostealer"}, {"q": "¿Por qué una sesión robada en un stealer log puede ser tan grave como una contraseña?", "options": ["Contiene en texto plano las contraseñas de todas las cuentas", "Obliga al servicio a desactivar la verificación en dos pasos", "Puede permitir entrar como el usuario sin pedir la contraseña", "Bloquea la cuenta del usuario hasta que pague un rescate"], "rationales": ["Una sesión no contiene contraseñas; su riesgo es que da acceso directo.", "No desactiva nada; simplemente puede evitar que se pida de nuevo.", "La sesión guardada en el navegador puede reutilizarse para acceder sin volver a autenticarse.", "Ese comportamiento corresponde al ransomware."], "answer": 2, "refClass": 6, "ref": "Por qué la sesión importa tanto"}, {"q": "Sospechas que tu equipo está infectado. ¿Cuál es la acción correcta de contención?", "options": ["Ejecutar varias herramientas de limpieza por tu cuenta", "Apagarlo y seguir trabajando en otro equipo sin avisar", "Desconectarlo de la red y avisar al área responsable", "Seguir trabajando y revisar si el problema empeora"], "rationales": ["Intentar arreglarlo solo puede empeorar el problema y borrar evidencia.", "Sin aviso no hay respuesta, y apagarlo puede destruir información útil.", "Aislarlo evita que el problema se pase a otros equipos; el aviso inmediato activa la respuesta.", "Mientras sigue conectado, el problema se puede extender a otros equipos."], "answer": 2, "refClass": 6, "ref": "Contener"}, {"q": "Tras un ransomware, la empresa restaura sus servidores, pero los atacantes vuelven a entrar a los pocos días. ¿Qué omitió probablemente la recuperación?", "options": ["Restaurar desde la copia más reciente", "Actualizar las firmas del antivirus", "Medir cuánto tiempo estuvo caído el sistema", "Limpiar las credenciales comprometidas"], "rationales": ["La antigüedad de la copia no explica que los atacantes vuelvan a entrar.", "Ayuda a detectar, pero no cierra el acceso con credenciales robadas.", "Es una métrica útil, pero no impide un nuevo acceso.", "Restaurar sin limpiar la identidad comprometida es invitar a que vuelva a pasar."], "answer": 3, "refClass": 6, "ref": "Para quien ya lleva años en esto"}], "words": 1677}], "quiz": [{"q": "Un hospital vuelve al papel porque sus sistemas fueron cifrados, y además se publicaron historias clínicas. ¿Qué pilares rompió el ataque?", "options": ["Disponibilidad y confidencialidad", "Solo la disponibilidad de los sistemas", "Confidencialidad e integridad", "Integridad y disponibilidad"], "ref": "Qué pilares rompe", "refClass": 6}, {"q": "¿Qué afirmación sobre pagar un rescate es correcta?", "options": ["Evita que los datos robados se publiquen", "Garantiza la devolución de los datos, aunque sea costoso", "No garantiza nada y financia a los atacantes", "Es la única opción aunque existan respaldos aislados"], "ref": "Lo que hace la diferencia", "refClass": 6}, {"q": "Una credencial corporativa aparece en un stealer log. ¿Qué secuencia de respuesta es la adecuada?", "options": ["Esperar a confirmar un acceso indebido antes de tomar cualquier medida", "Cambiar la contraseña, cerrar sesiones, revisar accesos y limpiar el equipo", "Cambiar la contraseña y cerrar el caso, porque el riesgo ya desapareció", "Formatear el equipo, pero conservar la contraseña para no afectar al usuario"], "ref": "Qué hace una organización cuando detecta uno", "refClass": 6}, {"q": "¿Por qué un infostealer en el computador personal de un contratista puede afectar a tu organización?", "options": ["No la afecta, porque el equipo no es de la empresa", "Porque desactiva las copias de seguridad corporativas", "Porque cifra los servidores de la empresa a distancia", "Expone credenciales corporativas fuera de tus controles"], "ref": "Para quien ya lleva años en esto", "refClass": 6}, {"q": "¿Cuál de estas medidas pertenece a la fase de prevención frente al malware?", "options": ["Aislar de la red un equipo con comportamiento extraño", "Instalar software solo de fuentes oficiales", "Revisar inicios de sesión desde lugares inusuales", "Restaurar los sistemas desde copias aisladas"], "ref": "Prevenir", "refClass": 6}, {"q": "Una empresa ensaya un escenario de ransomware cada semestre. ¿Qué obtiene principalmente de esos ensayos?", "options": ["La garantía de que nunca sufrirá un ataque", "La eliminación de las vulnerabilidades existentes", "Un certificado que reemplaza las copias de seguridad", "Saber quién decide, quién restaura y cuánto tarda"], "ref": "El ensayo", "refClass": 6}]}, {"id": 5, "name": "Identidad, accesos y datos expuestos", "objective": "Que la persona entienda qué es una identidad digital, por qué las credenciales son el objetivo más buscado, qué significa que algo esté expuesto y por qué ciertas personas y proveedores requieren más atención.", "welcome": ["En los módulos anteriores vimos que casi todos los caminos llevan al mismo lugar: las credenciales, o sea, el usuario y la contraseña. En este módulo nos vamos a enfocar en la identidad digital: cómo protegerla, qué significa que esté expuesta, qué hacer cuando eso pasa y por qué algunas personas y algunos proveedores necesitan más cuidado que otros."], "classes": [{"id": 7, "title": "Cómo proteger tu identidad digital", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["Te hago una pregunta incómoda: ¿cuántas contraseñas distintas usas de verdad? Si eres como la mayoría, la respuesta es dos o tres, con variaciones. Hoy vamos a entender por qué eso es un problema."], "slug": "apertura"}, {"heading": "Una sola llave para todo", "kind": "normal", "paras": ["Imagina que tienes una sola llave que abre tu casa, tu carro, tu oficina y la caja fuerte. Es comodísimo. Hasta que la pierdes, o alguien la copia. En ese momento no perdiste una puerta, perdiste todas.", "Eso es exactamente lo que pasa cuando usas la misma contraseña en varios servicios. Si una tienda en línea donde te registraste hace años sufre una filtración, tu contraseña queda expuesta; con ella todas las cuentas donde la repetiste, incluido, muchas veces, el correo del trabajo."], "slug": "una-sola-llave-para-todo"}, {"heading": "Errores comunes", "kind": "normal", "paras": ["Los errores más comunes son tres. Contraseñas cortas. Contraseñas predecibles: el nombre del hijo, la fecha de cumpleaños, el equipo de fútbol, o la clásica \"123456\". Y, el más grave de todos, la reutilización."], "slug": "errores-comunes"}, {"heading": "Qué es una buena contraseña", "kind": "normal", "paras": ["Una buena contraseña es larga, única para cada servicio y difícil de adivinar. Una forma práctica de lograrlo es usar frases, varias palabras que para ti tengan sentido pero que nadie relacionaría contigo.", "Como nadie puede recordar cincuenta contraseñas distintas, existen los gestores de contraseñas: una especie de bóveda que las guarda todas, protegida por una sola clave muy fuerte. Tú recuerdas una; él recuerda el resto."], "slug": "que-es-una-buena-contrasena"}, {"heading": "Texto plano y hash", "kind": "normal", "paras": ["Un concepto más, porque lo vas a escuchar mucho. Cuando un servicio guarda tu contraseña, lo correcto es que no la guarde tal cual, sino convertida en algo que se llama hash: una especie de huella que no se puede leer y que no permite volver fácilmente a la contraseña original. Si un servicio guarda la contraseña tal cual, en texto plano, y sufre una filtración, la contraseña queda expuesta de inmediato. Por eso, cuando se habla de una filtración, una de las primeras preguntas es si las contraseñas estaban en texto plano o con hash."], "slug": "texto-plano-y-hash"}, {"heading": "Una segunda prueba", "kind": "normal", "paras": ["Acabamos de ver que las contraseñas se filtran, se reutilizan y se roban. Entonces la pregunta lógica es: ¿y si la contraseña no fuera suficiente para entrar? De eso se trata la verificación en dos pasos.", "La verificación en dos pasos, también llamada autenticación multifactor o MFA, consiste en pedir dos pruebas distintas de que eres tú. Esas pruebas vienen de tres tipos: algo que sabes, como una contraseña; algo que tienes, como tu celular; y algo que eres, como tu huella o tu cara.", "Piensa en el cajero automático. Necesitas la tarjeta, que es algo que tienes, más la clave, que es algo que sabes. Si alguien se roba solo la tarjeta, no le sirve. Si alguien solo sabe la clave, tampoco."], "slug": "una-segunda-prueba"}, {"heading": "Por qué cambia todo", "kind": "normal", "paras": ["Con la verificación en dos pasos, una contraseña robada deja de ser suficiente. Alguien puede tener tu clave de una filtración vieja, pero si no tiene tu celular, no entra. Es de las medidas que más reduce el riesgo con menos esfuerzo."], "slug": "por-que-cambia-todo"}, {"heading": "Los tipos", "kind": "normal", "paras": ["Hay varias formas. Un código que te llega por mensaje de texto. Un código que genera una aplicación en tu celular y cambia cada pocos segundos. Una notificación en la que solo aceptas o rechazas. También llaves físicas, unos dispositivos pequeños que se conectan al equipo. Todas suman; unas son más fuertes que otras, pero cualquiera es mejor que nada."], "slug": "los-tipos"}, {"heading": "No es infalible", "kind": "normal", "paras": ["Ahora, ojo: no es magia. El engaño sigue funcionando. Si alguien te llama y te convence de que le dictes el código que te acaba de llegar, la verificación en dos pasos no te protege, porque tú mismo le diste la segunda llave. Por eso la regla del módulo 3 sigue vigente: ese código es tuyo y de nadie más. Si te llegan notificaciones para aprobar un acceso que no estás haciendo, recházalas y cambia tu contraseña."], "slug": "no-es-infalible"}, {"heading": "Dónde activarla primero", "kind": "normal", "paras": ["Si vas a empezar por algún lado, empieza por tres: tu correo, porque desde ahí se recuperan casi todas las demás cuentas; tu banco; y tus cuentas de trabajo."], "slug": "donde-activarla-primero"}, {"heading": "Filtración", "kind": "normal", "paras": ["Ahora vamos a juntar varias cosas que ya vimos. Sabemos que las contraseñas se filtran y que se roban. La pregunta es: ¿qué significa exactamente que una credencial esté expuesta? ¿Qué se hace cuando eso pasa?", "Una filtración es cuando la información de un servicio queda expuesta o es obtenida por alguien que no debía tenerla. Puede ser por un ataque, por un error de configuración o por un descuido. No tiene que ser de tu empresa: muchas veces la filtración es de un tercero, una tienda, una aplicación, una red social, donde tú o tus empleados se registraron con el correo del trabajo."], "slug": "filtracion"}, {"heading": "Credencial expuesta", "kind": "normal", "paras": ["Una credencial expuesta es un usuario y una contraseña que dejaron de ser secretos. Pueden venir de una filtración, de un stealer log como vimos en el módulo anterior, o de un documento publicado por error."], "slug": "credencial-expuesta"}, {"heading": "No todas pesan igual", "kind": "normal", "paras": ["Aquí está el punto importante: no todas las credenciales expuestas son igual de graves. Hay que preguntarse cuatro cosas. ¿La contraseña está legible o con hash? ¿Todavía funciona o ya se cambió? ¿A qué da acceso? ¿Y de quién es? No es lo mismo la contraseña vieja de un practicante en una red social que la contraseña vigente de un administrador del sistema financiero."], "slug": "no-todas-pesan-igual"}, {"heading": "Qué se hace", "kind": "normal", "paras": ["Cuando se confirma una exposición, la respuesta tiene cuatro pasos. Cambiar la contraseña. Cerrar las sesiones activas de esa cuenta. Activar la verificación en dos pasos si no la tenía. Después, revisar los accesos recientes para ver si alguien ya la usó."], "slug": "que-se-hace"}, {"heading": "La gestión", "kind": "normal", "paras": ["Aquí aparece otra vez la idea que nos acompaña desde el primer módulo. Detectar que una credencial está expuesta no sirve de nada si nadie hace algo. Cada exposición debería tener un responsable, una acción concreta, un plazo según su gravedad y un registro de qué se hizo y cuándo. Ese registro es lo que, meses después, permite demostrar ante una auditoría que la organización actuó."], "slug": "la-gestion"}, {"heading": "Las personas clave", "kind": "normal", "paras": ["Para cerrar este módulo, dos ideas que cambian cómo se prioriza en una organización: no todas las personas tienen el mismo nivel de riesgo; la seguridad de tu empresa también depende de empresas que no son la tuya.", "En toda organización hay personas cuyo acceso o cuya identidad vale más: los directivos, que pueden autorizar pagos y tienen información estratégica; los administradores de sistemas, que tienen las llaves de todo; el área financiera; y cualquiera con acceso a información muy sensible.", "Por eso son un objetivo prioritario. Si se compromete la cuenta de un directivo, el impacto es mucho mayor que el de una cuenta sin privilegios. Además, su identidad se puede suplantar: un mensaje \"del gerente\" pidiendo una transferencia urgente es de los engaños más costosos que existen.", "Esto no quiere decir que solo ellos importen. Quiere decir que, cuando hay que priorizar, sus casos van primero y necesitan más protección: verificación en dos pasos obligatoria, más vigilancia de su exposición y respuestas más rápidas."], "slug": "las-personas-clave"}, {"heading": "Mínimo privilegio", "kind": "normal", "paras": ["Hay un principio que ayuda muchísimo: el mínimo privilegio. Cada persona debe tener solo el acceso que necesita para hacer su trabajo, ni uno más. Si la cuenta de alguien se compromete, el daño queda limitado a lo que esa cuenta podía hacer."], "slug": "minimo-privilegio"}, {"heading": "Los proveedores", "kind": "normal", "paras": ["Ahora la segunda idea. Tu empresa trabaja con proveedores: el que maneja la nómina, el que hace el soporte técnico, el que presta el software de facturación. Muchos tienen acceso a tus sistemas o a tus datos. Si uno de ellos sufre un incidente, ese problema puede llegar hasta ti. A eso se le dice riesgo de terceros.", "Es como prestarle la llave de tu casa al de la limpieza. Confías en él, pero si a él le roban el llavero, también está tu llave."], "slug": "los-proveedores"}, {"heading": "Qué se hace con los proveedores", "kind": "normal", "paras": ["No se trata de desconfiar de todos, sino de ser ordenado. Clasificar a los proveedores según qué tan críticos son. Revisar su nivel de seguridad, sobre todo de los más críticos. Pedir en los contratos que cumplan ciertas medidas y que avisen si sufren un incidente. Darles solo el acceso que necesitan, el mismo principio de mínimo privilegio."], "slug": "que-se-hace-con-los-proveedores"}, {"heading": "Para quien ya lleva años en esto", "kind": "expert", "paras": ["Si eres técnico, sabes que el hash solo protege si se usa bien: con algoritmos adecuados para contraseñas, con valores aleatorios por usuario. Un hash débil se revierte con poco esfuerzo. Por eso, aunque una filtración diga que las contraseñas estaban protegidas, la recomendación responsable sigue siendo cambiarlas.", "Con la verificación en dos pasos, no todos los factores son iguales: los códigos por SMS son más débiles que una aplicación, mientras que las llaves físicas basadas en estándares modernos resisten incluso los sitios de phishing más elaborados. La tendencia es priorizar esos métodos resistentes al phishing para los usuarios con más privilegios.", "Con las credenciales expuestas, el gran reto no es encontrarlas sino filtrar el ruido: duplicados, filtraciones recicladas, cuentas que ya no existen. Una buena práctica es validar antes de actuar, conservando la evidencia de cada validación con integridad comprobable, para que el proceso aguante una revisión.", "En cuanto a proveedores, varios de los incidentes más grandes de los últimos años entraron por la cadena de suministro, no por el objetivo directo. Por eso la evaluación de terceros dejó de ser un cuestionario anual; se está moviendo hacia la vigilancia continua de su exposición, igual que se hace con la propia organización."], "slug": "para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["Reutilizar contraseñas convierte una filtración en muchas. Una buena contraseña es larga, única, difícil de adivinar; un gestor de contraseñas resuelve el problema de recordarlas. No es lo mismo una contraseña filtrada en texto plano que una con hash, aunque en los dos casos toca cambiarla.", "La verificación en dos pasos pide dos pruebas distintas de que eres tú, por eso una contraseña robada ya no alcanza. Eso sí, no te protege si tú mismo entregas el código. Actívala primero en el correo, el banco, las cuentas de trabajo.", "Una filtración puede venir de un tercero, no solo de tu empresa. Una credencial expuesta es la que dejó de ser secreta, pero no todas pesan igual: depende de si está legible, si sigue vigente, qué abre, de quién es. La respuesta es cambiarla, cerrar sesiones, activar MFA, revisar, dejando todo gestionado con su registro.", "Por último, las personas con acceso crítico tienen más impacto si se comprometen, por eso se priorizan con más protección. El mínimo privilegio limita el daño. Los proveedores con acceso te pueden heredar su riesgo, de ahí que la gestión de terceros se base en clasificar, revisar, exigir y limitar.", "Con esto cerramos el módulo 5. Vamos al cuestionario final."], "slug": "lo-que-debes-llevarte"}], "check": [{"q": "Una tienda en línea donde te registraste hace años sufre una filtración. Usabas la misma contraseña en el correo del trabajo. ¿Qué riesgo se materializa?", "options": ["Ninguno, si la tienda guardaba las contraseñas con hash", "Se bloquea de forma automática el correo del trabajo", "Solo se compromete la cuenta de la tienda afectada", "Una filtración se convierte en muchas"], "rationales": ["Un hash débil se revierte con poco esfuerzo; la recomendación sigue siendo cambiarla.", "Ningún servicio bloquea la cuenta por una filtración ajena.", "La contraseña sirve en cualquier servicio donde se haya repetido.", "Con una contraseña reutilizada, quien la obtiene puede entrar a todas las cuentas que la comparten."], "answer": 3, "refClass": 7, "ref": "Una sola llave para todo"}, {"q": "¿Cuál de estas contraseñas sigue mejor las recomendaciones de la clase?", "options": ["Una clave corta con símbolos que usas en todo", "Una frase larga y única que nadie asociaría contigo", "El nombre de tu hijo seguido de su año de nacimiento", "La misma clave robusta para el correo y el banco"], "rationales": ["Es corta y reutilizada, dos de los errores más comunes.", "Es larga, única para cada servicio y difícil de adivinar.", "Es predecible: datos personales que un atacante puede averiguar.", "Aunque sea robusta, reutilizarla multiplica el impacto de una filtración."], "answer": 1, "refClass": 7, "ref": "Qué es una buena contraseña"}, {"q": "Un servicio filtrado almacenaba las contraseñas en texto plano. ¿Qué implica esto?", "options": ["Solo quedan expuestos los nombres de usuario", "Las contraseñas no se pueden leer sin un ataque adicional", "La filtración no afecta a los usuarios que tienen MFA", "Las contraseñas quedan expuestas y legibles de inmediato"], "rationales": ["En texto plano, las contraseñas también quedan expuestas.", "Eso describe un almacenamiento con hash, no en texto plano.", "La verificación en dos pasos ayuda, pero la contraseña igual queda expuesta y debe cambiarse.", "Sin hash, cualquiera que tenga la filtración puede leerlas tal cual."], "answer": 3, "refClass": 7, "ref": "Texto plano y hash"}, {"q": "En la verificación en dos pasos, ¿a qué tipo de factor corresponde una huella dactilar?", "options": ["Algo que eres", "Algo que tienes", "Algo que haces", "Algo que sabes"], "rationales": ["Los rasgos biométricos, como la huella o el rostro, son algo que eres.", "Algo que tienes es, por ejemplo, tu celular o una llave física.", "No es uno de los tres tipos de factor que describe la clase.", "Algo que sabes es, por ejemplo, una contraseña o un PIN."], "answer": 0, "refClass": 7, "ref": "Una segunda prueba"}, {"q": "Recibes en tu celular varias notificaciones para aprobar un inicio de sesión que no estás haciendo. ¿Qué debes hacer?", "options": ["Ignorarlas, porque la MFA ya te protege", "Desactivar la verificación en dos pasos", "Rechazarlas y cambiar tu contraseña", "Aprobar una para que dejen de llegar"], "rationales": ["La contraseña está comprometida y debe cambiarse.", "Eliminarías justo la barrera que está impidiendo el acceso.", "Si llegan solicitudes que no hiciste, alguien ya tiene tu contraseña.", "Aprobarla le entrega el acceso al atacante."], "answer": 2, "refClass": 7, "ref": "No es infalible"}, {"q": "Debes priorizar varias credenciales expuestas. ¿Cuál requiere atención primero?", "options": ["La contraseña antigua de un practicante en una red social personal", "Un usuario sin contraseña de un servicio que ya fue retirado", "La contraseña vigente de un administrador de sistemas financieros", "Una credencial con hash de una cuenta que ya fue desactivada"], "rationales": ["Es antigua, de bajo privilegio y en un servicio no corporativo.", "Sin contraseña ni servicio activo, el riesgo es muy bajo.", "Está vigente, abre sistemas críticos y pertenece a una cuenta con privilegios.", "La cuenta ya no existe, así que su impacto actual es mínimo."], "answer": 2, "refClass": 7, "ref": "No todas pesan igual"}, {"q": "Un empleado de contabilidad tiene permisos de administrador en todos los servidores \"por si acaso\". ¿Qué principio se incumple?", "options": ["Riesgo de terceros", "Defensa en profundidad", "Mínimo privilegio", "Trazabilidad"], "rationales": ["Se refiere al riesgo que llega a través de proveedores.", "Se refiere a proteger por capas, no a cuánto acceso tiene cada cuenta.", "Cada persona debe tener solo el acceso que necesita; si la cuenta se compromete, el daño queda limitado.", "Se refiere a poder reconstruir quién hizo qué, no a los permisos."], "answer": 2, "refClass": 7, "ref": "Mínimo privilegio"}, {"q": "La empresa que gestiona tu nómina sufre un incidente y los datos de tus empleados quedan expuestos. ¿Qué medida reduce mejor este tipo de riesgo?", "options": ["Confiar en que el proveedor gestionará sus incidentes", "Exigir controles y aviso de incidentes por contrato", "Dejar de trabajar con cualquier proveedor externo", "Darle al proveedor acceso total para agilizar el soporte"], "rationales": ["Sin requisitos ni seguimiento, su riesgo se hereda sin control.", "Junto con clasificar, revisar y limitar el acceso, es la base de la gestión de terceros.", "No se trata de desconfiar de todos, sino de gestionarlos con orden.", "Va en contra del mínimo privilegio y amplía el impacto de un incidente."], "answer": 1, "refClass": 7, "ref": "Qué se hace con los proveedores"}], "words": 1716}], "quiz": [{"q": "¿Por qué se recomienda activar primero la verificación en dos pasos en el correo?", "options": ["Porque el correo es el único servicio que admite esa verificación", "Porque desde el correo se recuperan casi todas las demás cuentas", "Porque los códigos por SMS no funcionan en otros servicios", "Porque el correo corporativo nunca aparece en filtraciones"], "ref": "Dónde activarla primero", "refClass": 7}, {"q": "Un atacante llama a un usuario, se hace pasar por el banco y consigue el código de verificación. ¿Por qué falló la verificación en dos pasos?", "options": ["El usuario entregó la segunda prueba voluntariamente", "El banco no guardaba las contraseñas con hash", "El atacante rompió el cifrado del código enviado", "La verificación por SMS no funciona en cuentas bancarias"], "ref": "No es infalible", "refClass": 7}, {"q": "Para los usuarios con más privilegios, ¿qué método de verificación se recomienda priorizar?", "options": ["Llaves físicas resistentes al phishing", "Preguntas de seguridad personales", "Códigos enviados por mensaje de texto", "Notificaciones de aprobación en el celular"], "ref": "Para quien ya lleva años en esto", "refClass": 7}, {"q": "¿Qué cuatro preguntas determinan qué tan crítica es una credencial expuesta?", "options": ["Su longitud, sus símbolos, su antigüedad y su dominio", "Cuándo se filtró, dónde, cuántas veces y en qué idioma", "Quién la publicó, su precio, su fuente y su formato", "Si es legible, si sigue vigente, qué abre y de quién es"], "ref": "No todas pesan igual", "refClass": 7}, {"q": "¿Por qué los directivos requieren protección prioritaria?", "options": ["Sus contraseñas suelen ser más débiles que las de otros", "Tienen menos conocimientos técnicos que el resto", "Comprometer su cuenta tiene mayor impacto", "Son los únicos con acceso a información sensible"], "ref": "Las personas clave", "refClass": 7}, {"q": "Al confirmar una credencial expuesta, se cambia la contraseña, se cierran sesiones, se activa MFA y se revisan accesos. ¿Qué completa la gestión del caso?", "options": ["Un responsable, un plazo y el registro de lo realizado", "Publicar la credencial afectada para alertar a otros", "Eliminar el caso para mantener limpio el tablero", "Esperar a la siguiente auditoría para documentarlo"], "ref": "La gestión", "refClass": 7}]}, {"id": 6, "name": "Vulnerabilidades y pruebas de seguridad", "objective": "Que la persona entienda qué es una vulnerabilidad, cómo se identifican y miden, por qué no todas se corrigen al mismo tiempo y qué papel juegan las pruebas de seguridad autorizadas.", "welcome": ["En este módulo vamos a entrar en un tema que suena muy técnico pero que, explicado bien, cualquiera entiende: las vulnerabilidades. Vamos a ver qué son, cómo se les pone nombre y se mide su gravedad, por qué una organización no puede corregirlas todas al mismo tiempo y qué papel juegan las pruebas de seguridad que se hacen con autorización."], "classes": [{"id": 8, "title": "Vulnerabilidades, de la falla a la decisión", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["Todo el software tiene errores. El de tu celular, el de tu banco, el de la empresa más grande del mundo. No es porque los programadores sean malos; es porque el software es enormemente complejo y lo escriben personas. Algunos de esos errores no pasan de ser molestos. Otros abren una puerta. A esos últimos les decimos vulnerabilidades."], "slug": "apertura"}, {"heading": "Tres palabras", "kind": "normal", "paras": ["Hoy vamos a aprender tres palabras que siempre van juntas.", "La vulnerabilidad es la debilidad: un error en un programa, en un sistema o en cómo se configuró algo, que alguien podría aprovechar. Volviendo a la casa, es la ventana que no cierra bien.", "El exploit es la forma de aprovechar esa debilidad. Es saber que, si empujas la ventana de cierta manera, se abre.", "El parche es la corrección. Es cuando el fabricante arregla la ventana y te manda la pieza nueva. Esa es justamente la famosa actualización que te pide el celular."], "slug": "tres-palabras"}, {"heading": "La ventana de riesgo", "kind": "normal", "paras": ["Ahora, aquí hay algo que casi nadie piensa. Cuando el fabricante publica un parche, también está avisando que esa falla existía. A partir de ese momento hay una carrera: la organización tiene que instalar el parche antes de que alguien aproveche la falla. El tiempo entre que la falla se conoce y que tú la corriges es tu ventana de riesgo. Mientras más larga, peor.", "Por eso actualizar no es un trámite molesto: es literalmente cerrar la ventana."], "slug": "la-ventana-de-riesgo"}, {"heading": "Por qué no siempre se actualiza de inmediato", "kind": "normal", "paras": ["Si es tan importante, ¿por qué las empresas no actualizan todo apenas sale? Porque en una organización, actualizar un sistema importante puede detener la operación, puede romper algo que dependía de la versión anterior o necesita probarse primero. Por eso existen las mitigaciones temporales: medidas para reducir el riesgo mientras se puede aplicar el parche."], "slug": "por-que-no-siempre-se-actualiza-de-inmediato"}, {"heading": "CVE: el nombre de cada falla", "kind": "normal", "paras": ["Si cada empresa le pusiera un nombre distinto a cada falla, sería imposible coordinarse. Imagínate que tu proveedor te dice \"tenemos el problema de la ventana del segundo piso\" y tú lo llamas \"la falla de la ventana norte\". Nadie sabría si hablan de lo mismo. Vamos a ver cómo se resolvió eso y cómo se mide qué tan grave es una falla.", "Cuando se descubre una vulnerabilidad en un software conocido, se le asigna un identificador público llamado CVE. Es como el número de cédula de esa falla. Tiene un formato con el año y un número; gracias a él todo el mundo, en cualquier país, sabe exactamente de qué falla se está hablando."], "slug": "cve-el-nombre-de-cada-falla"}, {"heading": "CVSS: qué tan grave es", "kind": "normal", "paras": ["Luego viene la pregunta de qué tan grave es. Para eso existe el CVSS, una escala de cero a diez que mide la severidad técnica. Toma en cuenta cosas como qué tan fácil es aprovecharla, si se necesita un acceso previo y qué tanto daño podría causar en la tríada: confidencialidad, integridad y disponibilidad. Un 9 o un 10 es crítico; un 2 es bajo."], "slug": "cvss-que-tan-grave-es"}, {"heading": "EPSS: qué tan probable es", "kind": "normal", "paras": ["Pero una falla puede ser muy grave en teoría y que casi nadie la use en la práctica. Para eso existe el EPSS, que estima qué tan probable es que esa falla sea aprovechada en el mundo real en los próximos días. Es como el pronóstico del clima: no te dice qué tan fuerte puede ser la tormenta, sino qué tan probable es que llueva."], "slug": "epss-que-tan-probable-es"}, {"heading": "El catálogo de las que ya se están usando", "kind": "normal", "paras": ["Hay algo todavía más concreto: un catálogo público, mantenido por una agencia de ciberseguridad de Estados Unidos, que lista las vulnerabilidades que ya se sabe que están siendo aprovechadas en ataques reales. Se conoce como CISA KEV. Si una falla está en ese catálogo, ya no es un pronóstico: ya está lloviendo."], "slug": "el-catalogo-de-las-que-ya-se-estan-usando"}, {"heading": "Ninguna cifra sola cuenta la historia", "kind": "normal", "paras": ["La lección aquí es que cada número responde una pregunta distinta. CVSS responde qué tan grave podría ser. EPSS, qué tan probable es que se use. El catálogo, si ya se está usando. Mirar solo uno es como decidir si sales con paraguas viendo solo la temperatura."], "slug": "ninguna-cifra-sola-cuenta-la-historia"}, {"heading": "No todo es urgente", "kind": "normal", "paras": ["Hagamos un ejercicio. Imagina que eres el responsable de seguridad de una empresa y un lunes te llega un reporte con dos mil vulnerabilidades. Tienes un equipo de tres personas. ¿Por dónde empiezas? Esa es la pregunta que vamos a responder ahora, una de las más importantes de todo el curso.", "La primera reacción es empezar por las de puntaje más alto, o atenderlas en el orden en que aparecen. Las dos son malas ideas. Si las atiendes en orden, puedes pasarte meses arreglando cosas menores mientras la falla peligrosa sigue abierta. Si solo miras el puntaje de severidad, puedes ignorar algo de puntaje medio que ya se está usando en ataques reales."], "slug": "no-todo-es-urgente"}, {"heading": "Los criterios", "kind": "normal", "paras": ["Para priorizar bien hay que mirar varias cosas a la vez. La severidad técnica, el CVSS que acabamos de ver. La probabilidad de que se aproveche. Si ya está siendo aprovechada en el mundo real. Una que casi siempre se olvida: qué tan importante es el activo afectado para el negocio."], "slug": "los-criterios"}, {"heading": "La criticidad del activo", "kind": "normal", "paras": ["Esto último cambia todo. La misma falla en el servidor de pruebas que nadie usa y en el sistema que procesa los pagos no tiene el mismo riesgo. Por eso las organizaciones maduras clasifican sus activos por niveles de importancia, desde los que controlan toda la infraestructura y las llamadas joyas de la corona, hasta los que son importantes pero no críticos. Lo hacen desde el principio, no cuando ya están apagando incendios."], "slug": "la-criticidad-del-activo"}, {"heading": "Un ejemplo", "kind": "normal", "paras": ["Tienes dos fallas. La primera tiene severidad alta, pero está en un servidor interno, aislado, sin evidencia de que alguien la esté usando. La segunda tiene severidad media, pero está en el portal de pagos, expuesto a Internet, además de aparecer en el catálogo de las que ya se están explotando. ¿Cuál va primero? La segunda, sin duda, aunque su número sea menor."], "slug": "un-ejemplo"}, {"heading": "Priorizar es decidir", "kind": "normal", "paras": ["Priorizar no es ignorar lo demás; es decidir el orden para reducir más riesgo con el mismo esfuerzo. Es una decisión que se puede explicar y defender ante la gerencia, porque se basa en criterios claros y no en intuición."], "slug": "priorizar-es-decidir"}, {"heading": "Qué es el hacking ético", "kind": "normal", "paras": ["Cuando la gente escucha \"hacking ético\", suele pensar que es una contradicción. ¿Cómo va a ser ético entrar a un sistema? Vamos a ver por qué no solo es ético, sino que es una de las herramientas más útiles que tiene una organización para tomar buenas decisiones.", "El hacking ético es evaluar la seguridad de un sistema, con autorización de su dueño, para encontrar y demostrar los riesgos antes de que alguien con malas intenciones lo haga. Es como contratar a un experto en cerraduras para que revise tu casa y te diga qué puerta o qué ventana está más débil. Él no se lleva nada; te entrega un informe."], "slug": "que-es-el-hacking-etico"}, {"heading": "Lo que lo hace ético", "kind": "normal", "paras": ["Hay cuatro cosas que lo diferencian de un ataque real. La autorización: el dueño lo pidió y lo aprobó por escrito. El alcance: se acuerda exactamente qué se puede probar y qué no. La coordinación: se programa con el equipo que opera los sistemas, para no afectar el servicio. Por último, el reporte: todo lo que se encuentra se documenta y se entrega a la organización. Sin cualquiera de esas cuatro, deja de ser ético."], "slug": "lo-que-lo-hace-etico"}, {"heading": "Escanear no es lo mismo que validar", "kind": "normal", "paras": ["Aquí hay una diferencia que vale la pena entender. Un escaneo es una revisión automática que detecta posibles fallas, como un detector de humo. La validación va un paso más allá: confirma, de forma controlada, si esa falla realmente se puede aprovechar en ese entorno y qué impacto tendría. El escaneo te dice \"aquí puede haber un problema\"; la validación te dice \"sí, aquí hay un problema real; esto es lo que podría pasar\".", "Hoy existen incluso formas de hacer esa validación de manera automatizada, con apoyo de inteligencia artificial, siempre dentro del alcance autorizado y dejando registro de cada paso."], "slug": "escanear-no-es-lo-mismo-que-validar"}, {"heading": "Qué entrega", "kind": "normal", "paras": ["Una prueba de seguridad bien hecha entrega hallazgos, el impacto que tendrían, la evidencia que lo respalda y recomendaciones para corregir. Lo que nunca entrega es un manual para hacer daño. Su objetivo es que la organización corrija."], "slug": "que-entrega"}, {"heading": "Por qué sirve para decidir", "kind": "normal", "paras": ["Volvamos a la priorización. Si tienes dos mil vulnerabilidades y validas las más prioritarias, ahora sabes con certeza cuáles son reales y cuál es su impacto. Eso te permite justificar ante la gerencia por qué hay que detener un sistema para actualizarlo, o por qué vale la pena invertir en corregir algo. Es pasar de \"el escáner dice\" a \"lo comprobamos y esto es lo que está en juego\"."], "slug": "por-que-sirve-para-decidir"}, {"heading": "Para quien ya lleva años en esto", "kind": "expert", "paras": ["Si eres técnico, sabes que las vulnerabilidades se encuentran de dos grandes formas: revisando el código desde adentro, lo que se conoce como análisis estático, o probando la aplicación mientras funciona, lo que se conoce como análisis dinámico. Cada una ve cosas que la otra no, por eso las organizaciones maduras combinan las dos.", "Sobre la medición, el CVSS base no considera el contexto de tu organización: el mismo puntaje en un activo expuesto a Internet que en uno aislado tiene implicaciones muy distintas. Por eso la tendencia es construir indicadores propios que combinen severidad, probabilidad, explotación conocida y criticidad del activo, en lugar de priorizar solo por el número base.", "A la hora de priorizar, el gran problema no es detectar, es la fatiga: listas interminables que nadie termina. Las organizaciones que avanzan son las que pasan de \"cuántas vulnerabilidades tengo\" a \"cuánto riesgo real reduje este mes\", acordando con el negocio plazos de corrección según el nivel de prioridad.", "En las pruebas de seguridad, el valor no está en la cantidad de hallazgos sino en traducirlos a impacto de negocio. Para comunicarlos se usan marcos de referencia como MITRE ATT&amp;CK o la Cyber Kill Chain, que permiten describir lo observado con un lenguaje común. Ten presente también que una prueba en producción sin coordinación puede generar alertas o afectar el servicio; por eso la planeación es tan importante como la ejecución."], "slug": "para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["La vulnerabilidad es la debilidad, el exploit es la forma de aprovecharla, el parche es la corrección. El tiempo que pasa desde que la falla se conoce hasta que se corrige es la ventana de riesgo; cuando no se puede parchar de inmediato, se mitiga.", "Para nombrarlas y medirlas: CVE es el nombre único de cada falla, CVSS mide su severidad técnica de cero a diez, EPSS estima la probabilidad de que se use, el catálogo de explotadas conocidas dice si ya se está usando. Ninguna cifra sola alcanza para decidir.", "Como no se puede corregir todo al mismo tiempo, se prioriza combinando severidad, probabilidad, explotación real y criticidad del activo. Un puntaje menor puede ser más urgente si el activo es crítico y la falla ya se está usando. Priorizar es decidir dónde se reduce más riesgo con el mismo esfuerzo.", "Por último, el hacking ético es una evaluación autorizada para encontrar riesgos antes que otros. Lo hacen ético la autorización, el alcance, la coordinación, el reporte. El escaneo detecta; la validación confirma. Con ese resultado se decide, con evidencia, qué corregir primero.", "Con esto cerramos el módulo 6. Vamos al cuestionario final."], "slug": "lo-que-debes-llevarte"}], "check": [{"q": "En la analogía de la casa, ¿qué representa el exploit?", "options": ["La manera de abrir la ventana defectuosa", "La pieza nueva que envía el fabricante", "El tiempo que la ventana permanece abierta", "La ventana que no cierra bien"], "rationales": ["El exploit es la forma concreta de aprovechar la debilidad.", "Eso representa el parche.", "Eso se asemeja a la ventana de riesgo.", "Eso representa la vulnerabilidad."], "answer": 0, "refClass": 8, "ref": "Tres palabras"}, {"q": "¿Qué es la ventana de riesgo?", "options": ["La duración de una prueba de hacking ético", "El horario en que los sistemas están más expuestos", "El tiempo entre que se conoce una falla y se corrige", "El periodo en que un parche se prueba antes de instalarlo"], "rationales": ["No tiene relación con las pruebas de seguridad.", "No se refiere a un horario, sino al tiempo hasta la corrección.", "Mientras más larga, más oportunidad tiene un atacante de aprovecharla.", "Es parte del proceso, pero la ventana de riesgo abarca todo el tiempo sin corregir."], "answer": 2, "refClass": 8, "ref": "La ventana de riesgo"}, {"q": "Un sistema crítico no se puede actualizar hasta el fin de semana. ¿Qué corresponde hacer mientras tanto?", "options": ["Aceptar el riesgo sin documentarlo", "Solicitar un nuevo CVE para la falla", "Aplicar mitigaciones temporales", "Esperar sin cambios hasta el fin de semana"], "rationales": ["Aceptar un riesgo exige una decisión explícita y registrada.", "El CVE identifica la falla; no reduce el riesgo.", "Reducen el riesgo mientras se puede aplicar el parche.", "Deja la ventana de riesgo abierta sin ninguna medida."], "answer": 2, "refClass": 8, "ref": "Por qué no siempre se actualiza de inmediato"}, {"q": "¿Qué pregunta responde cada métrica?", "options": ["CVSS: probabilidad; EPSS: gravedad; KEV: explotación real", "CVSS: explotación real; EPSS: gravedad; KEV: probabilidad", "CVSS: gravedad; EPSS: probabilidad; KEV: explotación real", "CVSS: gravedad; EPSS: explotación real; KEV: probabilidad"], "rationales": ["CVSS mide la severidad técnica y EPSS la probabilidad; están invertidos.", "Las tres correspondencias están invertidas.", "Cada número responde una pregunta distinta, y ninguno alcanza por sí solo para decidir.", "EPSS es un pronóstico; KEV confirma que ya se está explotando."], "answer": 2, "refClass": 8, "ref": "Ninguna cifra sola cuenta la historia"}, {"q": "Una vulnerabilidad aparece en el catálogo CISA KEV. ¿Qué significa?", "options": ["Ya se sabe que se está aprovechando en ataques reales", "Tiene alta probabilidad de explotarse en los próximos días", "Fue reportada por una agencia de Estados Unidos", "Tiene una severidad CVSS de 9 o superior"], "rationales": ["Ya no es un pronóstico: ya está lloviendo.", "Eso lo estima EPSS; KEV confirma que ya ocurre.", "La agencia mantiene el catálogo, pero lo relevante es que la falla ya se explota.", "El catálogo no se basa en la severidad, sino en la explotación confirmada."], "answer": 0, "refClass": 8, "ref": "El catálogo de las que ya se están usando"}, {"q": "Falla A: CVSS alto en un servidor interno aislado, sin explotación conocida. Falla B: CVSS medio en el portal de pagos expuesto a Internet y listada en KEV. ¿Cuál va primero?", "options": ["La B, por la criticidad del activo y la explotación real", "Ambas al mismo tiempo, porque las dos son vulnerabilidades", "La A, porque su severidad técnica es mayor", "La que se haya reportado primero en el escáner"], "rationales": ["Un puntaje menor puede ser más urgente si el activo es crítico y la falla ya se está usando.", "Priorizar es decidir un orden; atender todo a la vez no reduce más riesgo.", "Priorizar solo por CVSS ignora el contexto y la explotación real.", "El orden de aparición no refleja el riesgo."], "answer": 0, "refClass": 8, "ref": "Un ejemplo"}, {"q": "¿Qué hace ético a un hacking ético?", "options": ["Que no encuentre vulnerabilidades críticas", "Que se realice sin avisar al equipo de operación", "El uso de herramientas comerciales y licenciadas", "Autorización, alcance, coordinación y reporte"], "rationales": ["El objetivo es encontrar riesgos, incluidos los críticos.", "La coordinación con quien opera los sistemas es una condición obligatoria.", "La ética no depende de las herramientas, sino de las condiciones de la prueba.", "Sin cualquiera de esas cuatro condiciones, deja de ser ético."], "answer": 3, "refClass": 8, "ref": "Lo que lo hace ético"}, {"q": "¿Cuál es la diferencia entre un escaneo y una validación?", "options": ["El escaneo señala posibles fallas; la validación las confirma", "El escaneo mide el EPSS; la validación calcula el CVSS", "El escaneo corrige fallas; la validación solo las documenta", "El escaneo es manual; la validación siempre es automática"], "rationales": ["La validación comprueba, de forma controlada, si la falla es aprovechable y qué impacto tendría.", "Son métricas de terceros, no lo que hacen el escaneo o la validación.", "Ninguno de los dos corrige; ambos informan para decidir.", "El escaneo es automático, y la validación puede ser manual o automatizada."], "answer": 0, "refClass": 8, "ref": "Escanear no es lo mismo que validar"}], "words": 1789}], "quiz": [{"q": "¿Qué es un CVE?", "options": ["El identificador único de una falla", "Un parche oficial publicado por el fabricante", "Una escala de cero a diez que mide la severidad", "Un catálogo de fallas que ya se explotan activamente"], "ref": "CVE: el nombre de cada falla", "refClass": 8}, {"q": "¿Por qué priorizar únicamente por CVSS puede llevar a malas decisiones?", "options": ["Porque solo aplica a sistemas operativos antiguos", "Porque mide la probabilidad y no la gravedad", "Ignora el contexto y la explotación real", "Porque se calcula solo después de aplicar el parche"], "ref": "Para quien ya lleva años en esto", "refClass": 8}, {"q": "Un equipo de tres personas recibe un reporte con 2.000 vulnerabilidades. ¿Cuál es el enfoque correcto?", "options": ["Esperar a contar con más personal antes de iniciar", "Combinar severidad, probabilidad, explotación y criticidad", "Atenderlas estrictamente en el orden en que aparecen", "Corregir primero todas las de mayor puntaje CVSS"], "ref": "Los criterios", "refClass": 8}, {"q": "Un escáner reporta una falla crítica en el ERP. Antes de detener el sistema para corregirla, la gerencia pide una justificación. ¿Qué aporta la validación?", "options": ["Evidencia de que la falla es real y de su impacto", "La autorización legal para atacar el sistema", "Un nuevo puntaje CVSS más alto para la falla", "La corrección automática de la vulnerabilidad"], "ref": "Por qué sirve para decidir", "refClass": 8}, {"q": "¿Qué combinación usan las organizaciones maduras para encontrar vulnerabilidades en su software?", "options": ["Análisis estático del código y dinámico con la aplicación en ejecución", "Solo el estático, porque revisar el código detecta todo antes de producción", "Las métricas CVSS y EPSS, que reemplazan la necesidad de hacer pruebas", "Solo el dinámico, porque revisar el código fuente ya no aporta valor"], "ref": "Para quien ya lleva años en esto", "refClass": 8}, {"q": "Una prueba de seguridad en producción se ejecutó sin coordinar con operaciones y provocó una caída del servicio. ¿Qué principio se omitió?", "options": ["El cálculo del EPSS de cada vulnerabilidad", "La entrega de un manual de explotación", "La coordinación con quien opera los sistemas", "La asignación de un CVE a cada hallazgo"], "ref": "Lo que lo hace ético", "refClass": 8}]}, {"id": 7, "name": "Gestión de amenazas: de la alerta a la acción", "objective": "Que la persona entienda que la seguridad no termina en detectar: se gestiona. Que conozca el ciclo completo (detectar, validar, priorizar, asignar, responder, evidenciar y medir) y cómo una organización pasa de reaccionar a anticiparse.", "welcome": ["Llegamos al último módulo, el que conecta todo. Durante el curso hemos visto amenazas, debilidades, engaños y exposiciones. Ahora vamos a ver lo que de verdad reduce el riesgo: gestionar. Es decir, qué pasa desde que se detecta algo hasta que se resuelve, se demuestra y se aprende de ello. Este módulo es el que separa a una organización que reacciona de una que se anticipa."], "classes": [{"id": 9, "title": "Gestionar, no solo detectar", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["¿Te acuerdas del guardia del castillo que veía al enemigo, lo anotaba en un cuaderno y se iba a dormir? En el primer módulo te dije que lo íbamos a retomar. Hoy es ese día."], "slug": "apertura"}, {"heading": "El hospital", "kind": "analogy", "paras": ["Piensa en la sala de urgencias de un hospital. Llega un paciente y no lo atienden por orden de llegada. Primero alguien lo evalúa: ¿es grave o no? Eso se llama triage. Luego se le asigna a un médico. Se le hace un tratamiento siguiendo un protocolo. Se registra todo en la historia clínica. Cuando está bien, se le da de alta.", "La gestión de amenazas funciona exactamente igual."], "slug": "el-hospital"}, {"heading": "Las etapas", "kind": "normal", "paras": ["Primero, la detección: aparece algo, una alerta, una credencial expuesta, una página falsa, una vulnerabilidad. Segundo, la validación: ¿esto es real? ¿Nos afecta de verdad? Tercero, la priorización: ¿qué tan grave es y qué tan importante es lo que está en juego? Cuarto, la asignación: ¿quién se encarga y en cuánto tiempo? Quinto, la respuesta: se ejecuta la acción. Sexto, la evidencia: se registra qué se hizo. Séptimo, el cierre."], "slug": "las-etapas"}, {"heading": "Falsos positivos", "kind": "normal", "paras": ["En la validación pasa algo muy común: descubres que la alerta no era real, o que no te afecta. A eso se le dice falso positivo. Aquí va algo importante: descartar también es gestionar. Marcarlo como falso positivo, con la razón, evita que alguien lo vuelva a revisar mañana y deja constancia de que se tomó una decisión."], "slug": "falsos-positivos"}, {"heading": "Los playbooks", "kind": "normal", "paras": ["Para responder, las organizaciones usan playbooks. Un playbook es un procedimiento escrito que dice qué hacer ante cada tipo de situación, paso a paso. Igual que el protocolo médico para un infarto. La gran ventaja es que el analista nuevo responde igual que el que lleva diez años, sin que nadie tiene que inventar la respuesta en medio de la presión."], "slug": "los-playbooks"}, {"heading": "Priorizar con criterio", "kind": "normal", "paras": ["Ya vimos el ciclo completo. Ahora nos detenemos en la parte donde la mayoría de las organizaciones falla: decidir qué va primero, quién lo hace y para cuándo.", "Ya lo vimos con las vulnerabilidades, pero aplica para todo: no todo es igual de urgente. Para decidir se combinan dos cosas: qué tan grave es la situación y qué tan importante es lo que está en juego. Una credencial expuesta de un directivo, vigente, va antes que una credencial vieja de una cuenta que ya no existe. Una página falsa del portal de pagos va antes que un perfil que usó el logo una vez."], "slug": "priorizar-con-criterio"}, {"heading": "Un responsable", "kind": "normal", "paras": ["Luego, cada caso necesita un responsable. Una persona con nombre propio. No \"el área de TI\", no \"seguridad\": alguien. Porque cuando un caso es de todos, en la práctica no es de nadie: se queda ahí, esperando."], "slug": "un-responsable"}, {"heading": "Un plazo", "kind": "normal", "paras": ["Cada caso necesita también un plazo. En seguridad a esto se le llama SLA, que es el tiempo máximo acordado para atender algo. La regla es sencilla: mientras más grave, menos tiempo. Un caso crítico se atiende en horas; uno bajo puede esperar algunos días. Lo importante es que el plazo esté definido de antemano, aprobado por la dirección, con alguien que avise antes de que se venza."], "slug": "un-plazo"}, {"heading": "Los estados", "kind": "normal", "paras": ["Para saber cómo va cada caso se usan estados. Algo así como: nuevo, en investigación, confirmado, falso positivo y resuelto. Con eso, en cualquier momento cualquiera puede saber cuántos casos hay, en qué van y cuáles están atrasados."], "slug": "los-estados"}, {"heading": "Lo que pasa sin esto", "kind": "normal", "paras": ["Para que veas por qué importa, piensa en cómo funciona en muchas empresas: llega un reporte en PDF al correo de alguien, esa persona lo reenvía, otra lo lee por encima y nadie sabe al final qué se hizo. Tres meses después ocurre un incidente y resulta que la causa estaba en ese reporte. No faltó información; faltó gestión."], "slug": "lo-que-pasa-sin-esto"}, {"heading": "Dato, información e inteligencia", "kind": "normal", "paras": ["Hasta ahora hemos hablado de responder a lo que ya pasó. Ahora vamos a hablar de cómo enterarse antes. De eso se trata la inteligencia de amenazas.", "Empecemos por una distinción que parece filosófica pero es muy práctica. Un dato es un hecho suelto: \"apareció este correo en una filtración\". Información es ese dato con algo de contexto: \"ese correo es de nuestra empresa\". E inteligencia es cuando eso te permite decidir: \"es de un administrador, la contraseña sigue vigente, hay que cambiarla hoy\".", "La inteligencia de amenazas es justamente eso: información sobre amenazas que fue recolectada, analizada y puesta en contexto para que alguien pueda decidir qué hacer."], "slug": "dato-informacion-e-inteligencia"}, {"heading": "De dónde viene", "kind": "normal", "paras": ["Viene de muchas fuentes: información pública, servicios especializados que vigilan de forma continua los espacios de los que hablamos en el módulo 2, comunidades donde organizaciones del mismo sector comparten lo que les pasa."], "slug": "de-donde-viene"}, {"heading": "Qué se vigila", "kind": "normal", "paras": ["Para una organización, lo más útil suele ser vigilar cuatro cosas. Menciones de su nombre o sus dominios en fuentes externas. Credenciales de sus empleados que aparezcan expuestas. Dominios, páginas o perfiles que se parezcan a los suyos. También el estado de seguridad de sus proveedores.", "Fíjate que cada una corresponde a un módulo del curso. Esto es lo que hace que todo encaje."], "slug": "que-se-vigila"}, {"heading": "Anticiparse", "kind": "normal", "paras": ["La gran ventaja es el tiempo. Si una organización se entera de que sus credenciales están circulando antes de que alguien las use, cambia una contraseña y listo. Si se entera después, está respondiendo a un incidente. La inteligencia convierte sorpresas en tareas.", "Pero solo si se traduce en acciones. Un reporte de inteligencia que nadie lee es igual al guardia que se fue a dormir."], "slug": "anticiparse"}, {"heading": "Compartir", "kind": "normal", "paras": ["Un punto más: compartir información dentro de un sector fortalece a todos. Si una entidad detecta una campaña de engaño dirigida a su sector y lo comparte, las demás pueden prepararse. Por eso existen los equipos sectoriales de respuesta a incidentes."], "slug": "compartir"}, {"heading": "Para quien ya lleva años en esto", "kind": "expert", "paras": ["Si eres técnico, sabes que este enfoque tiene nombre: gestión continua de la exposición a amenazas, o CTEM por sus siglas en inglés. La idea central es que no se trata de un proyecto con inicio y fin, sino de un ciclo permanente: definir alcance, descubrir, priorizar, validar, movilizar la respuesta. La exposición cambia todos los días.", "Los plazos solo funcionan si son realistas, acordados con el negocio en lugar de impuestos desde seguridad. Un SLA que siempre se incumple pierde credibilidad, así que lo recomendable es empezar con plazos alcanzables, medir el cumplimiento para luego ajustarlos con datos.", "La inteligencia, a su vez, se divide en niveles: estratégica, para la dirección; táctica, sobre cómo operan los atacantes; operativa, sobre indicadores concretos. El error más común es consumir mucha inteligencia genérica que no se cruza con los activos propios. La que más valor aporta es la que responde directo \"esto nos afecta, esto hay que hacer\"."], "slug": "para-quien-ya-lleva-anos-en-esto"}, {"heading": "Lo que debes llevarte", "kind": "summary", "paras": ["Gestionar es llevar un hallazgo desde que se detecta hasta que se cierra. Las etapas son detectar, validar, priorizar, asignar, responder, evidenciar y cerrar. Descartar un falso positivo también es gestionar. Los playbooks son los que hacen que la respuesta sea consistente.", "Para priorizar se combina la gravedad con la importancia de lo que está en juego. Cada caso necesita un responsable con nombre, un plazo según su gravedad, un estado que permita saber cómo va. Sin eso, la información se pierde aunque se haya detectado.", "La inteligencia es información puesta en contexto para decidir. Viene de fuentes públicas, especializadas o sectoriales; para una organización, lo que se vigila son menciones, credenciales, suplantaciones, proveedores. Su gran ventaja es el tiempo, pero solo sirve si termina en una acción.", "En la última clase vamos a ver cómo se demuestra lo que se hizo, para después medirlo y mejorarlo. Antes, unas preguntas rápidas para comprobar que quedó claro."], "slug": "lo-que-debes-llevarte"}], "check": [{"q": "En la analogía de la sala de urgencias, ¿a qué etapa de la gestión de amenazas se parece más el triage?", "options": ["Detección", "Priorización", "Cierre", "Asignación"], "rationales": ["La detección es el momento en que aparece la alerta, antes de evaluarla.", "El triage evalúa qué tan grave es cada caso para decidir qué se atiende primero.", "El cierre equivale al alta, al final del proceso.", "La asignación ocurre después: define quién atiende el caso."], "answer": 1, "refClass": 9, "ref": "El hospital"}, {"q": "Tras analizar una alerta, el analista confirma que no afecta a la organización. ¿Qué debe hacer?", "options": ["Descartarla como falso positivo, con la razón", "Dejarla abierta por si cambia la situación", "Borrarla del sistema para no generar ruido", "Escalarla al nivel crítico por precaución"], "rationales": ["Descartar también es gestionar: deja constancia de la decisión y evita revisarla de nuevo.", "Deja un caso pendiente sin razón y afecta los indicadores.", "Borrarla elimina la evidencia de que se tomó una decisión.", "Escalar algo validado como no relevante desvía recursos de lo urgente."], "answer": 0, "refClass": 9, "ref": "Falsos positivos"}, {"q": "¿Cuál es la principal ventaja de un playbook?", "options": ["Que define automáticamente la severidad de cada caso", "Que elimina la necesidad de validar las alertas", "Que reemplaza al responsable asignado a cada caso", "Respuestas consistentes, sin improvisar"], "rationales": ["La severidad se define en la priorización, no en el playbook.", "La validación sigue siendo una etapa necesaria.", "Cada caso sigue necesitando una persona responsable.", "El analista nuevo responde igual que el experimentado, sin inventar la respuesta bajo presión."], "answer": 3, "refClass": 9, "ref": "Los playbooks"}, {"q": "Un caso se asignó a \"el área de TI\" y lleva tres semanas sin avance. ¿Qué falló?", "options": ["No existía un playbook escrito para ese tipo de caso", "No se había calculado el EPSS del caso", "No tenía un responsable con nombre propio", "La alerta no había pasado por la etapa de validación"], "rationales": ["Un playbook ayuda, pero sin un responsable nadie lo ejecuta.", "El EPSS aplica a vulnerabilidades y no explica la falta de avance.", "Cuando un caso es de todos, en la práctica no es de nadie.", "El problema descrito es que nadie tomó el caso."], "answer": 2, "refClass": 9, "ref": "Un responsable"}, {"q": "¿Qué es un SLA en la gestión de amenazas y cómo se define?", "options": ["El tiempo que tarda un proveedor en responder un takedown", "El plazo máximo acordado, más corto a mayor gravedad", "El número de alertas que un analista atiende por día", "La lista de estados que puede tener cada caso"], "rationales": ["Ese tiempo depende del proveedor y no es un SLA interno.", "Un caso crítico se atiende en horas; uno bajo puede esperar algunos días.", "Eso sería una medida de capacidad, no un plazo de atención.", "Los estados indican el avance; el SLA define el plazo."], "answer": 1, "refClass": 9, "ref": "Un plazo"}, {"q": "¿Cuál de estas afirmaciones ya es inteligencia de amenazas y no solo un dato o información?", "options": ["Es de un administrador y sigue vigente: cambiarla hoy", "Ese correo filtrado pertenece al dominio de la empresa", "Cada día se publican miles de credenciales", "Apareció un correo electrónico en una filtración reciente"], "rationales": ["Aporta contexto suficiente para tomar una decisión concreta.", "Es un dato con contexto: información, pero aún no indica qué hacer.", "Es un dato general que no se relaciona con la organización.", "Es un hecho suelto: un dato."], "answer": 0, "refClass": 9, "ref": "Dato, información e inteligencia"}], "words": 1225}, {"id": 10, "title": "Demostrar, medir, mejorar", "sections": [{"heading": "Apertura", "kind": "opening", "paras": ["Imagina que una organización hizo todo bien: detectó una credencial expuesta, la priorizó, la cambió en una hora y cerró el caso. Seis meses después llega un auditor y pregunta: \"¿cómo me demuestras que lo hiciste?\". Si la respuesta es \"confía en mí\", tenemos un problema. Hoy hablamos de evidencia."], "slug": "apertura"}, {"heading": "Evidencia", "kind": "normal", "paras": ["La evidencia es todo lo que demuestra qué pasó y qué se hizo: capturas de pantalla, registros, documentos, correos de confirmación. Sin evidencia, una acción realizada y una acción no realizada se ven igual desde afuera."], "slug": "evidencia"}, {"heading": "Trazabilidad", "kind": "normal", "paras": ["La trazabilidad es poder reconstruir la historia completa: quién hizo qué, cuándo y por qué. Es como la historia clínica de un paciente: cualquier médico nuevo puede leerla y entender todo lo que pasó."], "slug": "trazabilidad"}, {"heading": "Cómo saber que no la cambiaron", "kind": "normal", "paras": ["Ahora, una evidencia solo vale si nadie la pudo alterar. Aquí vuelve un concepto que vimos con las contraseñas: el hash. Cuando se guarda un archivo de evidencia, se le calcula su huella. Si alguien cambia aunque sea una letra del archivo, la huella cambia por completo. Así se puede demostrar que el archivo es exactamente el mismo que se guardó ese día. Si además se registra la fecha y la hora exacta, se tiene una prueba muy sólida."], "slug": "como-saber-que-no-la-cambiaron"}, {"heading": "Cumplimiento", "kind": "normal", "paras": ["Esto conecta con algo qu
